[pytest]
# Repository-wide pytest configuration. Its presence anchors pytest's rootdir
# at the repository root, so node IDs and JUnit names are repo-relative no
# matter which test path a workflow passes.
#
# The discovery rules below are pytest's own defaults, written out so the
# collection contract is explicit. Changing them changes what every workflow
# and local run collects; do that in a PR of its own.
python_files = test_*.py *_test.py
python_classes = Test
python_functions = test
