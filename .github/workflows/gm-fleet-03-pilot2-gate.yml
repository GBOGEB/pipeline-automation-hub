name: GM-FLEET-03 PILOT2 Governor Gate

on:
  push:
    branches:
      - mission/gm-fleet-03-pilot2-gate
      - master
  pull_request:
    paths:
      - 'mission-control/grand-missions/**'
      - '.github/workflows/gm-fleet-03-pilot2-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governor-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MissionControl exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: hub

      - name: Bind exact source and pre-promotion master
        working-directory: hub
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          PRE_SHA="$(python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path(
              'mission-control/grand-missions/'
              'GM_IV_PILOT2_PROMOTION_CONTRACT.json'
          )
          print(json.loads(p.read_text())['pre_promotion_master_sha'])
          PY
          )"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "PRE_SHA=$PRE_SHA" >> "$GITHUB_ENV"
          if [ -n "$PR_BASE_SHA" ]; then
            test "$PRE_SHA" = "$PR_BASE_SHA"
          fi
          git fetch --depth=1 origin "$PRE_SHA"
          git show \
            "$PRE_SHA:mission-control/grand-missions/GRAND_MISSION_REGISTRY.json" \
            > "$RUNNER_TEMP/pre-registry.json"
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"

      - name: Fetch F01 exact source
        run: |
          mkdir f01
          git -C f01 init
          git -C f01 remote add origin \
            https://github.com/GBOGEB/DOCX_RTM_Automation.git
          git -C f01 fetch --depth=1 origin \
            d85dc2de1b4beb88bc8e8ce4796784f4577f9a96
          git -C f01 checkout --detach FETCH_HEAD
          test "$(git -C f01 rev-parse HEAD)" = \
            "d85dc2de1b4beb88bc8e8ce4796784f4577f9a96"

      - name: Challenge F01 positive and negative authority boundary
        run: |
          python3 -m pip install --disable-pip-version-check -q pyyaml
          set -o pipefail
          python3 f01/scripts/validate_adr_ocd_bridge.py \
            | tee "$RUNNER_TEMP/f01-positive.txt"
          grep -F 'ADR_OCD bridge validation passed' \
            "$RUNNER_TEMP/f01-positive.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import yaml
          src = Path('f01/federation/ADR_OCD/bridge_manifest.yaml')
          data = yaml.safe_load(src.read_text(encoding='utf-8'))
          data['qps_authority_source']['repo'] = 'GBOGEB/NOT_THE_QPS_AUTHORITY'
          out = Path(os.environ['RUNNER_TEMP']) / 'f01-bad-manifest.yaml'
          out.write_text(
              yaml.safe_dump(data, sort_keys=False),
              encoding='utf-8',
          )
          PY
          set +e
          python3 f01/scripts/validate_adr_ocd_bridge.py \
            --manifest "$RUNNER_TEMP/f01-bad-manifest.yaml" \
            > "$RUNNER_TEMP/f01-negative.txt" 2>&1
          rc=$?
          set -e
          echo "F01_NEGATIVE_RC=$rc" >> "$GITHUB_ENV"
          test "$rc" -ne 0
          grep -F \
            'qps_authority_source.repo must be GBOGEB/cryoplant-project' \
            "$RUNNER_TEMP/f01-negative.txt"
          test -z "$(git -C f01 status --porcelain)"

      - name: Emit F01 Governor challenge receipt
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          pos = (Path(os.environ['RUNNER_TEMP']) / 'f01-positive.txt').read_text(
              encoding='utf-8'
          )
          neg = (Path(os.environ['RUNNER_TEMP']) / 'f01-negative.txt').read_text(
              encoding='utf-8'
          )
          dirty = subprocess.check_output(
              ['git', '-C', 'f01', 'status', '--porcelain'],
              text=True,
          ).splitlines()
          receipt = {
              'schema': 'qps.gm_iv_pilot2_f01_challenge.v1',
              'target_sha': subprocess.check_output(
                  ['git', '-C', 'f01', 'rev-parse', 'HEAD'],
                  text=True,
              ).strip(),
              'positive_exit_code': 0,
              'positive_pass_marker':
                  'ADR_OCD bridge validation passed' in pos,
              'positive_validated_surface_count': sum(
                  marker in pos
                  for marker in [
                      'validated glossary:',
                      'validated bridge manifest:',
                      'validated taxonomy:',
                      'validated QPS triage applicability:',
                  ]
              ),
              'negative_exit_code': int(os.environ['F01_NEGATIVE_RC']),
              'negative_rejection_marker':
                  'qps_authority_source.repo must be GBOGEB/cryoplant-project'
                  in neg,
              'target_dirty_file_count': len(dirty),
          }
          out = Path(os.environ['RUNNER_TEMP']) / 'f01-governor.json'
          out.write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          assert receipt['positive_validated_surface_count'] >= 4
          assert receipt['negative_exit_code'] != 0
          assert receipt['negative_rejection_marker']
          assert not dirty
          PY

      - name: Fetch F03 exact source
        run: |
          mkdir f03
          git -C f03 init
          git -C f03 remote add origin \
            https://github.com/GBOGEB/codespaces-jupyter.git
          git -C f03 fetch --depth=1 origin \
            1eba2240a86d1fd2bd6375e2fac481caf645cdde
          git -C f03 checkout --detach FETCH_HEAD
          test "$(git -C f03 rev-parse HEAD)" = \
            "1eba2240a86d1fd2bd6375e2fac481caf645cdde"

      - name: Challenge F03 positive and negative authority boundary
        working-directory: hub
        run: |
          python3 \
            mission-control/grand-missions/validate_gm_iv_f03_boundary.py \
            ../f03/level1/ssot.json \
            > "$RUNNER_TEMP/f03-positive.txt"
          grep -F 'F03 authority validation passed' \
            "$RUNNER_TEMP/f03-positive.txt"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          src = Path('../f03/level1/ssot.json')
          data = json.loads(src.read_text(encoding='utf-8'))
          data['authority_transfer'] = True
          out = Path(os.environ['RUNNER_TEMP']) / 'f03-bad-ssot.json'
          out.write_text(
              json.dumps(data, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          set +e
          python3 \
            mission-control/grand-missions/validate_gm_iv_f03_boundary.py \
            "$RUNNER_TEMP/f03-bad-ssot.json" \
            > "$RUNNER_TEMP/f03-negative.txt" 2>&1
          rc=$?
          set -e
          echo "F03_NEGATIVE_RC=$rc" >> "$GITHUB_ENV"
          test "$rc" -ne 0
          grep -F 'authority_transfer must be false' \
            "$RUNNER_TEMP/f03-negative.txt"

      - name: Execute F03 notebook twice
        run: |
          python3 -m pip install --disable-pip-version-check -q \
            nbformat nbconvert ipykernel pandas matplotlib
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          import nbformat
          from nbconvert.preprocessors import ExecutePreprocessor

          notebook = Path('f03/notebooks/population.ipynb')

          def execute():
              nb = nbformat.read(notebook, as_version=4)
              ExecutePreprocessor(
                  timeout=120,
                  kernel_name='python3',
              ).preprocess(
                  nb,
                  {'metadata': {'path': 'f03/notebooks'}},
              )
              cells = 0
              errors = 0
              governed = []
              for cell in nb.cells:
                  if cell.cell_type != 'code':
                      continue
                  cells += 1
                  outputs = []
                  for out in cell.get('outputs', []):
                      kind = out.get('output_type')
                      item = {'output_type': kind}
                      if kind == 'error':
                          errors += 1
                          item['ename'] = out.get('ename')
                          item['evalue'] = out.get('evalue')
                      elif kind == 'stream':
                          item['name'] = out.get('name')
                          item['text'] = out.get('text', '')
                      elif kind in ('execute_result', 'display_data'):
                          data = out.get('data', {})
                          item['data'] = {
                              k: data[k]
                              for k in sorted(data)
                              if k in ('text/plain', 'text/html')
                          }
                      outputs.append(item)
                  governed.append({
                      'source': cell.source,
                      'outputs': outputs,
                  })
              raw = json.dumps(
                  governed,
                  sort_keys=True,
                  separators=(',', ':'),
              ).encode()
              return cells, errors, hashlib.sha256(raw).hexdigest()

          c1, e1, d1 = execute()
          c2, e2, d2 = execute()
          dirty = subprocess.check_output(
              ['git', '-C', 'f03', 'status', '--porcelain'],
              text=True,
          ).splitlines()
          pos = (Path(os.environ['RUNNER_TEMP']) / 'f03-positive.txt').read_text(
              encoding='utf-8'
          )
          neg = (Path(os.environ['RUNNER_TEMP']) / 'f03-negative.txt').read_text(
              encoding='utf-8'
          )
          receipt = {
              'schema': 'qps.gm_iv_pilot2_f03_challenge.v1',
              'target_sha': '1eba2240a86d1fd2bd6375e2fac481caf645cdde',
              'run1_code_cells': c1,
              'run2_code_cells': c2,
              'total_error_count': e1 + e2,
              'run1_digest': d1,
              'run2_digest': d2,
              'positive_boundary_pass':
                  'F03 authority validation passed' in pos,
              'negative_authority_rejected':
                  int(os.environ['F03_NEGATIVE_RC']) != 0
                  and 'authority_transfer must be false' in neg,
              'target_dirty_count': len(dirty),
          }
          out = Path(os.environ['RUNNER_TEMP']) / 'f03-governor.json'
          out.write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          assert c1 > 0 and c2 > 0
          assert e1 == 0 and e2 == 0
          assert d1 == d2
          assert receipt['positive_boundary_pass']
          assert receipt['negative_authority_rejected']
          assert not dirty
          PY

      - name: Execute legacy fleet validators on candidate state
        working-directory: hub
        run: |
          python3 mission-control/grand-missions/validate_gm_fleet.py \
            --out "$RUNNER_TEMP/fleet-validator.json"
          python3 mission-control/grand-missions/assess_gm_fleet_03.py \
            --out "$RUNNER_TEMP/capacity-validator.json"

      - name: Assess Governor promotion first pass
        working-directory: hub
        run: |
          python3 \
            mission-control/grand-missions/assess_gm_iv_pilot2_promotion.py \
            --contract \
            mission-control/grand-missions/GM_IV_PILOT2_PROMOTION_CONTRACT.json \
            --pre-registry "$RUNNER_TEMP/pre-registry.json" \
            --pre-sha "$PRE_SHA" \
            --post-registry \
            mission-control/grand-missions/GRAND_MISSION_REGISTRY.json \
            --f01 "$RUNNER_TEMP/f01-governor.json" \
            --f03 "$RUNNER_TEMP/f03-governor.json" \
            --fleet "$RUNNER_TEMP/fleet-validator.json" \
            --capacity "$RUNNER_TEMP/capacity-validator.json" \
            --source-sha "$SOURCE_SHA" \
            --out "$RUNNER_TEMP/pilot2-governor-1.json"

      - name: Assess Governor promotion repeat
        working-directory: hub
        run: |
          python3 \
            mission-control/grand-missions/assess_gm_iv_pilot2_promotion.py \
            --contract \
            mission-control/grand-missions/GM_IV_PILOT2_PROMOTION_CONTRACT.json \
            --pre-registry "$RUNNER_TEMP/pre-registry.json" \
            --pre-sha "$PRE_SHA" \
            --post-registry \
            mission-control/grand-missions/GRAND_MISSION_REGISTRY.json \
            --f01 "$RUNNER_TEMP/f01-governor.json" \
            --f03 "$RUNNER_TEMP/f03-governor.json" \
            --fleet "$RUNNER_TEMP/fleet-validator.json" \
            --capacity "$RUNNER_TEMP/capacity-validator.json" \
            --source-sha "$SOURCE_SHA" \
            --out "$RUNNER_TEMP/pilot2-governor-2.json"

      - name: Enforce deterministic Governor decision
        run: |
          cmp \
            "$RUNNER_TEMP/pilot2-governor-1.json" \
            "$RUNNER_TEMP/pilot2-governor-2.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'pilot2-governor-1.json'
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['result'] == 'PASS'
          assert d['governor_decision'] == 'PROMOTE_PILOT_2_OF_8'
          assert d['mission_state'] == 'STAGED_ACTIVE_PILOT_2_OF_8'
          assert d['activation_stage'] == 'PILOT_2_OF_8'
          assert d['controlled_pilots'] == ['GM-IV-F01', 'GM-IV-F03']
          assert d['children_bound'] is False
          assert d['authority_transfer'] is False
          assert d['gm_v_state'] == 'HELD'
          assert d['next_stage'] == 'RECON_4_OF_8_WITHHELD_SEPARATE_GATE'
          print('PASS_GOVERNOR_PROMOTE_PILOT_2_OF_8_ONLY')
          PY

      - name: Upload Governor gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: gm-fleet-03-pilot2-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/pre-registry.json
            ${{ runner.temp }}/f01-governor.json
            ${{ runner.temp }}/f03-governor.json
            ${{ runner.temp }}/fleet-validator.json
            ${{ runner.temp }}/capacity-validator.json
            ${{ runner.temp }}/pilot2-governor-1.json
            ${{ runner.temp }}/pilot2-governor-2.json
          if-no-files-found: error
