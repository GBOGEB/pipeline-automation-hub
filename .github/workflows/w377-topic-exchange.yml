# Evidence-only W377 topic exchange tests. No jobs, issue writes or external dispatch.
name: W377 Topic Census ACK and Reuse
on:
  pull_request:
    paths:
      - 'tools/metric-atlas/metric_atlas/topic_exchange.py'
      - 'tools/metric-atlas/tests/test_topic_exchange.py'
      - 'tools/metric-atlas/docs/TOPIC_EXCHANGE_W377.md'
      - '.github/workflows/w377-topic-exchange.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w377-topic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: source-bound contract Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install only coverage tool
        run: python -m pip install --disable-pip-version-check coverage==7.10.7
      - name: Unit, branch and negative controls (>=95% module coverage)
        run: |
          python -m coverage run --branch --include='*/topic_exchange.py' -m unittest discover -s tools/metric-atlas/tests -p 'test_topic_exchange.py' -q
          python -m coverage report --include='*/topic_exchange.py' --fail-under=95 -m
      - name: Optimization cannot remove authority gates
        run: python -O -m unittest discover -s tools/metric-atlas/tests -p 'test_topic_exchange.py' -q
