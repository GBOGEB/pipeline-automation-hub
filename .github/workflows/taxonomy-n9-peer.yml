name: Taxonomy N9 Peer Cohort Confidence
on:
  pull_request:
    paths:
      - 'mission-control/issue_rank/taxonomy_peer_confidence.py'
      - 'mission-control/issue_rank/test_taxonomy_peer_confidence.py'
      - '.github/workflows/taxonomy-n9-peer.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: taxonomy-n9-peers-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  confidence:
    name: N9 peer confidence (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11','3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact head
        env:
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$HEAD"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Peer confidence and cohort-drift negatives
        working-directory: mission-control/issue_rank
        run: python -m unittest -v test_taxonomy_peer_confidence
