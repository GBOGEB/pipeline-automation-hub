name: GOGREEN G10 Graph Visual QA and Coverage
on:
  pull_request:
    paths:
      - 'mission-control/gogreen/graph_quality/**'
      - '.github/workflows/gogreen-g10-graph-qa.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: gogreen-g10-${{ github.ref }}
  cancel-in-progress: false
jobs:
  graph-visual-contract:
    name: G10 SVG typed-edge, zoom, visual contract native testflight
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: 51 genuine graph positive and adversarial tests with branch denominator
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [ -f "$GITHUB_WORKSPACE/scripts/ci/qa_trap.sh" ] && QA_TITLE="51 genuine graph positive and adversarial tests with branch denominator" . "$GITHUB_WORKSPACE/scripts/ci/qa_trap.sh"
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m pip install --disable-pip-version-check 'coverage==7.13.3'
          mkdir -p "$RUNNER_TEMP/gogreen-g10"
          export COVERAGE_FILE="$RUNNER_TEMP/gogreen-g10/.coverage"
          python -m coverage run --branch \
            --include='*/mission-control/gogreen/graph_quality/graph_quality.py' \
            -m unittest discover -s mission-control/gogreen/graph_quality/tests \
            -p 'test_graph_quality.py' -v 2>&1 | tee "$RUNNER_TEMP/gogreen-g10/native_tests.log"
          python -m coverage json -o "$RUNNER_TEMP/gogreen-g10/coverage.json" -q
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          d=Path(os.environ['RUNNER_TEMP'])/'gogreen-g10'
          s=(d/'native_tests.log').read_text()
          if re.findall(r'Ran (\d+) tests? in',s)!=['51'] or '\nOK' not in s:
              raise SystemExit('G10 graph test denominator insufficient')
          c=json.loads((d/'coverage.json').read_text())
          key='mission-control/gogreen/graph_quality/graph_quality.py'
          if c['meta']['branch_coverage'] is not True or c['meta']['version']!='7.13.3':
              raise SystemExit('invalid coverage instrumentation')
          if list(c['files'])!=[key]:raise SystemExit('source scope drift')
          s=c['files'][key]['summary']
          st=(s['covered_lines'],s['num_statements'])
          br=(s['covered_branches'],s['num_branches'])
          if min(st[1],br[1])<=0 or st[0]>st[1] or br[0]>br[1]:
              raise SystemExit('invalid eligible denominator')
          if 100*st[0]<85*st[1] or 100*br[0]<80*br[1]:
              raise SystemExit('G10 scoped statement/branch coverage below 85/80')
          # Same production blob + matching source denominator: no false
          # improvement by exclusions, scope shrinking or measurement drift.
          import subprocess
          baseline=json.loads(Path(
            'mission-control/gogreen/graph_quality/samples/G10_NATIVE_N0_20261017.json').read_text())
          actual_blob=subprocess.check_output(['git','hash-object',key],text=True).strip()
          if actual_blob!=baseline['production_git_blob'] or baseline['tool']!='coverage==7.13.3':
              raise SystemExit('G10 N/N+1 source/instrumentation incomparable')
          if (st[1],br[1])!=(baseline['statement_eligible'],baseline['branch_eligible']):
              raise SystemExit('G10 N/N+1 denominator drift')
          if st!=(153,153) or br!=(32,32):
              raise SystemExit(f'G10 reverse geometry remains uncovered: {st} {br}')
          delta={'schema':'gogreen.g10.native-matched-delta.v1',
                 'source_blob':actual_blob,
                 'before_run_id':baseline['source_run_id'],
                 'before_tests':baseline['tests_passed'],
                 'after_tests':51,
                 'statement_gain_pp':round(100*(st[0]-baseline['statement_covered'])/st[1],4),
                 'branch_gain_pp':round(100*(br[0]-baseline['branch_covered'])/br[1],4),
                 'whole_repo_gain':None,'merge_authorized':False}
          (d/'native_matched_delta.json').write_text(json.dumps(delta,sort_keys=True,indent=2)+'\n')
          receipt={'schema':'gogreen.g10.native-focused-coverage.v1',
              'exact_head':os.environ['EXPECTED_SHA'],'native_tests_passed':51,
              'scope':key,'statement_covered':st[0],'statement_eligible':st[1],
              'branch_covered':br[0],'branch_eligible':br[1],
              'coverage_tool':'7.13.3','whole_repo_coverage':None,
              'visual_browser_qa':None,'merge_authorized':False}
          (d/'native_coverage_receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Build source-bound SVG and dashboard from G7 canonical graph and hash outputs
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,json,os
          from pathlib import Path
          root=Path('mission-control/gogreen')
          spec=importlib.util.spec_from_file_location("source_g7",root/'success_graph/runner_telemetry.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          data=json.loads((root/'success_graph/samples/native_success_20261017.json').read_text())
          registry=json.loads(Path('mission-control/grand-missions/GM_DMAIC_EVOLUTION_T7_T14_T21_v1.json').read_text())
          assert len(data['repo_heads'])==21
          graph=m.dag(data,m.metrics(data,registry))
          base=Path(os.environ['RUNNER_TEMP'])/'gogreen-g10'
          (base/'canonical_input.json').write_text(json.dumps(graph,sort_keys=True,indent=2)+'\n')
          PY
          python mission-control/gogreen/graph_quality/graph_quality.py \
            --input "$RUNNER_TEMP/gogreen-g10/canonical_input.json" \
            --out "$RUNNER_TEMP/gogreen-g10/rendered" --source-sha "$EXPECTED_SHA"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          d=Path(os.environ['RUNNER_TEMP'])/'gogreen-g10'
          rendered=d/'rendered'
          m=json.loads((rendered/'manifest.json').read_text())
          assert m['source_sha']==os.environ['EXPECTED_SHA']
          for name,digest in m['files'].items():
              assert hashlib.sha256((rendered/name).read_bytes()).hexdigest()==digest
          qa=json.loads((rendered/'qa.json').read_text())
          assert qa['node_count']==15 and qa['edge_count']==24 and qa['capability_nodes']==8
          assert qa['directed_arrows_verified'] and qa['browser_visual_inspection'] is None
          assert not qa['merge_authorized']
          proof={'schema':'gogreen.g10.native-artifact-receipt.v1',
                 'source_sha':os.environ['EXPECTED_SHA'],
                 'native_run_id':int(os.environ['RUN_ID']),
                 'native_attempt':int(os.environ['RUN_ATTEMPT']),
                 'manifest_sha256':hashlib.sha256((rendered/'manifest.json').read_bytes()).hexdigest(),
                 'artifact_bytes_verified_in_runner':True,
                 'external_archive_custody':False,'browser_visual_inspection':None,
                 'root_closure_credit':0,'merge_authorized':False}
          (d/'native_receipt.json').write_text(json.dumps(proof,sort_keys=True,indent=2)+'\n')
          print(json.dumps(proof,sort_keys=True))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: gogreen-g10-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/gogreen-g10/
          retention-days: 30
          if-no-files-found: warn
