name: GM-IV PILOT_2_OF_8 Governor

on:
  push:
    branches: [master]
    paths:
      - 'mission-control/grand-missions/**'
      - '!mission-control/grand-missions/analytics/**'
      - '.github/workflows/gm-iv-pilot2-governor.yml'
  pull_request:
    paths:
      - 'mission-control/grand-missions/**'
      - '!mission-control/grand-missions/analytics/**'
      - '.github/workflows/gm-iv-pilot2-governor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governor-pilot2:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind exact source SHA and lifecycle stage
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$SOURCE_SHA" = "$expected"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          stage="$(python3 - <<'PY'
          import json
          d=json.load(open('mission-control/grand-missions/GRAND_MISSION_REGISTRY.json',encoding='utf-8'))
          print(next(m for m in d['grand_missions'] if m['id']=='GM-IV')['state'])
          PY
          )"
          case "$stage" in
            STAGED_ACTIVE_PILOT_2_OF_8|STAGED_ACTIVE_RECON_4_OF_8|ACTIVE_8_OF_8) ;;
            *) echo "Unsupported GM-IV lifecycle stage: $stage"; exit 1 ;;
          esac
          echo "GM_IV_STAGE=$stage" >> "$GITHUB_ENV"

      - name: Compile controls
        shell: bash
        run: |
          python -m py_compile \
            mission-control/grand-missions/assess_gm_iv_pilot2_governor.py \
            mission-control/grand-missions/validate_gm_fleet.py \
            mission-control/grand-missions/validate_gm_iv_evidence_economics.py

      - name: Current PILOT_2 Governor assessment
        if: env.GM_IV_STAGE == 'STAGED_ACTIVE_PILOT_2_OF_8'
        shell: bash
        run: |
          python mission-control/grand-missions/assess_gm_iv_pilot2_governor.py --out /tmp/gm-iv-pilot2-governor.json

      - name: Fleet and economics regression
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$SOURCE_SHA" python mission-control/grand-missions/validate_gm_fleet.py --out /tmp/gm-fleet-regression.json
          python mission-control/grand-missions/validate_gm_iv_evidence_economics.py | tee /tmp/gm-iv-economics.json
          grep -q '"status": "PASS"' /tmp/gm-iv-economics.json

      - name: Historical PILOT_2 retention after later stages
        if: env.GM_IV_STAGE != 'STAGED_ACTIVE_PILOT_2_OF_8'
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('mission-control/grand-missions')
          registry=json.load(open(root/'GRAND_MISSION_REGISTRY.json',encoding='utf-8'))
          pilot=json.load(open(root/'GM_IV_PILOT2_GOVERNOR_CONTRACT.json',encoding='utf-8'))
          gm={m['id']:m for m in registry['grand_missions']}
          gm4=gm['GM-IV']; gm5=gm['GM-V']
          assert gm4['state'] in {'STAGED_ACTIVE_RECON_4_OF_8','ACTIVE_8_OF_8'}
          assert gm4['controlled_pilot_frontiers']==['GM-IV-F01','GM-IV-F03']
          assert gm4['reference_frontiers']==['GM-IV-F02','GM-IV-F04']
          assert gm4['pilot_2_of_8_evidence']['F01']==pilot['controlled_pilots']['GM-IV-F01']
          assert gm4['pilot_2_of_8_evidence']['F03']==pilot['controlled_pilots']['GM-IV-F03']
          assert gm4['children']==[]
          assert registry['authority_transfer'] is False
          assert gm5['state']=='HELD' and gm5['children']==[]
          receipt={'schema':'qps.gm_iv_pilot2_historical_control.v2','source_sha':os.environ['SOURCE_SHA'],'current_state':gm4['state'],'historical_stage':'STAGED_ACTIVE_PILOT_2_OF_8','historical_evidence_retained':True,'children_bound':False,'authority_transfer':False,'gm_v_state':'HELD','result':'PASS'}
          Path('/tmp/gm-iv-pilot2-historical-control.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print('PASS_GM_IV_PILOT2_HISTORICAL_RETENTION')
          PY

      - name: Upload lifecycle receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gm-iv-pilot2-lifecycle-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/gm-iv-pilot2-governor.json
            /tmp/gm-iv-pilot2-historical-control.json
            /tmp/gm-fleet-regression.json
            /tmp/gm-iv-economics.json
          if-no-files-found: ignore
