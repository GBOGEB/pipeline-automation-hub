name: Zero-Test Gate Guard

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/**'
      - '**/test_*.py'
      - 'scripts/zero_test_gate_audit.py'
  push:
    branches: [master]
    paths:
      - '.github/workflows/**'
      - '**/test_*.py'
      - 'scripts/zero_test_gate_audit.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'PyYAML>=6,<7'
      - name: Audit self-tests
        run: python -m unittest scripts/tests/test_zero_test_gate_audit.py -v
      - name: Every unittest gate collects at least one test
        run: |
          set -euo pipefail
          python scripts/zero_test_gate_audit.py --strict --out zero-test-gate-audit.json
      - name: Upload audit receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zero-test-gate-audit-${{ github.sha }}
          path: zero-test-gate-audit.json
          if-no-files-found: ignore
