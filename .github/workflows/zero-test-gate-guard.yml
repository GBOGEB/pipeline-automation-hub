name: Zero-Test Gate Guard

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/**'
      - '**/test_*.py'
      - 'scripts/zero_test_gate_audit.py'
  push:
    branches: [master]
    paths:
      - '.github/workflows/**'
      - '**/test_*.py'
      - 'scripts/zero_test_gate_audit.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'PyYAML>=6,<7'
      - name: Audit self-tests
        run: python -m unittest scripts/tests/test_zero_test_gate_audit.py -v
      - name: Every unittest gate collects at least one test
        run: |
          set -euo pipefail
          python scripts/zero_test_gate_audit.py --strict --out zero-test-gate-audit.json
      - name: Upload audit receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zero-test-gate-audit-${{ github.sha }}
          path: zero-test-gate-audit.json
          if-no-files-found: ignore
