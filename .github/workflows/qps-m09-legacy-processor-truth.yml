name: QPS M09 Legacy Processor Repair Probe

on:
  pull_request:
    paths:
      - "qps/m09/**"
      - "scripts/ppt_processor.py"
      - "scripts/run_processing.py"
      - "README.md"
      - ".github/workflows/qps-m09-legacy-processor-truth.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-probe:
    runs-on: ubuntu-latest
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_DATE_EPOCH: "1789200000"
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Execute fail-closed M09 repair regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/m09
          python qps/m09/M09_LEGACY_PROCESSOR_TRUTH_PROBE.py | tee artifacts/m09/M09_REPAIR_PROBE.json
          grep -q 'PASS_FAIL_CLOSED_METADATA_ONLY_REPAIR' artifacts/m09/M09_REPAIR_PROBE.json
      - name: Bind exact-head repair receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          probe=pathlib.Path('artifacts/m09/M09_REPAIR_PROBE.json')
          data=json.loads(probe.read_text(encoding='utf-8'))
          receipt={
            'schema':'qps.m09.repair_receipt.v2',
            'repo':os.environ['GITHUB_REPOSITORY'],
            'source_head_sha':os.environ['SOURCE_HEAD_SHA'],
            'observed_git_head':subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
            'run_id':os.environ['GITHUB_RUN_ID'],
            'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'probe_sha256':hashlib.sha256(probe.read_bytes()).hexdigest(),
            'classification':data['classification'],
            'historical_first_red':data['historical_first_red'],
            'status':'PASS',
            'authority':'OBSERVATION_ONLY_NO_DOCUMENT_TRUTH_TRANSFER'
          }
          assert receipt['source_head_sha']==receipt['observed_git_head']
          pathlib.Path('artifacts/m09/M09_REPAIR_RECEIPT.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
      - name: Upload retained M09 repair receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qps-m09-repair-${{ env.SOURCE_HEAD_SHA }}
          path: artifacts/m09/
          if-no-files-found: error
