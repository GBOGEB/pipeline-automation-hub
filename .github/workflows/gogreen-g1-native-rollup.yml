name: GOGREEN G1 Native Rollup and HTML
on:
  pull_request:
    paths:
      - 'mission-control/gogreen/federation_rollup.py'
      - 'mission-control/gogreen/render_g1.py'
      - 'mission-control/gogreen/tests/test_federation_rollup.py'
      - 'mission-control/gogreen/tests/test_render_g1.py'
      - 'mission-control/gogreen/samples/federation_g1_observed.json'
      - '.github/workflows/gogreen-g1-native-rollup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g1-evidence:
    name: Exact-head source-discovery producer and monochrome HTML
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Immutable source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python pinned version
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Preflight source identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m py_compile mission-control/gogreen/federation_rollup.py mission-control/gogreen/render_g1.py
      - name: Execute native G1 source and HTML negative controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gogreen-g1"
          python -m unittest discover -s mission-control/gogreen/tests -p test_federation_rollup.py -v 2>&1 | tee "$RUNNER_TEMP/gogreen-g1/source_tests.log"
          python -m unittest discover -s mission-control/gogreen/tests -p test_render_g1.py -v 2>&1 | tee "$RUNNER_TEMP/gogreen-g1/html_tests.log"
          python - <<'PY'
          import os,re
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"gogreen-g1"
          for name,minimum in [("source_tests.log",28),("html_tests.log",8)]:
              content=(root/name).read_text()
              found=re.findall(r"Ran (\d+) tests? in",content)
              if len(found)!=1 or int(found[0])<minimum or "\nOK" not in content:
                  raise SystemExit("Native G1 test proof missing: "+name)
          PY
      - name: Build SSOT-derived JSON and HTML
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NATIVE_RUN: ${{ github.run_id }}
          NATIVE_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/gogreen-g1"
          python mission-control/gogreen/federation_rollup.py \
            --current mission-control/gogreen/samples/federation_g1_observed.json --output "$ROOT"
          python mission-control/gogreen/render_g1.py \
            --rollup "$ROOT/rollup.json" --out "$ROOT/rollup.html" --source-sha "$EXPECTED_SHA"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"gogreen-g1"
          rollup=(root/"rollup.json").read_bytes()
          page=(root/"rollup.html").read_bytes()
          manifest=json.loads((root/"manifest.json").read_text())
          obj=json.loads(rollup)
          sha=hashlib.sha256(rollup).hexdigest()
          d=obj["breadth_depth"]
          assert d["target_repo_surface_cells"]==66
          assert d["source_discovered_cells"]==13 and d["unknown_cells"]==53
          assert d["native_status_verified_cells"]==0
          assert d["artifact_bytes_verified_cells"]==0
          assert obj["admission"]=="HOLD" and obj["merge_authorized"] is False
          assert sha==manifest["sha256"]["rollup.json"]
          assert b"13/66" in page and b"QPS disposition: DEFER" in page
          manifest["sha256"]["rollup.html"]=hashlib.sha256(page).hexdigest()
          manifest["producer_source_sha"]=os.environ["EXPECTED_SHA"]
          manifest["native_run_id"]=int(os.environ["NATIVE_RUN"])
          manifest["native_attempt"]=int(os.environ["NATIVE_ATTEMPT"])
          manifest["evidence_class"]="PRODUCER_NATIVE_NOT_CONSUMER_ACCEPTED"
          manifest["independent_downloaded_bytes_verified"]=False
          manifest["merge_authorized"]=False
          (root/"manifest.json").write_text(json.dumps(manifest,sort_keys=True,indent=2)+"\n")
          print(json.dumps({"sha":os.environ["EXPECTED_SHA"],"manifest":manifest,
                            "source_discovery":"13/66","native_cells":0,"bytes_verified":0},
                           sort_keys=True))
          PY
      - name: Upload exact-source G1 rollup receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gogreen-g1-rollup-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/gogreen-g1/
          if-no-files-found: error
          retention-days: 14
