name: W380 Lane Lifecycle SIPOC DAG
on:
  pull_request:
    paths:
      - 'mission-control/jade_temple/devops/lifecycle.py'
      - 'tools/metric-atlas/metric_atlas/topic_exchange.py'
      - 'tools/metric-atlas/metric_atlas/topic_wave.py'
      - 'tools/metric-atlas/metric_atlas/lane_lifecycle.py'
      - 'tools/metric-atlas/metric_atlas/lane_process_graph.py'
      - 'tools/metric-atlas/tests/test_lane_process_graph.py'
      - 'tools/metric-atlas/tests/w379_empty_snapshot.json'
      - 'tools/metric-atlas/docs/LANE_PROCESS_GRAPH_W380.md'
      - '.github/workflows/w380-lane-process-graph.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w380-lane-graph-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  stage-graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11','3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        env:
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$HEAD"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Source-owned process graph tests and branch coverage
        env:
          PYTHONPATH: tools/metric-atlas
        run: |
          python -m pip install --disable-pip-version-check coverage==7.10.7
          python -m coverage run --branch --include='*/metric_atlas/lane_process_graph.py' -m unittest discover -s tools/metric-atlas/tests -p test_lane_process_graph.py -v
          python -m coverage report -m --include='*/metric_atlas/lane_process_graph.py' --fail-under=85
      - name: Optimized Python fail-closed replay
        env:
          PYTHONPATH: tools/metric-atlas
        run: python -O -m unittest discover -s tools/metric-atlas/tests -p test_lane_process_graph.py -v
      - name: Emit 70 node process family
        env:
          PYTHONPATH: tools/metric-atlas
        run: |
          python -m metric_atlas.lane_process_graph --snapshot tools/metric-atlas/tests/w379_empty_snapshot.json --out "$RUNNER_TEMP/w380-graph"
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'w380-graph'
          r=json.loads((root/'lane-process.json').read_text())
          m=json.loads((root/'manifest.json').read_text())
          assert r['graph_metrics']==dict(r['graph_metrics'])
          assert r['graph_metrics']['nodes']==70 and r['graph_metrics']['within_pulse_edges']==76
          assert r['graph_metrics']['next_pulse_edges']==1
          assert r['merge_admission']=='HOLD' and r['authority_transfer'] is False
          assert all(n['maturity_level'] is None for n in r['nodes'])
          assert all(hashlib.sha256((root/f).read_bytes()).hexdigest()==h
                     for f,h in m['files_sha256'].items())
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: w380-stage-process-graph-${{ matrix.python }}-${{ github.run_id }}
          path: ${{ runner.temp }}/w380-graph
          retention-days: 7
          if-no-files-found: warn
