name: MCEX-W1 11 stage-only factorial branch
on:
  pull_request:
    paths:
      - 'mission-control/side-missions/MCEX_W1/arm_11/**'
      - '.github/workflows/mcex-w1-11.yml'
permissions:
  contents: read
jobs:
  simulation-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Source checkout guard
        env:
          MCEX_EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$MCEX_EXACT_HEAD"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run identical negative and factorial tests
        run: |
          set -euo pipefail
          node --test 'mission-control/side-missions/MCEX_W1/arm_11/test.mjs'
      - name: Emit exact-head candidate simulation receipt
        env:
          MCEX_EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node 'mission-control/side-missions/MCEX_W1/arm_11/emit.mjs' 'build/mcex/arm-11-receipt.json'
          node -e 'const fs=require("node:fs");const r=JSON.parse(fs.readFileSync("build/mcex/arm-11-receipt.json"));if(r.metrics.cases!==22||r.metrics.negative_cases!==20||r.metrics.false_green||r.metrics.git_writes||r.metrics.remote_writes||r.boundary.merge_admission!=="HOLD")process.exit(7);'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcex-arm-11-${{ github.event.pull_request.head.sha }}
          path: build/mcex/
          if-no-files-found: warn
