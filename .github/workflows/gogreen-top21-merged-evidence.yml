name: GOGREEN TOP21 Merged Evidence Scanner
on:
  pull_request:
    paths:
      - 'mission-control/gogreen/merged_evidence/**'
      - '.github/workflows/gogreen-top21-merged-evidence.yml'
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
concurrency:
  group: gogreen-top21-merged-${{ github.ref }}
  cancel-in-progress: false
jobs:
  merged-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Verify negative and missing evidence without false green
        run: |
          set -euo pipefail
          python -m unittest discover -s mission-control/gogreen/merged_evidence/tests -v
      - name: Generate exactly canonical TOP21 roster
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('mission-control/gogreen/success_graph/samples/native_success_20261017.json')
          r=[x['repository'] for x in json.loads(p.read_text())['repo_heads']]
          assert len(r)==len(set(r))==21
          Path('mission-control/gogreen/merged_evidence/roster_from_ssot.json').write_text(json.dumps(r,indent=2)+'\n')
          PY
      - name: Read-only merged-PR Actions census
        env:
          # A pull_request run executes the PR's own scan.py, so it never gets the cross-repo
          # token and takes the deferred branch below. Dispatch runs read live.
          GH_TOKEN: ${{ github.event_name != 'pull_request' && secrets.GOGREEN_TOP21_READ_TOKEN || '' }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            mkdir -p "$RUNNER_TEMP/gogreen-top21"
            printf '%s\n' '{"schema":"gogreen.top21.access.v1","status":"DEFERRED_NO_CROSS_REPO_READ_TOKEN","formal_root_closure_credit":0,"merge_authorized":false}' > "$RUNNER_TEMP/gogreen-top21/access_receipt.json"
            echo "::warning::TOP21 cross-repo read not configured; no live scan was credited"
            exit 0
          fi
          python mission-control/gogreen/merged_evidence/scan.py \
            --roster mission-control/gogreen/merged_evidence/roster_from_ssot.json \
            --limit 1 --out "$RUNNER_TEMP/gogreen-top21"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: gogreen-top21-merged-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/gogreen-top21/
          retention-days: 30
          if-no-files-found: warn
