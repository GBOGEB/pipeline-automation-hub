# JADE N+9 DevOps census: offline qualification on every change, weekly read-only fleet refresh.
# Contract: mission-control/jade_temple/devops/DEPLOY_PRODUCTION_ARCHITECTURE_N9.md.
# The refresh job never commits: it uploads a fresh census and reports drift against the committed snapshot.
name: JADE N+9 DevOps census (read-only)
on:
  pull_request:
    paths:
      - 'mission-control/jade_temple/devops/**'
      - 'mission-control/jade_temple/data/DEVOPS_CENSUS_N*.json'
      - 'mission-control/jade_temple/data/DEVOPS_OBJECTS_N*.json'
      - '.github/workflows/jade-devops-census.yml'
      - '.github/workflows/jade-reusable-ci.yml'
      - '.github/workflows/jade-reusable-deploy.yml'
      # Any workflow change re-runs the PR secret-exposure lint below.
      - '.github/workflows/*.yml'
  push:
    branches: [master]
    paths:
      - 'mission-control/jade_temple/devops/**'
      - 'mission-control/jade_temple/data/DEVOPS_CENSUS_N*.json'
      - 'mission-control/jade_temple/data/DEVOPS_OBJECTS_N*.json'
      - '.github/workflows/jade-devops-census.yml'
      - '.github/workflows/jade-reusable-ci.yml'
      - '.github/workflows/jade-reusable-deploy.yml'
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: jade-devops-census-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  offline:
    name: Census, lifecycle and deploy-contract qualification (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact checkout
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: No repository secret reachable from a pull_request run
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pyyaml==6.0.3
          python mission-control/jade_temple/devops/workflows.py secrets-lint .github/workflows/*.yml
      - name: Tests under branch coverage (zero-test and population guards)
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -c mission-control/jade_temple/sprint/requirements-optional.txt pyyaml==6.0.3 coverage
          python -m coverage run --branch --include='*/mission-control/jade_temple/devops/*.py' --omit='*/tests/*' \
            -m unittest discover -s mission-control/jade_temple/devops/tests -p 'test_devops_*.py' -v \
            2>&1 | tee "$RUNNER_TEMP/devops-tests.log"
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          log = (Path(os.environ["RUNNER_TEMP"]) / "devops-tests.log").read_text()
          ran = [int(n) for n in re.findall(r"^Ran (\d+) tests in ", log, re.M)]
          if not ran or ran[-1] < 89:
              raise SystemExit("DEVOPS_TEST_POPULATION_FIRST_RED: need >= 89 executed tests")
          if re.search(r"skipped=\d+", log):
              raise SystemExit("DEVOPS_TEST_SKIP_FIRST_RED: no skipped tests on the hosted runner")
          subprocess.run(["python", "-m", "coverage", "json", "-q", "-o", os.environ["RUNNER_TEMP"] + "/devops-coverage.json"], check=True)
          d = json.loads((Path(os.environ["RUNNER_TEMP"]) / "devops-coverage.json").read_text())
          got = {k.rsplit("/", 1)[-1] for k in d["files"]}
          if got != {"census.py", "lifecycle.py", "workflows.py"}:
              raise SystemExit(f"DEVOPS_COVERAGE_FIRST_RED: source population drift {sorted(got)}")
          t = d["totals"]
          if t["num_statements"] < 1100 or t["num_branches"] < 440:
              raise SystemExit("DEVOPS_COVERAGE_FIRST_RED: instrumented denominator shrank")
          if t["percent_statements_covered"] < 90 or t["percent_branches_covered"] < 80:
              raise SystemExit("DEVOPS_COVERAGE_FIRST_RED: behavioural coverage below 90/80")
          print(json.dumps({"tests": ran[-1], "statements": [t["covered_lines"], t["num_statements"]],
                            "branches": [t["covered_branches"], t["num_branches"]], "merge_admission": "HOLD"}))
          PY
      - name: Actions usage + performance metrics projection (offline)
        run: |
          set -euo pipefail
          python -m unittest discover -s mission-control/jade_temple/devops/tests -p 'test_actions_metrics.py' -v \
            2>&1 | tee "$RUNNER_TEMP/actions-metrics-tests.log"
          ran=$(grep -oP '^Ran \K[0-9]+' "$RUNNER_TEMP/actions-metrics-tests.log" | tail -1 || true)
          test "${ran:-0}" -ge 9 || { echo "ACTIONS_METRICS_TEST_POPULATION_FIRST_RED: ran ${ran:-0} < 9"; exit 1; }
          ! grep -qE 'skipped=[0-9]+' "$RUNNER_TEMP/actions-metrics-tests.log"
      - name: w##DDD week codes and Mermaid pattern doc (offline)
        run: |
          set -euo pipefail
          python -m unittest discover -s mission-control/jade_temple/devops/tests -p 'test_wddd.py' -v \
            2>&1 | tee "$RUNNER_TEMP/wddd-tests.log"
          ran=$(grep -oP '^Ran \K[0-9]+' "$RUNNER_TEMP/wddd-tests.log" | tail -1 || true)
          test "${ran:-0}" -ge 17 || { echo "WDDD_TEST_POPULATION_FIRST_RED: ran ${ran:-0} < 17"; exit 1; }
          ! grep -qE 'skipped=[0-9]+' "$RUNNER_TEMP/wddd-tests.log"
      - name: Committed census invariants and deploy contract lint
        run: |
          set -euo pipefail
          D=mission-control/jade_temple/devops; A=mission-control/jade_temple/data
          # Every committed pulse is checked; earlier pulses stay immutable.
          python $D/census.py check
          python $D/census.py report --check
          python $D/census.py check --census $A/DEVOPS_CENSUS_N10.json --objects $A/DEVOPS_OBJECTS_N10.json
          python $D/census.py report --check --census $A/DEVOPS_CENSUS_N10.json \
            --previous $A/DEVOPS_CENSUS_N9.json --out $D/DEVOPS_CENSUS_N10_READING.md
          python $D/census.py check --census $A/DEVOPS_CENSUS_N11.json --objects $A/DEVOPS_OBJECTS_N11.json
          python $D/census.py report --check --census $A/DEVOPS_CENSUS_N11.json             --previous $A/DEVOPS_CENSUS_N10.json --out $D/DEVOPS_CENSUS_N11_READING.md
          python mission-control/jade_temple/devops/workflows.py lint --require-deploy \
            .github/workflows/jade-reusable-deploy.yml \
            mission-control/jade_temple/devops/templates/jade-cicd-caller.yml > "$RUNNER_TEMP/deploy-lint.json"
          python mission-control/jade_temple/devops/workflows.py lint .github/workflows/jade-reusable-ci.yml
      - name: Native full-population consumer smoke on canonical N11
        env:
          JADE_PLANNING_SHA: 897298dc3ed1a45607121b205617d4c103e7b226
        run: |
          set -euo pipefail
          P=mission-control/jade_temple/portfolio_readiness
          python "$P/census_bridge.py" \
            --census mission-control/jade_temple/data/DEVOPS_CENSUS_N11.json \
            --private-registry mission-control/gogreen/token_census/REGISTRY.json \
            --require-count 21 \
            --out "$RUNNER_TEMP/jade-portfolio-N11-observation.json" \
            --receipt "$RUNNER_TEMP/jade-portfolio-N11-receipt.json"
          python "$P/portfolio_readiness.py" \
            --as-of "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --source-sha "$JADE_PLANNING_SHA" \
            --observation "$RUNNER_TEMP/jade-portfolio-N11-observation.json" \
            --out "$RUNNER_TEMP/jade-portfolio-N11-site"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          r = json.loads((root / "jade-portfolio-N11-receipt.json").read_text())
          m = json.loads((root / "jade-portfolio-N11-site/portfolio_readiness.json").read_text())
          assert r["source_repos"] == 21
          import hashlib
          path = "mission-control/jade_temple/portfolio_readiness/census_bridge.py"
          assert m["source_binding"]["status"] == "BASELINE_INPUTS_MATCH"
          assert m["source_hashes"][path]["sha256"] == hashlib.sha256(Path(path).read_bytes()).hexdigest()
          assert m["authority"]["current_point_release_readiness"] is None
          assert m["authority"]["live_weighted_closure_rate"] is None
          assert m["watch"]["enabled"] is False
          print("CANONICAL_21_REPO_BRIDGE=PASS; SOURCE_STRUCTURAL_ONLY; LIVE_NATIVE_QA=UNKNOWN")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: jade-devops-offline-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/devops-tests.log
            ${{ runner.temp }}/devops-coverage.json
            ${{ runner.temp }}/deploy-lint.json
            ${{ runner.temp }}/jade-portfolio-N11-observation.json
            ${{ runner.temp }}/jade-portfolio-N11-receipt.json
            ${{ runner.temp }}/jade-portfolio-N11-site/
          retention-days: 21
          if-no-files-found: warn

  refresh:
    name: Weekly fleet refresh and drift report (read-only)
    needs: offline
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Fetch and scan the TOP21 roster
        env:
          CENSUS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pyyaml==6.0.3
          D=mission-control/jade_temple/devops
          LATEST=mission-control/jade_temple/data/DEVOPS_CENSUS_N11.json
          python $D/census.py fetch --cache "$RUNNER_TEMP/cache" --baseline-census $LATEST | tee "$RUNNER_TEMP/fetch.jsonl"
          python $D/census.py scan --cache "$RUNNER_TEMP/cache" --api-token-env CENSUS_TOKEN \
            --iteration FRESH --baseline-census $LATEST \
            --out "$RUNNER_TEMP/DEVOPS_CENSUS_FRESH.json" --objects "$RUNNER_TEMP/DEVOPS_OBJECTS_FRESH.json"
      - name: Drift against the committed snapshot
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          old = json.loads(Path("mission-control/jade_temple/data/DEVOPS_CENSUS_N11.json").read_text())
          new = json.loads((Path(os.environ["RUNNER_TEMP"]) / "DEVOPS_CENSUS_FRESH.json").read_text())
          o = {r["repo"]: r for r in old["repos"]}
          print(f"## JADE DevOps census drift\n\ncommitted `{old['observed_at_utc']}` -> fresh `{new['observed_at_utc']}`\n")
          print("| repo | head moved | stage level change | untested modules | zero-case files |\n|---|---|---|---|---|")
          for r in new["repos"]:
              p = o.get(r["repo"])
              if not p or not r["reachable"] or not p["reachable"]:
                  print(f"| {r['repo']} | UNKNOWN | UNKNOWN | UNKNOWN | UNKNOWN |")
                  continue
              moved = "yes" if p["head_sha"] != r["head_sha"] else "no"
              lv = ", ".join(f"{k} {p['stages'][k]['level']}->{v['level']}" for k, v in r["stages"].items()
                             if v["level"] != p["stages"][k]["level"]) or "none"
              print(f"| {r['repo']} | {moved} | {lv} | {p['tests']['py_untested']} -> {r['tests']['py_untested']} |"
                    f" {p['tests']['zero_case_files']} -> {r['tests']['zero_case_files']} |")
          PY
      - name: Project the private-safe portfolio from the same weekly census
        env:
          JADE_PLANNING_SHA: 897298dc3ed1a45607121b205617d4c103e7b226
        run: |
          set -euo pipefail
          P=mission-control/jade_temple/portfolio_readiness
          python "$P/census_bridge.py" \
            --census "$RUNNER_TEMP/DEVOPS_CENSUS_FRESH.json" \
            --private-registry mission-control/gogreen/token_census/REGISTRY.json \
            --require-count 21 \
            --out "$RUNNER_TEMP/jade-portfolio-observation.json" \
            --receipt "$RUNNER_TEMP/jade-portfolio-bridge-receipt.json"
          python "$P/portfolio_readiness.py" \
            --as-of "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --source-sha "$JADE_PLANNING_SHA" \
            --observation "$RUNNER_TEMP/jade-portfolio-observation.json" \
            --out "$RUNNER_TEMP/jade-portfolio-weekly"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          receipt = json.loads((root / "jade-portfolio-bridge-receipt.json").read_text())
          model = json.loads((root / "jade-portfolio-weekly/portfolio_readiness.json").read_text())
          assert receipt["source_repos"] == 21 and receipt["merge_admission"] == "HOLD"
          import hashlib
          path = "mission-control/jade_temple/portfolio_readiness/census_bridge.py"
          assert model["source_binding"]["status"] == "BASELINE_INPUTS_MATCH"
          assert model["source_hashes"][path]["sha256"] == hashlib.sha256(Path(path).read_bytes()).hexdigest()
          assert model["authority"]["current_point_release_readiness"] is None
          assert model["authority"]["live_weighted_closure_rate"] is None
          assert model["watch"]["enabled"] is False
          print("## JADE weekly portfolio: read-only structural observation")
          print(f"Top21 rows: {receipt['source_repos']}; private aggregate rows: {receipt['private_rows_masked']}")
          print(f"Observed: {receipt['observed_at_utc']}; source census SHA256: {receipt['source_digest_sha256']}")
          print("**No native checks, weighted closure, owner release or current gate PASS is inferred.**")
          print("Download the HTML cockpit, JSON, CSV, DAG and watch proposal from this run's artifacts.")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jade-devops-census-fresh-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/DEVOPS_CENSUS_FRESH.json
            ${{ runner.temp }}/DEVOPS_OBJECTS_FRESH.json
            ${{ runner.temp }}/fetch.jsonl
            ${{ runner.temp }}/jade-portfolio-observation.json
            ${{ runner.temp }}/jade-portfolio-bridge-receipt.json
            ${{ runner.temp }}/jade-portfolio-weekly/
          retention-days: 35
          if-no-files-found: error
      - name: Open one issue when the scheduled refresh goes red
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="JADE DevOps census refresh first red"
          if [ -z "$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number')" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "Scheduled refresh failed: $RUN_URL"
          fi
