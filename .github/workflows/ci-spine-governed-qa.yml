# Read-only CI spine qualification. Separate from the JADE-pinned zero-test guard
# so its known OID cannot drift without canonical regeneration (AGENTS.md L7).
name: CI Spine Source-Bound QA
on:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/ci_spine_*.py'
      - 'tests/test_ci_spine_*.py'
      - 'governance/ci_spine/**'
      - 'docs/ci-spine/notebook.html'
      - 'docs/ci-spine/notebook.template.html'
      - 'docs/ci-spine/LOGICAL_BUNDLE_DAG_v1.json'
      - 'docs/ci-spine/RUN_TIMING_SAMPLES_20261028.json'
      - '.github/workflows/ci-spine-governed-qa.yml'
  push:
    branches: [master]
    paths:
      - 'scripts/ci_spine_*.py'
      - 'tests/test_ci_spine_*.py'
      - 'governance/ci_spine/**'
      - 'docs/ci-spine/notebook.html'
      - 'docs/ci-spine/notebook.template.html'
      - 'docs/ci-spine/LOGICAL_BUNDLE_DAG_v1.json'
      - 'docs/ci-spine/RUN_TIMING_SAMPLES_20261028.json'
      - '.github/workflows/ci-spine-governed-qa.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-spine-source-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  offline:
    name: Source head, negative controls and authority index (no promotion)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checkout
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          echo "CI_SPINE_SOURCE_SHA=$EXPECTED"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install canonical parser dependency
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.3
      - name: Run every available CI spine adversarial suite (fail closed)
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_ci_spine_*.py' -v 2>&1 | tee "$RUNNER_TEMP/ci-spine-tests.log"
          python - <<'PY'
          import os, re
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "ci-spine-tests.log"
          raw = p.read_text(encoding="utf-8")
          found = [int(s) for s in re.findall(r"^Ran ([0-9]+) tests? in ", raw, re.M)]
          test_files = sorted(Path("tests").glob("test_ci_spine_*.py"))
          if not found or found[-1] < 8 or not test_files:
              raise SystemExit("CI_SPINE_TEST_POPULATION_FIRST_RED")
          if re.search(r"skipped=[0-9]+", raw):
              raise SystemExit("CI_SPINE_TEST_SKIP_FIRST_RED")
          print("CI_SPINE_TESTS_RAN=" + str(found[-1]))
          print("CI_SPINE_TEST_FILES=" + str(len(test_files)))
          PY
      - name: Static authority contract at exact source head
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python scripts/ci_spine_index.py --check --source-sha "$SOURCE_HEAD" --out ci-spine-index.json
      - name: Verify notebook source-to-view parity
        run: |
          set -euo pipefail
          python scripts/ci_spine_notebook.py --check
      - name: Publish exact-source topology receipt for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-spine-index-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: |
            ci-spine-index.json
            docs/ci-spine/notebook.html
            ${{ runner.temp }}/ci-spine-tests.log
          retention-days: 21
          if-no-files-found: warn
  browser:
    name: CI Spine provenance notebook 3-viewport browser QA
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact notebook source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "CI_SPINE_BROWSER_SOURCE_SHA=$EXPECTED_SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install existing QA Playwright version and Chromium
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Execute offline UI interaction and visual QA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python scripts/ci_spine_notebook_browser.py
          test -s qa/ci_spine/receipt.json
      - name: Upload source-bound browser screenshots and receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-spine-notebook-browser-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qa/ci_spine/receipt.json
            qa/ci_spine/*.png
          retention-days: 21
          if-no-files-found: warn
