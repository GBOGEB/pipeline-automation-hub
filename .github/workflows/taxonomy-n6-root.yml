name: Taxonomy N6 Root and Occurrence
on:
  pull_request:
    paths:
      - 'mission-control/issue_rank/taxonomy_root_occurrence.py'
      - 'mission-control/issue_rank/test_taxonomy_root_occurrence.py'
      - '.github/workflows/taxonomy-n6-root.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: taxonomy-n6-root-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  roots:
    name: N6 root/occurrence negatives (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python: ['3.11','3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact-head native code
        env:
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$HEAD"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run root and occurrence proof negatives
        working-directory: mission-control/issue_rank
        run: python -m unittest -v test_taxonomy_root_occurrence
