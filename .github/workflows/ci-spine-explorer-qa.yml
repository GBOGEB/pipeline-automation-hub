name: 'test(ci-spine): provenance explorer QA'
# gogreen-admission: observe
# A scoped pilot DoV signal; no required status-context or merge-policy promotion.
on:
  pull_request:
    paths:
      - 'docs/ci-spine/**'
      - '.github/workflows/ci-spine-explorer-qa.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-spine-explorer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  static:
    name: Offline source-bound generator and negative tests
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Deterministic HTML, false-green and provenance negative matrix
        run: |
          set -euo pipefail
          python docs/ci-spine/build_explorer.py --check
          python docs/ci-spine/test_explorer.py 2>&1 | tee "$RUNNER_TEMP/ci-spine-tests.log"
          python - <<'PY'
          import os,re
          from pathlib import Path
          s=(Path(os.environ['RUNNER_TEMP'])/'ci-spine-tests.log').read_text()
          results=[int(x) for x in re.findall(r'^Ran (\d+) tests in ',s,re.M)]
          if not results or results[-1] < 24:
              raise SystemExit('CI_SPINE_TEST_POPULATION_FIRST_RED')
          print('CI_SPINE_TESTS_EXECUTED='+str(results[-1]))
          PY
      - name: JQ-04 source-to-view pointer adversarial matrix and receipt
        run: |
          set -euo pipefail
          python docs/ci-spine/pointers/test_pointer_contract.py 2>&1 | tee "$RUNNER_TEMP/ci-spine-pointers.log"
          python - <<'PY'
          import os,re
          from pathlib import Path
          s=(Path(os.environ['RUNNER_TEMP'])/'ci-spine-pointers.log').read_text()
          results=[int(x) for x in re.findall(r'^Ran (\d+) tests in ',s,re.M)]
          if not results or results[-1] < 27:
              raise SystemExit('CI_SPINE_POINTER_POPULATION_FIRST_RED')
          print('CI_SPINE_POINTER_TESTS_EXECUTED='+str(results[-1]))
          PY
          python docs/ci-spine/pointers/pointer_contract.py --out "$RUNNER_TEMP/ci-spine-pointer-receipt.json"
          test -s "$RUNNER_TEMP/ci-spine-pointer-receipt.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-spine-source-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ci-spine-tests.log
            ${{ runner.temp }}/ci-spine-pointers.log
            ${{ runner.temp }}/ci-spine-pointer-receipt.json
          if-no-files-found: warn
          retention-days: 21
  browser:
    name: Chromium responsive interaction and provenance QA
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned browser QA tooling
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Execute offline and negative browser DoV
        run: |
          set -euo pipefail
          python docs/ci-spine/browser_explorer_qa.py
          test -s docs/ci-spine/qa/explorer/browser-receipt.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-spine-browser-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: docs/ci-spine/qa/explorer/
          if-no-files-found: warn
          retention-days: 21

  plotly:
    name: Offline Plotly clock projection (optional consumer)
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Render native Plotly in self-contained offline HTML
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check plotly==6.5.2
          python docs/ci-spine/plotly_projection.py --bundle-explorer --out "$RUNNER_TEMP/ci-spine-plotly/ci-spine-plotly.html"
          test -s "$RUNNER_TEMP/ci-spine-plotly/ci-spine-plotly.html"
          test -s "$RUNNER_TEMP/ci-spine-plotly/explorer.html"
          test -s "$RUNNER_TEMP/ci-spine-plotly/ci-spine-plotly.receipt.json"
      - name: JQ08 source-to-point receipt consistency (no external calls)
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          folder = Path(os.environ["RUNNER_TEMP"]) / "ci-spine-plotly"
          html = (folder / "ci-spine-plotly.html").read_bytes()
          receipt = json.loads((folder / "ci-spine-plotly.receipt.json").read_text())
          assert receipt["schema"] == "gbo.ci-spine.plotly-point-receipt.v1"
          assert receipt["chart"]["sha256"] == hashlib.sha256(html).hexdigest()
          assert receipt["chart"]["bytes"] == len(html)
          assert receipt["count"] == len(receipt["points"]) == 8
          assert len({p["point_id"] for p in receipt["points"]}) == 8
          assert receipt["precision"] == "PLOTLY_POINT_SELECTION"
          assert receipt["pdf_mapping"] == "UNMAPPED_NO_VERIFIED_BINARY"
          assert receipt["authority_transfer"] is False and receipt["merge_authorized"] is False
          assert receipt["source"]["sha256"] == hashlib.sha256(
              Path("docs/ci-spine/RUN_TIMING_SAMPLES_20261028.json").read_bytes()).hexdigest()
          assert b'gd.on("plotly_click", selectPoint)' in html
          assert b'ci-spine-point-inspector' in html
          assert b'Object.hasOwn(points, id)' in html
          assert b'connect-src' not in html or b'fetch(' not in html
          print("JQ08_POINTS_SOURCE_BOUND=8; PDF=UNMAPPED; AUTHORITY=false")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-spine-plotly-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-spine-plotly/
          if-no-files-found: warn
          retention-days: 21
