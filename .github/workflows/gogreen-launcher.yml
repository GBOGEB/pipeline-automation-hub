name: GOGREEN launcher
on:
  # no path filter: the launcher pins owner outputs and the titles of HTML pages across the repository,
  # so any PR can stale it; the job takes under a minute
  pull_request:
  push:
    branches: [master]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: gogreen-launcher-${{ github.ref }}
  cancel-in-progress: true
jobs:
  launcher:
    name: Launcher outputs current and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout exact author head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check outputs and run tests
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python mission-control/gogreen/launcher/build_launcher.py --check
          python -m unittest discover -s mission-control/gogreen/launcher -p "test_*.py" -v
