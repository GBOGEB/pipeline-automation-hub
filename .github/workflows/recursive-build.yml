name: recursive-build

on:
  pull_request:
    paths:
      - "scripts/Recursive_Build_Master.py"
      - "scripts/recursive_build.py"
      - "scripts/run_processing.py"
      - "tests/test_recursive_build_master.py"
      - "tests/test_run_processing_recursive_integration.py"
      - "excel_schedule_engine/**"
      - ".github/workflows/recursive-build.yml"
      - "docs/recursive_build/**"
      - ".vscode/tasks.json"
  push:
    branches: [master]
    paths:
      - "scripts/Recursive_Build_Master.py"
      - "scripts/recursive_build.py"
      - "scripts/run_processing.py"
      - "tests/test_recursive_build_master.py"
      - "tests/test_run_processing_recursive_integration.py"
      - "excel_schedule_engine/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install Excel schedule-engine dependency
        run: python -m pip install -r excel_schedule_engine/requirements.txt
      - name: Compile
        run: python -m py_compile scripts/Recursive_Build_Master.py scripts/recursive_build.py scripts/run_processing.py excel_schedule_engine/src/excel_schedule_engine.py
      - name: Unit tests
        run: |
          python -m unittest -v tests.test_recursive_build_master tests.test_run_processing_recursive_integration tests.test_main_pipeline_e2e
