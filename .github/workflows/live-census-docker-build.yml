name: Live Census Docker image build
on:
  pull_request:
    paths:
      - 'mission-control/federation-atlas/live-census/**'
      - '.github/workflows/live-census-docker-build.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-census-docker-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build census-view image (no push) and probe HEALTHCHECK
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate compose file
        working-directory: mission-control/federation-atlas/live-census
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image locally, never pushed
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: mission-control/federation-atlas/live-census
          file: mission-control/federation-atlas/live-census/Dockerfile
          push: false
          load: true
          tags: live-census-view:ci-${{ github.sha }}
      - name: Run container and wait for HEALTHCHECK to report healthy
        shell: bash
        run: |
          set -euo pipefail
          cid=$(docker run -d --read-only --cap-drop ALL \
            -v "$PWD/mission-control/federation-atlas/live-census/output:/srv/output:ro" \
            "live-census-view:ci-${GITHUB_SHA}")
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          for _ in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$cid")
            echo "health=$status"
            if [ "$status" = healthy ]; then exit 0; fi
            if [ "$status" = unhealthy ]; then break; fi
            sleep 3
          done
          docker logs "$cid" || true
          echo "::error::census-view container did not become healthy"
          exit 1
