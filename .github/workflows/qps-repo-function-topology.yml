name: QPS Repo Function Topology

on:
  pull_request:
    paths:
      - 'mission-control/qps-triage-ultra/topology/**'
      - 'mission-control/qps-triage-ultra/README.md'
      - '.github/workflows/qps-repo-function-topology.yml'
  push:
    branches: [master]
    paths:
      - 'mission-control/qps-triage-ultra/topology/**'
      - 'mission-control/qps-triage-ultra/README.md'
      - '.github/workflows/qps-repo-function-topology.yml'

permissions:
  contents: read

jobs:
  validate-repo-function-topology:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record exact checkout identity
        shell: bash
        run: |
          echo "checked_out_sha=$(git rev-parse HEAD)"
          echo "workflow_sha=${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate QPS repository-function topology
        run: python mission-control/qps-triage-ultra/topology/validate_repo_function_topology.py
