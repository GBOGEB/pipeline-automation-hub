name: GOGREEN Root Recovery Frontier (read-only)
on:
  pull_request:
    paths:
      - 'mission-control/gogreen/recovery_frontier.py'
      - 'mission-control/gogreen/tests/test_recovery_frontier.py'
      - 'mission-control/qps-triage-ultra/p-process/site/everred/data/everred.json'
      - '.github/workflows/gogreen-root-frontier.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: recovery-frontier-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  contract:
    name: public staged frontier negatives (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact source head
        env:
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Negative-first real register and safety tests
        working-directory: mission-control/gogreen/tests
        run: |
          set -euo pipefail
          python -m unittest -v test_recovery_frontier
