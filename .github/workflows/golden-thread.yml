name: Golden Thread Replay

on:
  pull_request:
    paths:
      - 'mission-control/golden-thread/**'
      - '.github/workflows/golden-thread.yml'
  push:
    branches:
      - master
      - 'mission/**'
    paths:
      - 'mission-control/golden-thread/**'
      - '.github/workflows/golden-thread.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact checkout head
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Compile Golden Thread runtimes
        run: |
          python -m py_compile mission-control/golden-thread/golden_thread.py
          python -m py_compile mission-control/golden-thread/temporal_checkpoint.py

      - name: Run Golden Thread unit tests
        run: |
          python -m unittest discover \
            -s mission-control/golden-thread \
            -p 'test_*.py' \
            -v

      - name: Verify sealed cold-tail ledger
        run: |
          python mission-control/golden-thread/golden_thread.py verify \
            mission-control/golden-thread/fixtures/COLD_TAIL_BOOTSTRAP_LEDGER_v1.json \
            > golden-thread-ledger-verification.json

      - name: Rebuild cold-tail current projection
        run: |
          python mission-control/golden-thread/golden_thread.py rebuild-current \
            mission-control/golden-thread/fixtures/COLD_TAIL_BOOTSTRAP_LEDGER_v1.json \
            --out golden-thread-current-projection.json

      - name: Prove knowledge-time hindsight exclusion and N-1 to N delta
        run: |
          python mission-control/golden-thread/golden_thread.py rebuild-known-at \
            mission-control/golden-thread/fixtures/COLD_TAIL_BOOTSTRAP_LEDGER_v1.json \
            2026-09-17T00:56:11Z \
            --out golden-thread-known-before.json
          python mission-control/golden-thread/golden_thread.py rebuild-known-at \
            mission-control/golden-thread/fixtures/COLD_TAIL_BOOTSTRAP_LEDGER_v1.json \
            2026-09-17T00:56:13Z \
            --out golden-thread-known-after.json
          python mission-control/golden-thread/golden_thread.py diff-known-at \
            mission-control/golden-thread/fixtures/COLD_TAIL_BOOTSTRAP_LEDGER_v1.json \
            2026-09-17T00:56:11Z 2026-09-17T00:56:13Z \
            --out golden-thread-known-diff.json
          python - <<'PY'
          import json
          before=json.load(open("golden-thread-known-before.json"))
          after=json.load(open("golden-thread-known-after.json"))
          delta=json.load(open("golden-thread-known-diff.json"))
          assert before["metrics"]["event_count"]==12
          assert after["metrics"]["event_count"]==14
          assert delta["metric_delta"]["event_count"]==2
          assert delta["formal_root_closure_credit"] is None
          assert before["temporal_selection"]["full_ledger_verified"] is True
          assert after["authority_transfer"] is False
          print("GOLDEN_THREAD_BITEMPORAL_SOURCE_BOUND=PASS")
          PY

      - name: Render and verify four knowledge-time formats
        run: |
          python mission-control/golden-thread/rendition_family.py render \
            golden-thread-known-after.json golden-thread-known-renditions \
            --stem GOLDEN_THREAD_KNOWN_AFTER
          python mission-control/golden-thread/rendition_family.py verify \
            golden-thread-known-after.json golden-thread-known-renditions \
            --manifest GOLDEN_THREAD_KNOWN_AFTER_RENDITION_MANIFEST.json
          test -s golden-thread-known-renditions/GOLDEN_THREAD_KNOWN_AFTER.html
          test -s golden-thread-known-renditions/GOLDEN_THREAD_KNOWN_AFTER.yaml

      - name: Build cold-tail temporal k/e checkpoint
        run: |
          python mission-control/golden-thread/temporal_checkpoint.py build \
            mission-control/golden-thread/fixtures/COLD_TAIL_BOOTSTRAP_LEDGER_v1.json \
            --base-k 0 \
            --git-repo "$GITHUB_REPOSITORY" \
            --git-commit-sha "$GITHUB_SHA" \
            --milestone GT-M0-COLDTAIL \
            --out golden-thread-temporal-checkpoint.json

      - name: Verify cold-tail temporal checkpoint replay
        run: |
          python mission-control/golden-thread/temporal_checkpoint.py verify \
            mission-control/golden-thread/fixtures/COLD_TAIL_BOOTSTRAP_LEDGER_v1.json \
            golden-thread-temporal-checkpoint.json \
            > golden-thread-temporal-verification.json

      - name: Verify observed QPS W57 DEFER ledger
        run: |
          python mission-control/golden-thread/golden_thread.py verify \
            mission-control/golden-thread/fixtures/QPS_W57_P02_PVPS_DEFER_LEDGER_v1.json \
            > golden-thread-w57-ledger-verification.json

      - name: Rebuild observed QPS W57 DEFER projection
        run: |
          python mission-control/golden-thread/golden_thread.py rebuild-current \
            mission-control/golden-thread/fixtures/QPS_W57_P02_PVPS_DEFER_LEDGER_v1.json \
            --out golden-thread-w57-current-projection.json

      - name: Build observed QPS W57 DEFER temporal checkpoint
        run: |
          python mission-control/golden-thread/temporal_checkpoint.py build \
            mission-control/golden-thread/fixtures/QPS_W57_P02_PVPS_DEFER_LEDGER_v1.json \
            --base-k 0 \
            --git-repo "$GITHUB_REPOSITORY" \
            --git-commit-sha "$GITHUB_SHA" \
            --milestone GT-M1-QPS-W57-P02-DEFER \
            --out golden-thread-w57-temporal-checkpoint.json

      - name: Verify observed QPS W57 DEFER temporal checkpoint replay
        run: |
          python mission-control/golden-thread/temporal_checkpoint.py verify \
            mission-control/golden-thread/fixtures/QPS_W57_P02_PVPS_DEFER_LEDGER_v1.json \
            golden-thread-w57-temporal-checkpoint.json \
            > golden-thread-w57-temporal-verification.json

      - name: Show receipts
        if: always()
        run: |
          for f in golden-thread-*.json; do
            echo "===== $f ====="
            cat "$f" || true
          done

      - name: Upload Golden Thread receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: golden-thread-replay-receipts
          path: |
            golden-thread-ledger-verification.json
            golden-thread-current-projection.json
            golden-thread-known-before.json
            golden-thread-known-after.json
            golden-thread-known-diff.json
            golden-thread-known-renditions/
            golden-thread-temporal-checkpoint.json
            golden-thread-temporal-verification.json
            golden-thread-w57-ledger-verification.json
            golden-thread-w57-current-projection.json
            golden-thread-w57-temporal-checkpoint.json
            golden-thread-w57-temporal-verification.json
          if-no-files-found: error
          retention-days: 30
