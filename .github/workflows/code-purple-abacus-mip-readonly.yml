name: CODE PURPLE ABACUS MIP Readonly Consumer
on:
  pull_request:
    paths:
      - 'mission-control/federation-atlas/flightdeck/pulses/abacus_mip_*.py'
      - 'mission-control/federation-atlas/flightdeck/pulses/test_abacus_mip_*.py'
      - 'mission-control/federation-atlas/flightdeck/pulses/ABACUS_MIP_READONLY_CONSUMER.md'
      - '.github/workflows/code-purple-abacus-mip-readonly.yml'
  workflow_dispatch:
    inputs:
      abacus_sha:
        description: Exact 40-character ABACUS source SHA (no branch/latest)
        required: true
        type: string
      previous_abacus_sha:
        description: Optional earlier exact source SHA for descriptive matched N/N+1 comparison
        required: false
        type: string
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Read-only bridge and native acquisition negative controls
        run: >-
          python -m unittest discover -v
          -s mission-control/federation-atlas/flightdeck/pulses
          -p 'test_abacus_mip_*.py'
  ingest:
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GBOGEB/ABACUS
          ref: ${{ inputs.abacus_sha }}
          path: native-abacus
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Acquire complete exact-SHA native runs and use canonical producer
        env:
          ABACUS_SHA: ${{ inputs.abacus_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          if not re.fullmatch(r'[a-f0-9]{40}', os.environ['ABACUS_SHA']):
              raise ValueError('invalid exact ABACUS source identity')
          PY
          test "$(git -C native-abacus rev-parse HEAD)" = "$ABACUS_SHA"
          mkdir -p out
          python control/mission-control/federation-atlas/flightdeck/pulses/abacus_mip_collect.py \
            --source-sha "$ABACUS_SHA" --output out/native_input.json
          env -u GITHUB_TOKEN -u GH_TOKEN python \
            native-abacus/tools/mip_ci_wave_telemetry.py \
            out/native_input.json > out/canonical_abacus_projection.json
          python control/mission-control/federation-atlas/flightdeck/pulses/abacus_mip_bridge.py \
            --projection out/canonical_abacus_projection.json \
            --source-sha "$ABACUS_SHA" \
            --output out/mission_control_supporting.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('out/mission_control_supporting.json').read_text())
          if (report['merge_admission'] != 'HOLD' or report['authority_transfer'] or
                  report['qps_acceptance'] != 'DEFER' or
                  any(v is not None for v in report['statistics']['intervals_90_95_99'].values())):
              raise ValueError('promotion of unqualified measurement')
          PY
      - name: Optional source-name matched temporal convergence
        if: inputs.previous_abacus_sha != ''
        env:
          PREVIOUS_ABACUS_SHA: ${{ inputs.previous_abacus_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python control/mission-control/federation-atlas/flightdeck/pulses/abacus_mip_collect.py \
            --source-sha "$PREVIOUS_ABACUS_SHA" --output out/native_input_before.json
          python control/mission-control/federation-atlas/flightdeck/pulses/abacus_mip_transition.py \
            --before out/native_input_before.json \
            --after out/native_input.json \
            --output out/mission_control_matched_transition.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('out/mission_control_matched_transition.json').read_text())
          if (report['merge_admission']!='HOLD' or report['authority_transfer'] or
                  any(v is not None for v in report['inferential']['confidence_intervals_90_95_99'].values())):
              raise ValueError('unqualified temporal promotion')
          PY
      - name: Record canonical code blob and input/output hashes
        env:
          ABACUS_SHA: ${{ inputs.abacus_sha }}
          MISSION_CONTROL_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          def source_git(*args):
              return subprocess.check_output(
                  ['git', '-C', 'native-abacus', *args], text=True
              ).strip()
          if source_git('rev-parse', 'HEAD') != os.environ['ABACUS_SHA']:
              raise ValueError('canonical binary source SHA drift')
          source_blob = source_git('hash-object', 'tools/mip_ci_wave_telemetry.py')
          names = ('native_input.json','canonical_abacus_projection.json',
                   'mission_control_supporting.json','native_input_before.json',
                   'mission_control_matched_transition.json')
          hashes = {
              name: hashlib.sha256((Path('out')/name).read_bytes()).hexdigest()
              for name in names if (Path('out')/name).is_file()
          }
          record = {
              'schema': 'code-purple.mc.mip-lineage.v1',
              'source_repository': 'GBOGEB/ABACUS',
              'source_sha': os.environ['ABACUS_SHA'],
              'canonical_producer_path': 'tools/mip_ci_wave_telemetry.py',
              'canonical_producer_git_blob_sha': source_blob,
              'mission_control_execution_sha': os.environ['MISSION_CONTROL_SHA'],
              'github_run_id': int(os.environ['GITHUB_RUN_ID']),
              'github_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'job_key': os.environ['GITHUB_JOB'],
              'native_numeric_job_id': None,
              'member_sha256': hashes,
              'original_artifact_custody_verified': None,
              'merge_admission': 'HOLD',
              'accepted_rex': None,
              'authority_transfer': False,
              'qps_acceptance': 'DEFER'
          }
          Path('out/source_binding.json').write_text(
              json.dumps(record, sort_keys=True, indent=2)+'\n', encoding='utf-8'
          )
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: abacus-mip-supporting-${{ github.run_id }}
          path: out/
          if-no-files-found: error
