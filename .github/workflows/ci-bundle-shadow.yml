# N2: additive shadow execution only. Not a required status or admission policy change.
name: JADE CI Bundle Shadow (read-only)
on:
  pull_request:
    paths:
      - 'mission-control/jade_temple/devops/ci_bundle_*'
      # Direct inventory inputs: path filters are case-sensitive, so the catalog needs its own entry.
      - 'mission-control/jade_temple/devops/CI_BUNDLE_CATALOG_V1.json'
      - 'mission-control/jade_temple/devops/workflows.py'
      - 'mission-control/jade_temple/devops/tests/test_ci_bundle_*.py'
      - '.github/workflows/ci-bundle-shadow.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-bundle-shadow-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  inventory:
    name: CI bundle immutable-source inventory (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact-head readback
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install parser dependency
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pyyaml==6.0.3
      - name: Shadow contracts and negative controls
        run: |
          set -euo pipefail
          python -m unittest discover -s mission-control/jade_temple/devops/tests \
            -p 'test_ci_bundle_*.py' -v 2>&1 | tee "$RUNNER_TEMP/ci-bundle-tests.log"
      - name: Inventory every workflow from immutable source
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python mission-control/jade_temple/devops/ci_bundle_inventory.py \
            --source-sha "$EXPECTED" --out "$RUNNER_TEMP/ci-bundle-shadow.json" \
            2>&1 | tee "$RUNNER_TEMP/ci-bundle-summary.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-bundle-shadow-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ci-bundle-tests.log
            ${{ runner.temp }}/ci-bundle-summary.log
            ${{ runner.temp }}/ci-bundle-shadow.json
          retention-days: 21
          if-no-files-found: warn
