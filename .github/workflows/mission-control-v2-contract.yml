name: Mission Control v2 Contract

on:
  pull_request:
    paths:
      - 'mission-control/v2/**'
      - '.github/workflows/mission-control-v2-contract.yml'
  push:
    branches: [master]
    paths:
      - 'mission-control/v2/**'
      - '.github/workflows/mission-control-v2-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate Mission Control v2
        env:
          MC_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$MC_SOURCE_SHA"
          python mission-control/v2/validate_mission_control_v2.py --self-test --emit-receipt /tmp/mission-control-v2-validation-receipt.json
      - name: Verify governed three-pulse N-to-N+3 controls
        run: |
          python -m unittest discover -s mission-control/v2 -p 'test_g3p_execution.py' -v
      - name: Upload validation receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mission-control-v2-validation-receipt
          path: /tmp/mission-control-v2-validation-receipt.json
