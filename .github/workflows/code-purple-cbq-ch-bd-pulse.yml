name: CODE PURPLE CBQ CH-BD Readonly Pulse
on:
  pull_request:
    paths:
      - 'mission-control/federation-atlas/flightdeck/pulses/**'
      - '.github/workflows/code-purple-cbq-ch-bd-pulse.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  queue-proof:
    name: Source-hashed CBQ and CH-BD projection
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify source is actual PR head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Native readonly negative-controls (12 tests)
        run: >-
          python -m unittest discover
          -s mission-control/federation-atlas/flightdeck/pulses
          -p test_cbq_ch_bd_render.py -v
      - name: Native matched-cohort impact controls (12 tests)
        run: >-
          python -m unittest discover
          -s mission-control/federation-atlas/flightdeck/pulses
          -p test_cbq_impact_census.py -v
      - name: Produce second source-bound N+1 impact census
        shell: bash
        run: |
          set -euo pipefail
          cd mission-control/federation-atlas/flightdeck/pulses
          python cbq_impact_census.py \
            --parent CBQ_CH_BD_20261016.json \
            --source RE_CENSUS_IMPACT_20261016.json \
            --out "$GITHUB_WORKSPACE/out/cbq-ch-bd/impact"
      - name: Native reverse-pressure positive and negative controls
        run: |
          python -m pip install coverage==7.16.2
          python -m coverage run --branch --source=mission-control/federation-atlas/flightdeck/pulses -m unittest discover -s mission-control/federation-atlas/flightdeck/pulses -p test_reverse_pressure.py -v
      - name: Produce conservative reverse-pressure roll-up
        shell: bash
        run: |
          set -euo pipefail
          python mission-control/federation-atlas/flightdeck/pulses/reverse_pressure.py \
            --pulse mission-control/federation-atlas/flightdeck/pulses/CBQ_CH_BD_20261016.json \
            --recensus mission-control/federation-atlas/flightdeck/pulses/RE_CENSUS_IMPACT_20261016.json \
            --delta mission-control/federation-atlas/flightdeck/pulses/SOURCE_DELTA_20261016_P2.json \
            --out out/cbq-ch-bd/pressure
          python -m coverage json -o out/cbq-ch-bd/pressure/coverage.json
      - name: Verify reverse-pressure receipt cannot promote authority
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          out = Path("out/cbq-ch-bd/pressure")
          report = json.loads((out / "reverse_pressure.json").read_text())
          manifest = json.loads((out / "reverse_pressure_manifest.json").read_text())
          for name, sha in manifest["output_sha256"].items():
              if hashlib.sha256((out / name).read_bytes()).hexdigest() != sha:
                  raise ValueError("reverse-pressure member digest mismatch")
          if report["authority"]["merge_authorized"] or report["authority"]["dispatch_authorized"]:
              raise ValueError("unapproved authority promotion")
          if report["metrics"]["accepted_engineering_roots_closed"] != 0:
              raise ValueError("unsupported root closure")
          if report["ranking_diagnostics"]["pca_ready"] or report["ranking_diagnostics"]["bt_ready"]:
              raise ValueError("unqualified statistical fit")
          coverage = json.loads((out / "coverage.json").read_text())
          if not coverage.get("files"):
              raise ValueError("missing real coverage file denominators")
          PY
      - name: Build sealed read-only pulse projection
        shell: bash
        run: |
          set -euo pipefail
          python mission-control/federation-atlas/flightdeck/pulses/cbq_ch_bd_render.py \
            --source mission-control/federation-atlas/flightdeck/pulses/CBQ_CH_BD_20261016.json \
            --out out/cbq-ch-bd
          export CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          out = Path("out/cbq-ch-bd")
          report = json.loads((out / "projection.json").read_text())
          manifest = json.loads((out / "manifest.json").read_text())
          if manifest["evidence_level"] != "LOCAL_REPRODUCIBILITY":
              raise ValueError("projection grade mismatch")
          if report["verified_root_closures"] != 0:
              raise ValueError("forged root closure")
          if report["authority"]["qps_decision"] != "DEFER":
              raise ValueError("forged QPS acceptance")
          if report["authority"]["native_four_hop"] != "UNKNOWN":
              raise ValueError("forged peer execution")
          for name, digest in manifest["artifacts"].items():
              if hashlib.sha256((out / name).read_bytes()).hexdigest() != digest:
                  raise ValueError("projection member digest mismatch")
          receipt = {
              "schema": "code-purple.cbq_ch_bd.gha_projection_receipt.v1",
              "checked_out_sha": os.environ["CHECKED_OUT_SHA"],
              "event_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "job": os.environ["GITHUB_JOB"],
              "source_digest": manifest["source_sha256"],
              "grade": "EXACT_SHA_PROJECTOR_NOT_FEDERATION",
              "native_cross_repository": False,
              "qps_acceptance": "DEFER",
              "root_closures": 0,
          }
          (out / "workflow_receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          PY
      - name: Upload diagnostic projections only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cbq-ch-bd-pulse-${{ github.run_id }}
          path: out/cbq-ch-bd/
          if-no-files-found: error
