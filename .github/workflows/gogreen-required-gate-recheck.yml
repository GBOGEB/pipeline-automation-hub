name: GOGREEN Required Gate Re-check

# When an ENFORCED gate finishes green on a PR head, re-run the latest FAILED
# "GOGREEN required gate" run on that same head, so re-running a red gate turns the required
# check green without a manual aggregator re-run (issue #886).
#
# workflow_run always runs this file from the default branch, so it is privileged: it checks
# out github.sha (the default-branch commit) and asserts HEAD equals it, never the PR head;
# event values reach the script only through env, and the script validates the head SHA.
# The only write is POST /actions/runs/{id}/rerun on an aggregator run (actions: write).
#
# The names list below is generated from ADMISSION.json (ENFORCED) and kept in sync by
# test_gate.py: python mission-control/gogreen/required_gate/gate.py recheck-names --write
