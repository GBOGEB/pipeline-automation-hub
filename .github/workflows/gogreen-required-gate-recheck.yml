permissions:
  contents: read

concurrency:
  group: gogreen-required-gate-recheck-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  recheck:
    name: Re-run failed GOGREEN required gate
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert checkout is the default-branch commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "::error::checked out $actual, expected $EXPECTED_SHA"
            exit 1
          fi
      - name: Re-run the latest failed aggregator run on this head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GATE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          GATE_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          echo "triggered by $GATE_RUN_URL"
          python3 mission-control/gogreen/required_gate/gate.py recheck \
            --sha "$HEAD_SHA" --conclusion "$GATE_CONCLUSION"
