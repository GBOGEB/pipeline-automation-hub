name: QPS Triage Web DoV

on:
  pull_request:
    paths:
      - 'mission-control/qps-triage-ultra/site/**'
      - 'mission-control/qps-triage-ultra/web/**'
      - 'app/lib/qps-ui-tokens.ts'
      - 'app/app/qps-ui-contract/**'
      - 'app/package.json'
      - '.github/workflows/qps-triage-web.yml'
  push:
    branches:
      - 'master'
      - 'qps-web-dov-pulse-*'
      - 'qps-web-control-promotion-*'
    paths:
      - 'mission-control/qps-triage-ultra/site/**'
      - 'mission-control/qps-triage-ultra/web/**'
      - 'app/lib/qps-ui-tokens.ts'
      - 'app/app/qps-ui-contract/**'
      - 'app/package.json'
      - '.github/workflows/qps-triage-web.yml'
  workflow_dispatch:

jobs:
  qps-web-dov:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mission-control/qps-triage-ultra/site
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1
        with:
          ruby-version: '3.3'

      - name: Install Jekyll dependencies
        run: bundle install

      - name: Set up Python for the offline Plotly bundle
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Vendor offline plotly.js from the gg_MATH pin (no CDN)
        run: |
          python3 -m pip install plotly==7.0.0
          python3 ../ggmath_plotly.py --vendor-plotlyjs assets/js

      - name: Bind exact build identity
        env:
          QPS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          QPS_EVIDENCE_STATE: OBSERVED
        run: python3 scripts/prepare_site.py

      - name: J1-J5 build and validate
        run: |
          rm -rf _site_a
          bundle exec jekyll build --destination _site_a
          python3 scripts/validate_site.py _site_a

      - name: J6 repeatability
        run: |
          rm -rf _site_b
          bundle exec jekyll build --destination _site_b
          diff -qr _site_a _site_b

      - name: Publish evidence artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qps-triage-web-${{ github.event.pull_request.head.sha || github.sha }}
          path: mission-control/qps-triage-ultra/site/_site_a
          if-no-files-found: error
