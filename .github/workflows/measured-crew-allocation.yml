name: MissionControl Measured Crew Allocation

on:
  pull_request:
    branches: [master]
    paths:
      - 'mission-control/qps-triage-ultra/crew/**'
      - '.github/workflows/measured-crew-allocation.yml'
  push:
    branches:
      - master
      - mission/measured-crew-allocation-v1-20260913
    paths:
      - 'mission-control/qps-triage-ultra/crew/**'
      - '.github/workflows/measured-crew-allocation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measured-crew-allocation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source head
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
      - name: Validate reusable REX checklist
        run: python mission-control/qps-triage-ultra/crew/measured/validate_rex_reuse.py
      - name: Prove blocked and admitted REX runtime control
        run: python mission-control/qps-triage-ultra/crew/measured/test_rex_runtime_control.py
      - name: Validate canonical evidence returns
        run: python mission-control/qps-triage-ultra/crew/measured/validate_evidence_returns.py
      - name: Execute predeclared Mission Crew Task Runtime chain
        env:
          MC_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python mission-control/qps-triage-ultra/crew/measured/run_measured_tasks.py
      - name: Validate measured crew exposure receipts
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for receipt in mission-control/qps-triage-ultra/crew/measured/receipts/exposure/*__EXPOSURE.json; do
            python mission-control/qps-triage-ultra/crew/measured/validate_crew_exposure.py "$receipt"
            count=$((count + 1))
          done
          test "$count" -eq 4
      - name: Build measured allocation evidence
        run: python mission-control/qps-triage-ultra/crew/measured/build_measured_allocation.py
      - name: Enrich allocation with controlled exposure history and PCA
        run: python mission-control/qps-triage-ultra/crew/measured/enrich_allocation_with_exposure.py
      - name: Enforce exposure PCA and recurrent controls
        shell: bash
        run: |
          python - <<'PY'
          import json
          import math
          import subprocess
          from pathlib import Path
          root=Path('mission-control/qps-triage-ultra/crew/measured')
          summary=json.loads((root/'receipts/RUN_SUMMARY.json').read_text())
          alloc=json.loads((root/'MEASURED_ALLOCATION_RECEIPT.json').read_text())
          actual=subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          assert summary['source_sha'] == actual
          assert summary['checkout_sha'] == actual
          assert summary['task_count'] == 4
          assert summary['accepted'] == 4
          assert summary['rejected'] == 0
          assert summary['preflight_blocked'] == 0
          assert summary['crew_exposure_receipts'] == 4
          assert summary['crew_exposure_seconds_total'] >= summary['crew_active_seconds_total']
          assert summary['crew_waiting_seconds_total'] >= 0
          assert summary['crew_release_seconds_total'] >= 0
          assert summary['crew_exposure_pca_eligible'] is False
          assert summary['crew_exposure_bt_eligible'] is False
          assert summary['competency_promotions'] == 0
          exposure=list(root.joinpath('receipts/exposure').glob('*__EXPOSURE.json'))
          assert len(exposure) == 4
          for p in exposure:
              r=json.loads(p.read_text())
              assert r['receipt_evidence_class'] == 'MEASURED_CREW_EXPOSURE'
              assert r['attribution_basis'] == 'PREDECLARED_ASSIGNMENT'
              assert r['source_sha'] == actual
              assert r['mission_performance_eligible'] is True
              assert r['pca_eligible'] is False
              assert r['bt_eligible'] is False
              assert r['competency_promotion_eligible'] is False
              assert r['authority_transfer'] is False
              assert r['child_binding'] is False
              assert r['frontier_binding'] is False
          task_receipts=list(root.joinpath('receipts').glob('T*.json'))
          assert len(task_receipts) == 4
          for p in task_receipts:
              r=json.loads(p.read_text())
              assert r['attribution_basis'] == 'PREDECLARED_ASSIGNMENT'
              assert r['steps_executed'] > 0
              assert r['source_sha'] == actual
              assert r['promotion_allowed'] is False
              assert r['rex_preflight']['checklist_version'] == 'missioncontrol.rex.reuse_checklist.v1'
              assert r['rex_preflight']['preflight_complete'] is True
              assert r['rex_preflight']['payload_allowed'] is True
              assert r['rex_preflight']['blocking_rex_ids'] == []
          assert alloc['allocation_eligible_rows'] == 4
          assert all(r['allocation_eligible'] for r in alloc['rows'])
          assert alloc['competency_promotions'] == 0
          assert alloc['authority_transfer'] is False
          exposure_control=alloc['exposure_control']
          assert exposure_control['status'] == 'CONTROLLED_PCA_CANDIDATE_FEATURES'
          assert exposure_control['controlled_rows'] == 4
          assert exposure_control['distinct_runs'] >= 3
          assert exposure_control['distinct_source_shas'] >= 3
          assert exposure_control['pca_candidate_eligible'] is True
          assert exposure_control['pca_feature_ingest_status'] == 'INGESTED_READY_SMALL_N'
          assert exposure_control['bt_status'] == 'NO_CHANGE_EXISTING_BT_OUTCOME_GATE'
          assert exposure_control['competency_promotions'] == 0
          assert exposure_control['authority_transfer'] is False
          assert len(exposure_control['varying_features']) >= 2
          for row in alloc['rows']:
              assert row['exposure_control_eligible'] is True
              assert row['exposure_distinct_runs'] >= 3
              assert row['exposure_distinct_source_shas'] >= 3
              assert row['exposure_evidence_class'] == 'CONTROLLED_MEASURED_THREE_PULSE'
              assert row['mean_waiting_seconds'] >= 0
              assert row['mean_active_seconds'] > 0
              assert row['mean_release_seconds'] >= 0
              assert row['mean_exposure_seconds'] >= row['mean_active_seconds']
          pca=alloc['pca']
          assert pca['status'] == 'READY_MEASURED_SMALL_N'
          assert pca['model_scope'] == 'CREW_ROW_ALLOCATION_WITH_CONTROLLED_EXPOSURE'
          assert pca['measured_rows'] == 4
          assert pca['eligible_rows'] == 4
          assert pca['varying_features'] >= 2
          assert pca['sample_rank_cap'] <= 3
          assert pca['small_n'] is True
          assert pca['causal_interpretation_allowed'] is False
          assert pca['competency_promotion_allowed'] is False
          assert len(pca['components']) >= 2
          assert pca['pre_exposure_status'] == 'DEFER_INSUFFICIENT_MEASURED_VARIANCE'
          assert alloc['pca_pre_exposure']['status'] == 'DEFER_INSUFFICIENT_MEASURED_VARIANCE'
          assert alloc['pca_pre_exposure']['variance_population'] == 'ALLOCATION_ELIGIBLE_ONLY'
          frontier=alloc['frontier_pca']
          assert frontier['status'] == 'CONTROL_READY_MEASURED_REPEAT'
          assert frontier['repeat_runs'] >= 2
          assert frontier['distinct_source_shas'] >= 2
          assert frontier['max_abs_explained_delta'] < 0.02
          assert frontier['rex_persistent_or_regression_total'] == 0
          assert alloc['bt']['status'] == 'READY_OBSERVED'
          assert alloc['bt']['observed_pairs'] == 12
          assert alloc['bt']['model_contract'] == 'TWO_NODE_BT_LOG_ODDS_V1'
          assert alloc['bt']['raw_timing_consistency'] == 'FAIL_CLOSED'
          assert alloc['bt']['analytic_fixture'] == 'PASS'
          nodes={n['strategy']:n for n in alloc['bt']['nodes']}
          assert nodes['ALLOC_SINGLE_CELL']['wins'] == 8.0
          assert nodes['ALLOC_PAIRED_CELL']['wins'] == 4.0
          observed_sep=nodes['ALLOC_SINGLE_CELL']['bt_log_strength']-nodes['ALLOC_PAIRED_CELL']['bt_log_strength']
          expected_sep=math.log(8.5/4.5)
          assert math.isclose(observed_sep, expected_sep, rel_tol=1e-12, abs_tol=1e-12)
          print(json.dumps({
              'status':'PASS_EXPOSURE_PCA_WITH_REX_BT_CONTROL',
              'exact_source_sha':actual,
              'crew_exposure_control':exposure_control,
              'crew_row_pca':pca,
              'frontier_pca':frontier,
              'bt':alloc['bt'],
              'competency_promotions':0,
              'authority_transfer':False
          },sort_keys=True))
          PY
      - name: Upload measured crew receipts
        uses: actions/upload-artifact@v4
        with:
          name: measured-crew-allocation-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            mission-control/qps-triage-ultra/crew/measured/receipts/*.json
            mission-control/qps-triage-ultra/crew/measured/receipts/exposure/*.json
            mission-control/qps-triage-ultra/crew/measured/MEASURED_ALLOCATION_RECEIPT.json
