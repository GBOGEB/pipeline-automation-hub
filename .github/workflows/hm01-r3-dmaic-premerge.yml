name: HM-01 R3 DMAIC Premerge

on:
  pull_request:
    branches: [master]
    paths:
      - "mission-control/grand-missions/R3_DMAIC_PREMERGE_CONTRACT_v1.json"
      - "mission-control/grand-missions/validate_r3_dmaic_premerge.py"
      - "mission-control/grand-missions/tests/test_r3_dmaic_premerge.py"
      - ".github/workflows/hm01-r3-dmaic-premerge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  premerge-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove five observed recurrence classes fail closed
        run: |
          mkdir -p output/r3-dmaic
          python mission-control/grand-missions/validate_r3_dmaic_premerge.py             --contract mission-control/grand-missions/R3_DMAIC_PREMERGE_CONTRACT_v1.json             --out output/r3-dmaic/R3_DMAIC_PREMERGE_RECEIPT_v1.json
      - name: Run premerge fault-injection tests
        run: python -m unittest mission-control/grand-missions/tests/test_r3_dmaic_premerge.py
      - name: Upload premerge proof
        uses: actions/upload-artifact@v4
        with:
          name: hm01-r3-dmaic-premerge
          path: output/r3-dmaic/R3_DMAIC_PREMERGE_RECEIPT_v1.json
          if-no-files-found: error
          retention-days: 30
