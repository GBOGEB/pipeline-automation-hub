name: Workstation Dashboards Offline QA
on:
  pull_request:
    paths:
      - 'tools/workstation/dashboards/**'
      - '.github/workflows/workstation-dashboards-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dashboards-offline:
    name: Dashboards offline Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - name: Checkout immutable candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run offline launcher tests at the exact head
        shell: bash
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          python -W error::DeprecationWarning -m unittest discover -s tools/workstation/dashboards -p 'test_build_dashboards.py' -v
