name: MIP H1 Canonical Recheck T1 Pilot

# Read-only, one-PR pilot. No schedule, gate reruns, cancellation or merge rights.
# Uses existing JADE Actions Metrics as the sole metric producer.
on:
  pull_request:
    paths:
      - '.github/workflows/mip-h1-canonical-recheck-t1.yml'

permissions:
  contents: read
  actions: read

jobs:
  source-qualified-t1:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Run the entire collector and all imports from one trusted,
          # event-pinned base commit, never from a contributor-modified head.
          ref: ${{ github.event.pull_request.base.sha }}
          path: collector
          persist-credentials: false
      - name: Verify complete collector checkout against exact GitHub base
        shell: bash
        env:
          DEFAULT_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$DEFAULT_SHA" != ""
          test "$(git -C collector rev-parse HEAD)" = "$DEFAULT_SHA"
          test -f collector/mission-control/jade_temple/devops/actions_metrics.py
          test -f collector/mission-control/jade_temple/tools/bd_queue_wave.py
          echo "DEFAULT_SHA=$DEFAULT_SHA" >> "$GITHUB_ENV"
          echo "Pinned full collector checkout: $DEFAULT_SHA"
      - name: Fetch complete UTC-day run caches (no job API calls)
        working-directory: collector
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SINCE="$(date -u -d '1 day ago' +%F)"
          UNTIL="$(date -u +%F)"
          mkdir -p "$RUNNER_TEMP/mip-t1"
          echo "SINCE=$SINCE" >> "$GITHUB_ENV"
          echo "UNTIL=$UNTIL" >> "$GITHUB_ENV"
          python3 mission-control/jade_temple/devops/actions_metrics.py fetch \
            --cache "$RUNNER_TEMP/mip-t1/cache" --since "$SINCE" --until "$UNTIL" \
            --repo GBOGEB/pipeline-automation-hub --job-budget 0
      - name: Canonical pressure projection and strict qualification
        working-directory: collector
        run: |
          set -euo pipefail
          python3 mission-control/jade_temple/devops/actions_metrics.py pressure \
            --cache "$RUNNER_TEMP/mip-t1/cache" --since "$SINCE" --until "$UNTIL" \
            --repo GBOGEB/pipeline-automation-hub --source-sha "$DEFAULT_SHA" \
            --out "$RUNNER_TEMP/mip-t1/t1.json"
          python3 - "$RUNNER_TEMP/mip-t1/t1.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          receipt = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(json.dumps({
              "coverage": receipt.get("coverage"),
              "value": receipt.get("value"),
              "sample_n": receipt.get("sample_n"),
              "cohort_sha256": receipt.get("cohort_sha256"),
              "receipt_sha256": receipt.get("receipt_sha256"),
              "source_sha": receipt.get("source_sha"),
              "cache_issues": receipt.get("cache_source_issues"),
          }, sort_keys=True))
          assert receipt["coverage"] == "COMPLETE" and receipt["sample_n"] == 1000
          assert receipt["value"] is not None and receipt["cache_readback_sha256"]
          assert not receipt["cache_source_issues"] and not receipt["missing_source_days"]
          PY
      - name: Upload source-bound T1 and full raw-cache replay evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mip-h1-canonical-recheck-t1
          path: |
            ${{ runner.temp }}/mip-t1/t1.json
            ${{ runner.temp }}/mip-t1/cache/**/*.json
          if-no-files-found: warn
          retention-days: 14
