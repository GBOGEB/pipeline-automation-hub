name: GOGREEN G4 Wave Metrics
on:
  pull_request:
    paths:
      - 'mission-control/gogreen/**'
      - '.github/workflows/gogreen-pulses.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gogreen-g4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  governed-pulse:
    name: G4 source-bound wave rollup
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout immutable exact head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Execute real GOGREEN regression and negative tests
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p "$RUNNER_TEMP/gogreen-pulses"
          python -m compileall -q mission-control/gogreen
          python -m unittest discover -s mission-control/gogreen/tests -q \
            2>&1 | tee "$RUNNER_TEMP/gogreen-pulses/unit_tests.log"
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP'])/'gogreen-pulses'
          log = (out/'unit_tests.log').read_text()
          found = re.findall(r'Ran (\d+) tests? in', log)
          if len(found)!=1 or int(found[0]) < 35 or '\nOK' not in log:
              raise SystemExit('Missing or zero native regression-test receipt')
          (out/'native_test_counts.json').write_text(
              json.dumps({'schema':'gogreen.native-test-counts.v1',
                'executed':int(found[0]), 'passed':int(found[0]),
                'failed':0, 'skipped':0,
                'source_sha':os.environ['EXPECTED_SHA'],
                'measurement':'NATIVE_GITHUB_UNIT_TESTS_ONLY'},sort_keys=True,indent=2)+'\n')
          PY
      - name: Generate bounded per-wave metrics
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python mission-control/gogreen/pulse_rollup.py \
            --g0 mission-control/gogreen/samples/fleet_g0.json \
            --g1 mission-control/gogreen/samples/fleet_g1.json \
            --out "$RUNNER_TEMP/gogreen-pulses" \
            --source-sha "$EXPECTED_SHA" \
            --workers 2 --per-repo 1 --packet-budget 12
      - name: Verify exact-head artifact bytes and HOLD boundary
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'gogreen-pulses'
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          report_bytes=(out/'pulse_rollup.json').read_bytes()
          report=json.loads(report_bytes)
          assert sha==os.environ['EXPECTED_SHA']==report['source_git_sha']
          assert report['merge_authorized'] is False and report['authority_transfer'] is False
          assert report['scale_plan']['dispatch_authorized'] is False
          assert len(report['waves'])==2 and report['waves'][1]['observed_cells']==6
          assert hashlib.sha256(report_bytes).hexdigest()==(out/'pulse_rollup.sha256').read_text().strip()
          receipt={'schema':'gogreen.g4.native-provenance.v1',
                   'repository':os.environ['REPOSITORY'],'checked_out_sha':sha,
                   'run_id':int(os.environ['RUN_ID']),
                   'run_attempt':int(os.environ['RUN_ATTEMPT']),
                   'pulse_rollup_sha256':hashlib.sha256(report_bytes).hexdigest(),
                   'admission':'HOLD','authority_transfer':False}
          (out/'native_provenance.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          PY
      - name: Upload evidence without mutation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gogreen-g4-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/gogreen-pulses/
          if-no-files-found: warn
          retention-days: 30
