name: CODE PURPLE Disjoint Live Census (read-only)
on:
  pull_request:
    paths:
      - 'mission-control/federation-atlas/live-census/**'
      - 'docs/code-purple-live/**'
      - '.github/workflows/code-purple-live-census.yml'
  workflow_dispatch:
  schedule:
    - cron: '19 * * * *'
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  local-contract:
    name: No-authority graph and feed negative controls
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Verify actual checkout and run all behavioral contracts
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m unittest discover -s mission-control/federation-atlas/live-census/tests -p 'test_*.py' -v
      - name: Rebuild read-only frozen snapshot and verify member hashes
        shell: bash
        run: |
          set -euo pipefail
          cd mission-control/federation-atlas/live-census
          python source/live_census.py --seed data/observed_fixture.json --out out
          python source/live_census.py --verify out
      - name: Bind artifact to verified checkout/event/run/attempt identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python - <<'PYRECEIPT'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          expected = os.environ['EXPECTED_SHA']
          if actual != expected or len(actual) != 40:
              raise SystemExit('source mismatch')
          out = Path('mission-control/federation-atlas/live-census/out')
          manifest_raw = (out / 'manifest.json').read_bytes()
          manifest = json.loads(manifest_raw)
          receipt = {
              'schema': 'codepurple.live.exact_checkout_receipt.v1',
              'checkout_sha': actual,
              'event_sha': os.environ['GITHUB_SHA'],
              'event_name': os.environ['GITHUB_EVENT_NAME'],
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'manifest_sha256': hashlib.sha256(manifest_raw).hexdigest(),
              'snapshot_source_digest': manifest['source_digest'],
              'qualification': 'NATIVE_EXACT_CHECKOUT_CONTRACT_NOT_GOVERNED_ADMISSION',
              'accepted_causal_root_closures': None,
              'merge_authorized': False,
              'security_waiver': False,
              'crew_dispatch': 'STAGED_NOT_LAUNCHED',
              'qps_owner_decision': 'DEFER',
          }
          (out / 'native_workflow_receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          )
          PYRECEIPT
      - name: Upload diagnostic artifact only, no Pages publish or source mutation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: disjoint-census-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: mission-control/federation-atlas/live-census/out/
          if-no-files-found: error
  native-readonly-census:
    name: Fresh GitHub GET and source-bound graph artifact
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    outputs:
      census_disposition: ${{ steps.refresh.outputs.census }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Refresh read-only census (native source, no merge admission)
        id: refresh
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CROSS_REPO_READ_TOKEN: ${{ secrets.CROSS_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          cd mission-control/federation-atlas/live-census
          # Repo-scoped GITHUB_TOKEN cannot read sibling private repos (every GET 404s).
          # Without the owner-installed cross-repo credential, defer with zero requests.
          python source/live_census.py --refresh --require-cross-repo-token --out out
          if [ ! -f out/snapshot.json ]; then
            echo "census=DEFERRED_NO_CROSS_REPO_READ_TOKEN" >> "$GITHUB_OUTPUT"
            echo "::warning::CROSS_REPO_READ_TOKEN not configured; live census DEFERRED, nothing credited"
            {
              echo "### CODE PURPLE live census: DEFERRED_NO_CROSS_REPO_READ_TOKEN"
              echo "No cross-repo read credential installed. 0 requests made; no snapshot, no green credited."
              echo "Owner action: install a read-only \`CROSS_REPO_READ_TOKEN\` secret (contents:read, actions:read, pull_requests:read on the federation repos)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python source/live_census.py --verify out
          python - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path('out/snapshot.json').read_text())
          if source['authority']['merge_authorized'] or source['authority']['security_waiver']:
              raise SystemExit('unauthorized promotion')
          if source['authority']['root_closures_verified'] is not None:
              raise SystemExit('fabricated root closure')
          PY
          echo "census=NATIVE_READ" >> "$GITHUB_OUTPUT"
      - name: Upload fresh native read-only GET snapshot, NOT accepted REX
        if: ${{ steps.refresh.outputs.census == 'NATIVE_READ' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: disjoint-census-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: mission-control/federation-atlas/live-census/out/
          if-no-files-found: error

      - name: Preserve typed credential-deferral receipt
        if: ${{ steps.refresh.outputs.census == 'DEFERRED_NO_CROSS_REPO_READ_TOKEN' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: disjoint-census-deferred-${{ github.run_id }}-${{ github.run_attempt }}
          path: mission-control/federation-atlas/live-census/out/access_diagnostic.json
          if-no-files-found: error

      - name: Preserve native cross-repo source-access diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: disjoint-census-access-${{ github.run_id }}-${{ github.run_attempt }}
          path: mission-control/federation-atlas/live-census/out/access_diagnostic.json
          if-no-files-found: warn

  qualified-native-five-repo-proof:
    name: Authenticated five-repo readback qualification (never a deferred green)
    needs: [native-readonly-census]
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && needs.native-readonly-census.outputs.census_disposition == 'NATIVE_READ' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout immutable workflow source only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Download same-run native snapshot, never a deferred receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: disjoint-census-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: mission-control/federation-atlas/live-census/qualified-input
      - name: Verify five source identities, exact master and member digests
        shell: bash
        env:
          EXPECTED_SOURCE_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_HEAD"
          cd mission-control/federation-atlas/live-census
          python source/live_census.py --verify qualified-input
          mkdir -p qualified-output
          python source/native_qualify.py --directory qualified-input \
            --expected-master "$EXPECTED_SOURCE_HEAD" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --output qualified-output/qualification.json
      - name: Publish narrowly scoped qualified readback receipt only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: five-repo-native-qualified-${{ github.run_id }}-${{ github.run_attempt }}
          path: mission-control/federation-atlas/live-census/qualified-output/qualification.json
          if-no-files-found: error
