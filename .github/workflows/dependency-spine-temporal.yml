name: Mission Control Dependency SPINE N+1 Temporal Consumer
on:
  pull_request:
    paths:
      - 'mission-control/gogreen/dependency_spine_temporal.py'
      - 'mission-control/gogreen/tests/test_dependency_spine_temporal.py'
      - '.github/workflows/dependency-spine-temporal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  temporal-projection:
    name: N-1 N N+1 stage-only native proof
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Exact checkout and temporal negative tests
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python -m unittest discover -s mission-control/gogreen/tests -p 'test_dependency_spine_temporal.py' -v
      - name: Produce truthful no-input DEFER temporal projection
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python mission-control/gogreen/dependency_spine_temporal.py \
            --root . --expected-head "$EXPECTED_HEAD" \
            --out "$RUNNER_TEMP/dep-temporal"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: hub-dependency-spine-temporal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dep-temporal/
          if-no-files-found: warn
          retention-days: 30
