name: GM-I-C P0005 Pinned Browser Mermaid Render QA

on:
  pull_request:
    paths:
      - 'mission-control/grand-missions/diagrams/GM_I_C_R2_*_P0005.mmd'
      - 'mission-control/grand-missions/verify_p0005_mermaid_browser.py'
      - '.github/workflows/gm-i-c-p0005-browser-render.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-render-exact-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Assert exact source identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Setup Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Retrieve pinned, separately owned browser method from PR 1175
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/docs/method-foldback-20261110
          test "$(git rev-parse FETCH_HEAD)" = '468d80196fbeaaaaaf3fe9a72956e871eb03bc43'
          git show FETCH_HEAD:tools/workstation/build_mermaid_check.py > "$RUNNER_TEMP/pinned_mermaid_check.py"
          test -s "$RUNNER_TEMP/pinned_mermaid_check.py"
      - name: Generate render-check page for three source diagrams
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/pinned_mermaid_check.py" \
            mission-control/grand-missions/diagrams/GM_I_C_R2_EXECUTION_LANES_P0005.mmd \
            mission-control/grand-missions/diagrams/GM_I_C_R2_PROMOTION_DEPENDENCIES_P0005.mmd \
            mission-control/grand-missions/diagrams/GM_I_C_R2_SIPOC_P0005.mmd \
            --mermaid 11.4.1 --strict -o "$RUNNER_TEMP/p0005_render_check.html"
      - name: Install pinned browser tester
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install chromium
      - name: Verify actual browser Mermaid render, capture image and JSON evidence
        shell: bash
        run: |
          python mission-control/grand-missions/verify_p0005_mermaid_browser.py \
            --html "$RUNNER_TEMP/p0005_render_check.html" \
            --source-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --receipt "$RUNNER_TEMP/p0005_mermaid_receipt.json" \
            --screenshot "$RUNNER_TEMP/p0005_mermaid_browser.png"
      - name: Upload bounded QA receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p0005-browser-render-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/p0005_render_check.html
            ${{ runner.temp }}/p0005_mermaid_receipt.json
            ${{ runner.temp }}/p0005_mermaid_browser.png