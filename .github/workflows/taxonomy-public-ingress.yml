name: Taxonomy Public Census Ingress (read-only)
on:
  pull_request:
    paths:
      - mission-control/issue_rank/taxonomy_public_ingress.py
      - mission-control/issue_rank/test_taxonomy_public_ingress.py
      - .github/workflows/taxonomy-public-ingress.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: taxonomy-public-ingress-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  ingress-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    name: public-ingress negatives (py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact source head
        env:
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$HEAD"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run negative source admission checks
        working-directory: mission-control/issue_rank
        run: python -m unittest -v test_taxonomy_public_ingress
