name: Issue burndown ranking (read-only contract tests)
on:
  pull_request:
    paths:
      - 'mission-control/issue_rank/**'
      - '.github/workflows/issue-rank.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: issue-rank-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  test:
    name: issue_rank contract tests (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checkout
        env:
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          echo "ISSUE_RANK_SOURCE_HEAD=$HEAD"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests with coverage
        working-directory: mission-control/issue_rank
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check coverage==7.13.3
          python -m coverage run --include=issue_rank.py -m unittest -v test_issue_rank test_title_taxonomy
          python -m coverage report --fail-under=80
