name: CBD Subtype Worker Orchestrator

on:
  pull_request:
    paths:
      - "mission-control/gogreen/subtype_orchestrator.py"
      - "mission-control/gogreen/tests/test_subtype_orchestrator.py"
      - "mission-control/gogreen/samples/cbd_abacus_20261016.json"
      - "mission-control/gogreen/rerun_triage.py"
      - "mission-control/gogreen/tests/test_rerun_triage.py"
      - "mission-control/gogreen/samples/cbd_rerun_20261016.json"
      - "mission-control/gogreen/sipoc_instances.py"
      - "mission-control/gogreen/tests/test_sipoc_instances.py"
      - "mission-control/gogreen/samples/sipoc_instance_wave_20261016.json"
      - "mission-control/gogreen/SIPOC_INSTANCE_DAG.md"
      - ".github/workflows/gogreen-subtype-workers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  subtype-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact PR source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Native subtype branch-aware regression coverage
        run: |
          python -m pip install coverage==7.16.2
          python -m coverage run --branch --source=mission-control/gogreen -m unittest discover -s mission-control/gogreen/tests -p test_subtype_orchestrator.py -v
      - name: Exact-head rerun and SIPOC instance regression Testflight
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest mission-control/gogreen/tests/test_rerun_triage.py -v
          python -m unittest mission-control/gogreen/tests/test_sipoc_instances.py -v
          python mission-control/gogreen/rerun_triage.py \
            --input mission-control/gogreen/samples/cbd_rerun_20261016.json \
            --out "$RUNNER_TEMP/cbd-rerun"
          python mission-control/gogreen/sipoc_instances.py \
            --input mission-control/gogreen/samples/sipoc_instance_wave_20261016.json \
            --atlas mission-control/federation-atlas/PROCESS_LANES_v1.json \
            --out "$RUNNER_TEMP/cbd-sipoc" --synthetic-replay
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          rerun = json.loads((root/"cbd-rerun/rerun_receipt.json").read_text())
          sipoc_raw = (root/"cbd-sipoc/sipoc_instance_receipt.json").read_bytes()
          sipoc = json.loads(sipoc_raw)
          synthetic = json.loads((root/"cbd-sipoc/asyncio_synthetic_only.json").read_text())
          digest = (root/"cbd-sipoc/sipoc_instance_receipt.sha256").read_text().strip()
          atlas = Path("mission-control/federation-atlas/PROCESS_LANES_v1.json")
          assert hashlib.sha256(sipoc_raw).hexdigest() == digest
          assert hashlib.sha256(atlas.read_bytes()).hexdigest() == sipoc["canonical_atlas_sha256"]
          assert rerun["kpi"]["prs"] == 9
          assert rerun["kpi"]["retries_recommended"] == 0
          assert rerun["dispatch_authorized"] is False
          assert rerun["merge_authorized"] is False
          assert sipoc["kpi"]["instances_declared"] == 8
          assert sipoc["kpi"]["incarnations_by_role"]["P"] == 4
          assert sipoc["kpi"]["waves_planned"] == 5
          assert sipoc["kpi"]["actual_worker_runs"] is None
          assert sipoc["dispatch_authorized"] is False
          assert sipoc["merge_authorized"] is False
          assert synthetic["result"] == "SYNTHETIC_ONLY_PASS"
          assert synthetic["native_proof"] is False
          print("SIPOC AND RERUN EXACT-SHA TESTFLIGHT: PASS")
          PY
      - name: Emit source-bound subtype receipt
        run: |
          python mission-control/gogreen/subtype_orchestrator.py \
            --input mission-control/gogreen/samples/cbd_abacus_20261016.json \
            --out "$RUNNER_TEMP/cbd-subtype"
          python -m coverage json -o "$RUNNER_TEMP/cbd-subtype/coverage.json"
          cat "$RUNNER_TEMP/cbd-subtype/subtype_receipt.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate authority and KPI boundaries
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "cbd-subtype" / "subtype_receipt.json"
          d = json.loads(p.read_text())
          assert d["dispatch_authorized"] is False
          assert d["merge_authorized"] is False
          assert d["security_waiver"] is False
          assert d["kpi"]["independently_accepted_root_closures"] == 0
          assert d["kpi"]["packets_total"] == 18
          assert d["kpi"]["ready_now"] == 7
          assert d["kpi"]["blocked"] == 3
          assert d["kpi"]["proof_pending"] == 8
          assert d["schedule"]["waves_planned"] == 3
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cbd-subtype-receipt-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/cbd-subtype/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cbd-rerun-triage-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/cbd-rerun/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cbd-sipoc-instance-dag-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/cbd-sipoc/
          if-no-files-found: error
