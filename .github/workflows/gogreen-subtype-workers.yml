name: CBD Subtype Worker Orchestrator

on:
  pull_request:
    paths:
      - "mission-control/gogreen/subtype_orchestrator.py"
      - "mission-control/gogreen/tests/test_subtype_orchestrator.py"
      - "mission-control/gogreen/samples/cbd_abacus_20261016.json"
      - "mission-control/gogreen/rerun_triage.py"
      - "mission-control/gogreen/tests/test_rerun_triage.py"
      - "mission-control/gogreen/samples/cbd_rerun_20261016.json"
      - "mission-control/gogreen/sipoc_instances.py"
      - "mission-control/gogreen/tests/test_sipoc_instances.py"
      - "mission-control/gogreen/samples/sipoc_instance_wave_20261016.json"
      - "mission-control/gogreen/SIPOC_INSTANCE_DAG.md"
      - "mission-control/gogreen/bd_queue_wave.py"
      - "mission-control/gogreen/tests/test_bd_queue_wave.py"
      - "mission-control/gogreen/BD_QUEUE_WAVE.md"
      - "mission-control/gogreen/qbd_contract.py"
      - "mission-control/gogreen/tests/test_qbd_contract.py"
      - "mission-control/gogreen/QBD_W49_PUBLIC_DISJOINT_COHORT_20261019.json"
      - "mission-control/gogreen/QBD_W49_PUBLIC_83_ISSUE_REVIEW_20261019.json"
      - "mission-control/gogreen/QBD_W49_PUBLIC_EXECUTION_SPINE.mmd"
      - "mission-control/golden-thread/dependency_recompute.py"
      - "mission-control/golden-thread/fixtures/GT_BD_002_REAL_CONE_BATCH001_v1.json"
      - "mission-control/golden-thread/fixtures/GT_BD_011_BOOTSTRAP_BATCH001_20260917.json"
      - ".github/workflows/gogreen-subtype-workers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  subtype-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact PR source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Native subtype branch-aware regression coverage
        run: |
          python -m pip install coverage==7.16.2
          python -m coverage run --branch --source=mission-control/gogreen -m unittest discover -s mission-control/gogreen/tests -p test_subtype_orchestrator.py -v
      - name: Exact-head rerun and SIPOC instance regression Testflight
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest mission-control/gogreen/tests/test_rerun_triage.py -v
          python -m unittest mission-control/gogreen/tests/test_sipoc_instances.py -v
          python mission-control/gogreen/rerun_triage.py \
            --input mission-control/gogreen/samples/cbd_rerun_20261016.json \
            --out "$RUNNER_TEMP/cbd-rerun"
          python mission-control/gogreen/sipoc_instances.py \
            --input mission-control/gogreen/samples/sipoc_instance_wave_20261016.json \
            --atlas mission-control/federation-atlas/PROCESS_LANES_v1.json \
            --out "$RUNNER_TEMP/cbd-sipoc" --synthetic-replay
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          rerun = json.loads((root/"cbd-rerun/rerun_receipt.json").read_text())
          sipoc_raw = (root/"cbd-sipoc/sipoc_instance_receipt.json").read_bytes()
          sipoc = json.loads(sipoc_raw)
          synthetic = json.loads((root/"cbd-sipoc/asyncio_synthetic_only.json").read_text())
          digest = (root/"cbd-sipoc/sipoc_instance_receipt.sha256").read_text().strip()
          atlas = Path("mission-control/federation-atlas/PROCESS_LANES_v1.json")
          assert hashlib.sha256(sipoc_raw).hexdigest() == digest
          assert hashlib.sha256(atlas.read_bytes()).hexdigest() == sipoc["canonical_atlas_sha256"]
          assert rerun["kpi"]["prs"] == 9
          assert rerun["kpi"]["retries_recommended"] == 0
          assert rerun["dispatch_authorized"] is False
          assert rerun["merge_authorized"] is False
          assert sipoc["kpi"]["instances_declared"] == 8
          assert sipoc["kpi"]["incarnations_by_role"]["P"] == 4
          assert sipoc["kpi"]["waves_planned"] == 5
          assert sipoc["kpi"]["actual_worker_runs"] is None
          assert sipoc["dispatch_authorized"] is False
          assert sipoc["merge_authorized"] is False
          assert synthetic["result"] == "SYNTHETIC_ONLY_PASS"
          assert synthetic["native_proof"] is False
          print("SIPOC AND RERUN EXACT-SHA TESTFLIGHT: PASS")
          PY
      - name: Execute real Golden Thread dependency cone (source-bound)
        env:
          EVALUATED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, importlib.util, json, os
          from pathlib import Path
          root=Path.cwd()
          script=root/'mission-control/golden-thread/dependency_recompute.py'
          source=root/'mission-control/golden-thread/fixtures/GT_BD_002_REAL_CONE_BATCH001_v1.json'
          raw=source.read_bytes(); manifest=json.loads(raw)
          spec=importlib.util.spec_from_file_location('real_cone',script)
          engine=importlib.util.module_from_spec(spec); spec.loader.exec_module(engine)
          out=Path(os.environ['RUNNER_TEMP'])/'cbd-realcone'
          result=engine.execute_cone(manifest,out)
          closure=result['closure']; expected=manifest['expected']
          assert closure['status']==expected['status']=='PASS'
          assert closure['stale_survivor_count']==closure['stale_rendition_count']==0
          assert result['summary']['occurrence_count']==4 and result['summary']['repository_count']==4
          assert result['authority_transfer'] is False
          files={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(out.glob('*.json'))}
          receipt={'schema':'codepurple.real-task-run.v1','source_sha':os.environ['EVALUATED_SHA'],
           'workflow_run_id':os.environ['RUN_ID'],'attempt':os.environ['RUN_ATTEMPT'],
           'operation':'GOLDEN_THREAD_REAL_DEPENDENCY_RECOMPUTE','synthetic':False,
           'input_sha256':hashlib.sha256(raw).hexdigest(),'files':files,
           'occurrences':result['summary']['occurrence_count'],'repositories':result['summary']['repository_count'],
           'native_execution':True,'dispatch_authorized':False,'merge_authorized':False,
           'engineering_root_closures':0}
          encoded=(json.dumps(receipt,sort_keys=True,indent=2)+'\n').encode()
          (out/'real_task_receipt.json').write_bytes(encoded)
          (out/'real_task_receipt.sha256').write_text(hashlib.sha256(encoded).hexdigest()+'\n')
          print(json.dumps({'status':'ACTUAL_EXECUTION_PASS','files':sorted(files),
           'observed_occurrences':receipt['occurrences'],'exact_sha':receipt['source_sha']},sort_keys=True))
          PY
      - name: QBD public-safe structural and negative TestFlight
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s mission-control/gogreen/tests -p 'test_qbd_contract.py' -v
          python mission-control/gogreen/qbd_contract.py \
            --input mission-control/gogreen/QBD_W49_PUBLIC_DISJOINT_COHORT_20261019.json \
            --issue-review mission-control/gogreen/QBD_W49_PUBLIC_83_ISSUE_REVIEW_20261019.json
      - name: Branch-aware BD census regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python -m coverage run --branch \
            --include='*/mission-control/gogreen/bd_queue_wave.py' \
            -m unittest discover -s mission-control/gogreen/tests \
            -p 'test_bd_queue_wave.py' -v
          python -m coverage report --fail-under=95
      - name: Execute live cross-repository BD census
        shell: bash
        timeout-minutes: 12
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python mission-control/gogreen/bd_queue_wave.py \
            --out "$RUNNER_TEMP/cbd-live-bd" --max-parallel 4
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "cbd-live-bd"
          summary = json.loads((p / "bd_summary.json").read_text())
          if summary["open_prs"] == 0 or summary["prs_unknown"] == summary["open_prs"]:
              raise SystemExit("all PR-head evidence unobserved: HOLD")
          if len(summary["issues"]) != 4 or summary["authority_transfer"] is not False:
              raise SystemExit("federation issue completeness/authority violation")
          if summary["root_closure_delta"] != 0 or summary["merge_authorized"] is not False:
              raise SystemExit("admission boundary violated")
          receipt = {
              "schema": "codepurple.bd-native-execution.v1",
              "source_sha": os.environ["SOURCE_HEAD_SHA"],
              "run_id": os.environ["SOURCE_RUN_ID"],
              "run_attempt": os.environ["SOURCE_RUN_ATTEMPT"],
              "pr_denominator": summary["open_prs"],
              "issue_denominator": summary["open_issues"],
              "observed_run_pr_count": summary["open_prs"] - summary["prs_unknown"],
              "failed_workflow_manifestations": summary["manifestations"],
              "summary_sha256": hashlib.sha256((p / "bd_summary.json").read_bytes()).hexdigest(),
              "actual_github_api_execution": True,
              "causal_root_count": None,
              "accepted_root_closures": 0,
              "merge_authorized": False
          }
          (p / "native_execution_receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          print("ACTUAL_BD_CENSUS", json.dumps(receipt, sort_keys=True))
          PY
      - name: Emit source-bound subtype receipt
        run: |
          python mission-control/gogreen/subtype_orchestrator.py \
            --input mission-control/gogreen/samples/cbd_abacus_20261016.json \
            --out "$RUNNER_TEMP/cbd-subtype"
          python -m coverage json -o "$RUNNER_TEMP/cbd-subtype/coverage.json"
          cat "$RUNNER_TEMP/cbd-subtype/subtype_receipt.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate authority and KPI boundaries
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "cbd-subtype" / "subtype_receipt.json"
          d = json.loads(p.read_text())
          assert d["dispatch_authorized"] is False
          assert d["merge_authorized"] is False
          assert d["security_waiver"] is False
          assert d["kpi"]["independently_accepted_root_closures"] == 0
          assert d["kpi"]["packets_total"] == 18
          assert d["kpi"]["ready_now"] == 7
          assert d["kpi"]["blocked"] == 3
          assert d["kpi"]["proof_pending"] == 8
          assert d["schedule"]["waves_planned"] == 3
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cbd-subtype-receipt-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/cbd-subtype/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cbd-rerun-triage-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/cbd-rerun/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cbd-sipoc-instance-dag-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/cbd-sipoc/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cbd-real-cone-execution-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/cbd-realcone/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: code-purple-bd-live-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/cbd-live-bd/
          if-no-files-found: error
