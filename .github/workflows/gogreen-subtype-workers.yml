name: CBD Subtype Worker Orchestrator

on:
  pull_request:
    paths:
      - "mission-control/gogreen/subtype_orchestrator.py"
      - "mission-control/gogreen/tests/test_subtype_orchestrator.py"
      - "mission-control/gogreen/samples/cbd_abacus_20261016.json"
      - "mission-control/gogreen/rerun_triage.py"
      - "mission-control/gogreen/sipoc_instances.py"
      - "mission-control/gogreen/tests/test_sipoc_instances.py"
      - "mission-control/gogreen/samples/sipoc_instance_wave_20261016.json"
      - "mission-control/gogreen/SIPOC_INSTANCE_DAG.md"
      - "mission-control/gogreen/tests/test_rerun_triage.py"
      - "mission-control/gogreen/samples/cbd_rerun_20261016.json"
      - ".github/workflows/gogreen-subtype-workers.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  EVALUATED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  subtype-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact evaluated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact evaluated checkout before tests
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EVALUATED_SOURCE_SHA"
          echo "source_sha=$actual"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run subtype planner tests
        run: python -m unittest mission-control/gogreen/tests/test_subtype_orchestrator.py -v
      - name: Negative rerun controls and scope-bound coverage
        run: |
          python -m pip install coverage==7.13.3
          mkdir -p "$RUNNER_TEMP/cbd-rerun"
          python -m coverage run --branch --include="*/mission-control/gogreen/rerun_triage.py" \
            -m unittest mission-control/gogreen/tests/test_rerun_triage.py -v
          python -m coverage json --pretty-print -o "$RUNNER_TEMP/cbd-rerun/coverage.json"
          python mission-control/gogreen/rerun_triage.py \
            --input mission-control/gogreen/samples/cbd_rerun_20261016.json \
            --out "$RUNNER_TEMP/cbd-rerun"
          python - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ["RUNNER_TEMP"]) / "cbd-rerun"
          report = json.loads((out / "coverage.json").read_text())
          selected = [(k,v) for k,v in report["files"].items()
                      if k.endswith("mission-control/gogreen/rerun_triage.py")]
          assert len(selected) == 1, "focused module population missing"
          stats = selected[0][1]["summary"]
          assert stats["num_statements"] > 0 and stats["covered_lines"] > 0
          receipt = json.loads((out / "rerun_receipt.json").read_text())
          assert receipt["kpi"]["prs"] == 9
          assert receipt["kpi"]["older_than_24h"] == 8
          assert receipt["kpi"]["behind_main"] == 8
          assert receipt["kpi"]["retries_recommended"] == 0
          assert receipt["independent_root_closures"] == 0
          assert receipt["dispatch_authorized"] is False
          assert receipt["merge_authorized"] is False
          line_num, line_den = stats["covered_lines"], stats["num_statements"]
          branch_num, branch_den = stats["covered_branches"], stats["num_branches"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fp:
              fp.write(f"CBD rerun triage: {receipt['kpi']['prs']} PRs; "
                       f"{receipt['kpi']['older_than_24h']} older than 24h; "
                       f"{receipt['kpi']['behind_main']} behind main; "
                       "0 automatic reruns.\\n")
              fp.write(f"Focused source line coverage: {line_num}/{line_den}; "
                       f"branch coverage: {branch_num}/{branch_den}.\\n")
          PY
      - name: SIPOC DAG negative tests and bounded asyncio simulation
        run: |
          set -euo pipefail
          python -m unittest mission-control/gogreen/tests/test_sipoc_instances.py -v
          python mission-control/gogreen/sipoc_instances.py \
            --input mission-control/gogreen/samples/sipoc_instance_wave_20261016.json \
            --atlas mission-control/federation-atlas/PROCESS_LANES_v1.json \
            --out "$RUNNER_TEMP/cbd-sipoc" --synthetic-replay
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          out = Path(os.environ["RUNNER_TEMP"]) / "cbd-sipoc"
          raw = (out / "sipoc_instance_receipt.json").read_bytes()
          r = json.loads(raw)
          replay = json.loads((out / "asyncio_synthetic_only.json").read_text())
          recorded = (out / "sipoc_instance_receipt.sha256").read_text().strip()
          assert hashlib.sha256(raw).hexdigest() == recorded
          atlas_bytes = Path("mission-control/federation-atlas/PROCESS_LANES_v1.json").read_bytes()
          assert r["canonical_atlas_sha256"] == hashlib.sha256(atlas_bytes).hexdigest()
          assert r["kpi"]["instances_declared"] == 8
          assert r["kpi"]["incarnations_by_role"]["P"] == 4
          assert r["kpi"]["scheduled_proposals"] == 7
          assert r["kpi"]["held_or_blocked"] == 1
          assert r["kpi"]["asyncio_proposals"] == 4
          assert r["kpi"]["waves_planned"] == 5
          assert r["kpi"]["actual_worker_runs"] is None
          assert r["dispatch_authorized"] is False
          assert r["merge_authorized"] is False
          assert replay["synthetic"] is True
          assert replay["native_proof"] is False
          assert replay["result"] == "SYNTHETIC_ONLY_PASS"
          print("SIPOC Testflight PASS_LOCAL_PLAN_ONLY")
          PY
      - name: Emit source-bound subtype receipt
        run: |
          python mission-control/gogreen/subtype_orchestrator.py \
            --input mission-control/gogreen/samples/cbd_abacus_20261016.json \
            --out "$RUNNER_TEMP/cbd-subtype"
          cat "$RUNNER_TEMP/cbd-subtype/subtype_receipt.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate authority and KPI boundaries
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "cbd-subtype" / "subtype_receipt.json"
          d = json.loads(p.read_text())
          assert d["dispatch_authorized"] is False
          assert d["merge_authorized"] is False
          assert d["security_waiver"] is False
          assert d["kpi"]["independently_accepted_root_closures"] == 0
          assert d["kpi"]["packets_total"] == 18
          assert d["kpi"]["ready_now"] == 7
          assert d["kpi"]["blocked"] == 3
          assert d["kpi"]["proof_pending"] == 8
          assert d["schedule"]["waves_planned"] == 3
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cbd-subtype-receipt-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/cbd-subtype/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: cbd-rerun-triage-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/cbd-rerun/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: cbd-sipoc-instance-dag-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/cbd-sipoc/
          if-no-files-found: error
