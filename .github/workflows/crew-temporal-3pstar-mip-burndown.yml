name: MissionControl Temporal 3PSTAR MIP Burndown

on:
  pull_request:
    branches: [master]
    paths:
      - 'mission-control/qps-triage-ultra/crew/measured/frontier/temporal/temporal_frontier_burndown.py'
      - 'mission-control/qps-triage-ultra/crew/measured/frontier/temporal/test_temporal_frontier_burndown.py'
      - 'mission-control/qps-triage-ultra/crew/measured/frontier/temporal/TEMPORAL_3PSTAR_MIP_ITERATION_v1.json'
      - 'mission-control/qps-triage-ultra/crew/measured/frontier/temporal/TEMPORAL_3PSTAR_MIP_ITERATION_v2.json'
      - 'mission-control/qps-triage-ultra/crew/measured/frontier/temporal/TEMPORAL_3PSTAR_MIP_ITERATION_v3.json'
      - 'mission-control/qps-triage-ultra/crew/measured/frontier/temporal/TEMPORAL_FRONTIER_CURRENT_v1.json'
      - 'mission-control/qps-triage-ultra/crew/measured/frontier/temporal/TEMPORAL_SHORT_COMPUTE_REEARN_GATE_v1.json'
      - 'mission-control/qps-triage-ultra/crew/measured/frontier/temporal/handover/**'
      - '.github/workflows/crew-temporal-3pstar-mip-burndown.yml'
  push:
    branches: [master]
    paths:
      - 'mission-control/qps-triage-ultra/crew/measured/frontier/temporal/temporal_frontier_burndown.py'
      - 'mission-control/qps-triage-ultra/crew/measured/frontier/temporal/test_temporal_frontier_burndown.py'
      - 'mission-control/qps-triage-ultra/crew/measured/frontier/temporal/TEMPORAL_3PSTAR_MIP_ITERATION_v1.json'
      - 'mission-control/qps-triage-ultra/crew/measured/frontier/temporal/TEMPORAL_3PSTAR_MIP_ITERATION_v2.json'
      - 'mission-control/qps-triage-ultra/crew/measured/frontier/temporal/TEMPORAL_3PSTAR_MIP_ITERATION_v3.json'
      - 'mission-control/qps-triage-ultra/crew/measured/frontier/temporal/TEMPORAL_FRONTIER_CURRENT_v1.json'
      - 'mission-control/qps-triage-ultra/crew/measured/frontier/temporal/TEMPORAL_SHORT_COMPUTE_REEARN_GATE_v1.json'
      - 'mission-control/qps-triage-ultra/crew/measured/frontier/temporal/handover/**'
      - '.github/workflows/crew-temporal-3pstar-mip-burndown.yml'
  workflow_run:
    workflows: ['MissionControl Temporal Allocation Policy']
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  unit-contract:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source head
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
      - name: Run burndown unit contract
        working-directory: mission-control/qps-triage-ultra/crew/measured/frontier/temporal
        run: python -m unittest -v test_temporal_frontier_burndown.py
      - name: Validate lossless 3PSTAR MIP control chain
        shell: python
        run: |
          import json
          from pathlib import Path
          root=Path('mission-control/qps-triage-ultra/crew/measured/frontier/temporal')
          v3=json.loads((root/'TEMPORAL_3PSTAR_MIP_ITERATION_v3.json').read_text())
          cur=json.loads((root/'TEMPORAL_FRONTIER_CURRENT_v1.json').read_text())
          assert v3['schema']=='missioncontrol.temporal_3pstar_mip_iteration.v3'
          gate=json.loads((root/'TEMPORAL_SHORT_COMPUTE_REEARN_GATE_v1.json').read_text())
          assert v3['control_state']['control_class_count']==2
          assert v3['control_state']['full_control'] is False
          assert v3['three_p_star']['prove']['implementation_pr_head']['status']=='PASS_LATE_AFTER_MERGE'
          assert v3['rex']['id']=='REX-005'
          assert v3['rex']['repair_pr']==252
          assert v3['rex']['repair_merge']=='243337e7170029ccfbcf1588ce951356fd1d22a7'
          assert v3['active_frontier'][0]['task_class']=='short_compute'
          assert v3['active_frontier'][0]['regression_from_control'] is True
          assert v3['active_frontier'][0]['first_red']=='pooled_winner_strength'
          assert v3['active_frontier'][1]['task_class']=='long_compute_contended'
          assert v3['active_frontier'][2]['task_class']=='human_dependency_wait_proxy'
          assert v3['invariants']['thresholds_changed'] is False
          assert v3['invariants']['synthetic_or_manual_clock_credit'] is False
          assert v3['invariants']['competency_promotions']==0
          assert v3['invariants']['authority_transfer'] is False
          assert cur['schema']=='missioncontrol.temporal_frontier_current.v1'
          assert cur['refresh_first'] is True
          assert cur['state']=='CONTROL_REGRESSION_ACTIVE_2_OF_5_CONTROL_THREE_CLASS_FRONTIER'
          assert cur['control_classes']==['cache_artifact_reuse','validation_bundle']
          assert cur['regressed_classes']==['short_compute']
          assert cur['current_genuine_schedule']['run_id']=='35350275999'
          assert cur['proof_chain']['postmerge_recurrence']['run_id']=='35352260069'
          assert cur['proof_chain']['postmerge_recurrence']['job_id']=='105622958891'
          assert gate['schema']=='missioncontrol.temporal_short_compute_reearn_gate.v1'
          assert gate['status']=='WAIT_NEXT_GENUINE_SCHEDULE'
          assert gate['eligible_evidence']['event']=='schedule'
          assert gate['frozen_control_gate']['min_pooled_winner_strength']==0.7
          assert gate['invariants']['thresholds_changed'] is False
          assert gate['invariants']['synthetic_or_manual_clock_credit'] is False
          for rel in (
              'handover/SC_2026-09-18_TEMPORAL_3PSTAR_MIP_LOSSLESS_HANDOVER_v1.md',
              'handover/RESTART_DROPIN_2026-09-18_TEMPORAL_FRONTIER_v1.md',
          ):
              assert (root/rel).is_file(), rel
          print(json.dumps({
              'status':'PASS_TEMPORAL_3PSTAR_MIP_LOSSLESS_HANDOVER_CONTRACT',
              'control_class_count':2,
              'active_frontier_count':3,
              'regressed_classes':['short_compute'],
              'postmerge_run':'35352260069',
              'postmerge_job':'105622958891',
              'authority_transfer':False,
              'competency_promotions':0,
          },sort_keys=True))

  genuine-scheduled-burndown:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact scheduled source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Assert exact scheduled source head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}"
      - name: Download governed temporal policy artifact
        uses: actions/download-artifact@v4
        with:
          name: crew-temporal-pc3-${{ github.event.workflow_run.head_sha }}
          path: mission-control/qps-triage-ultra/crew/measured/frontier/temporal/trigger-artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Build governed 3PSTAR MIP burndown
        run: >-
          python mission-control/qps-triage-ultra/crew/measured/frontier/temporal/temporal_frontier_burndown.py
          --policy mission-control/qps-triage-ultra/crew/measured/frontier/temporal/trigger-artifact/TEMPORAL_ALLOCATION_POLICY_RECEIPT.json
          --config mission-control/qps-triage-ultra/crew/measured/frontier/temporal/TEMPORAL_POLICY_CONFIG_v1.json
          --out mission-control/qps-triage-ultra/crew/measured/frontier/temporal/TEMPORAL_3PSTAR_MIP_BURNDOWN.json
      - name: Enforce non-compensating governance
        shell: python
        run: |
          import json
          from pathlib import Path
          p=Path('mission-control/qps-triage-ultra/crew/measured/frontier/temporal/TEMPORAL_3PSTAR_MIP_BURNDOWN.json')
          d=json.loads(p.read_text())
          assert d['invariants']['thresholds_changed'] is False
          assert d['invariants']['synthetic_or_manual_clock_credit'] is False
          assert d['invariants']['competency_promotions']==0
          assert d['invariants']['authority_transfer'] is False
          ranks=[row['priority_rank'] for row in d['active_frontier']]
          assert ranks==list(range(1,len(ranks)+1))
          for row in d['active_frontier']:
              assert row['first_red_gate'] is not None
              if row['task_class']=='human_dependency_wait_proxy':
                  assert row['claim_boundary']=='CONTROLLED_WAIT_PROXY_ONLY_NOT_REAL_HUMAN_INTERVENTION_EVIDENCE'
          print(json.dumps({
              'status':'PASS_TEMPORAL_3PSTAR_MIP_BURNDOWN_DOV',
              'control_class_count':d['control_class_count'],
              'active_frontier_count':len(d['active_frontier']),
              'frontier':[{
                  'priority':r['priority_rank'],
                  'task_class':r['task_class'],
                  'first_red':r['first_red_gate'],
                  'regime':r['regime_classification'],
                  'min_clean_windows':r['min_consecutive_clean_dominant_windows_to_consistency'],
              } for r in d['active_frontier']],
              'competency_promotions':0,
              'authority_transfer':False,
          },sort_keys=True))
      - name: Upload governed temporal burndown
        uses: actions/upload-artifact@v4
        with:
          name: temporal-3pstar-mip-burndown-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.head_sha }}
          path: mission-control/qps-triage-ultra/crew/measured/frontier/temporal/TEMPORAL_3PSTAR_MIP_BURNDOWN.json
