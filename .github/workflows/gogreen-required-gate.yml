name: GOGREEN Required Gate

# One always-reporting check that stands in for the path-filtered PR gates.
# N+9: which gates it ENFORCES comes from the admission ledger
# (mission-control/gogreen/required_gate/ADMISSION.json) as committed on the BASE branch,
# so a PR cannot demote the gates that judge it; until the ledger exists on the base the
# bootstrap is the N+8 pair (CODE PURPLE Method Atlas, CODE PURPLE Live Lossless QA).
# NOT_APPLICABLE when a gate's own trigger would not fire for this PR; otherwise passes only
# when it succeeds on the exact PR head. OBSERVED gates are annotated, never blocking.
# Making this single check required on master is the owner's protection decision.
on:
  pull_request:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: gogreen-required-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: GOGREEN required gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5.1.0 (node24)
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Gate tests
        run: |
          python -m pip install --disable-pip-version-check pyyaml==6.0.3
          python -m unittest discover -s mission-control/gogreen/required_gate -p 'test_*.py' -v
      - name: Aggregate path-filtered gates on exact head
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python mission-control/gogreen/required_gate/gate.py \
            --pr "${{ github.event.pull_request.number }}" \
            --sha "${{ github.event.pull_request.head.sha }}" \
            --base-ref "${{ github.base_ref }}" \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --root . --deadline-min 75 --out "$RUNNER_TEMP/required-gate.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v6.0.0 (node24)
        if: always()
        with:
          name: gogreen-required-gate-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/required-gate.json
          if-no-files-found: warn
          retention-days: 30
