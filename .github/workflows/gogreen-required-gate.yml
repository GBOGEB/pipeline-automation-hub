name: GOGREEN Required Gate

# One always-reporting check that stands in for path-filtered gates
# (CODE PURPLE Method Atlas, CODE PURPLE Live Lossless QA). NOT_APPLICABLE when the PR
# touches none of their paths; otherwise passes only when they succeed on the exact PR
# head. Making this single check required on master is the owner's protection decision.
on:
  pull_request:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: gogreen-required-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: GOGREEN required gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Gate tests
        run: |
          python -m pip install --disable-pip-version-check pyyaml==6.0.3
          python -m unittest discover -s mission-control/gogreen/required_gate -p 'test_*.py' -v
      - name: Aggregate path-filtered gates on exact head
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python mission-control/gogreen/required_gate/gate.py \
            --pr "${{ github.event.pull_request.number }}" \
            --sha "${{ github.event.pull_request.head.sha }}" \
            --root . --deadline-min 75 --out "$RUNNER_TEMP/required-gate.json"
