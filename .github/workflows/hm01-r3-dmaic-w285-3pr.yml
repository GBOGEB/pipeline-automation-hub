name: HM-01 R3 DMAIC W285 3PR
on:
  pull_request:
    branches: [master]
    paths:
      - "mission-control/grand-missions/R3_DMAIC_W285_3PR_REFRESH_v1.json"
      - "mission-control/grand-missions/validate_r3_dmaic_w285_3pr.py"
      - ".github/workflows/hm01-r3-dmaic-w285-3pr.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  three-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Refresh Probe Rank
        run: |
          mkdir -p output/r3-dmaic
          python mission-control/grand-missions/validate_r3_dmaic_w285_3pr.py             --receipt mission-control/grand-missions/R3_DMAIC_W285_3PR_REFRESH_v1.json             --out output/r3-dmaic/R3_DMAIC_W285_3PR_RECEIPT_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: hm01-r3-dmaic-w285-3pr
          path: output/r3-dmaic/R3_DMAIC_W285_3PR_RECEIPT_v1.json
          if-no-files-found: error
          retention-days: 30
