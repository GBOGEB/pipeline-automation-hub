name: HM-01 R3 DMAIC W285 3PR
on:
  pull_request:
    branches: [master]
    paths:
      - "mission-control/grand-missions/R3_DMAIC_W285_3PR_REFRESH_v1.json"
      - "mission-control/grand-missions/validate_r3_dmaic_w285_3pr.py"
      - ".github/workflows/hm01-r3-dmaic-w285-3pr.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  three-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source head
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
      - name: Validate Refresh Probe Rank
        run: |
          mkdir -p output/r3-dmaic
          python mission-control/grand-missions/validate_r3_dmaic_w285_3pr.py             --receipt mission-control/grand-missions/R3_DMAIC_W285_3PR_REFRESH_v1.json             --self-test             --out output/r3-dmaic/R3_DMAIC_W285_3PR_RECEIPT_v2.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hm01-r3-dmaic-w285-3pr
          path: output/r3-dmaic/R3_DMAIC_W285_3PR_RECEIPT_v2.json
          if-no-files-found: error
          retention-days: 30
