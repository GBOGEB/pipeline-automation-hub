name: GM-V 3PSTAR MIP Control

on:
  pull_request:
    branches: [master]
    paths:
      - 'mission-control/grand-missions/GM_V_3PSTAR_MIP_CONTROL_v1.json'
      - 'mission-control/grand-missions/GM_V_CURRENT_v1.json'
      - 'mission-control/grand-missions/GM_V_GOVERNOR_READINESS_CONTRACT.json'
      - 'mission-control/grand-missions/GRAND_MISSION_REGISTRY.json'
      - 'mission-control/grand-missions/validate_gm_v_3pstar_mip_control.py'
      - 'mission-control/grand-missions/handover/SC_2026-09-18_GM_V_3PSTAR_MIP_LOSSLESS_HANDOVER_v1.md'
      - 'mission-control/grand-missions/handover/RESTART_DROPIN_2026-09-18_GM_V_v1.md'
      - 'mission-control/grand-missions/handover/SC_2026-09-18_GM_V_3PSTAR_MIP_LOSSLESS_HANDOVER_v2.md'
      - 'mission-control/grand-missions/handover/RESTART_DROPIN_2026-09-18_GM_V_v2.md'
      - '.github/workflows/gm-v-3pstar-mip-control.yml'
  push:
    branches: [master]
    paths:
      - 'mission-control/grand-missions/GM_V_3PSTAR_MIP_CONTROL_v1.json'
      - 'mission-control/grand-missions/GM_V_CURRENT_v1.json'
      - 'mission-control/grand-missions/GM_V_GOVERNOR_READINESS_CONTRACT.json'
      - 'mission-control/grand-missions/GRAND_MISSION_REGISTRY.json'
      - 'mission-control/grand-missions/validate_gm_v_3pstar_mip_control.py'
      - 'mission-control/grand-missions/handover/SC_2026-09-18_GM_V_3PSTAR_MIP_LOSSLESS_HANDOVER_v1.md'
      - 'mission-control/grand-missions/handover/RESTART_DROPIN_2026-09-18_GM_V_v1.md'
      - 'mission-control/grand-missions/handover/SC_2026-09-18_GM_V_3PSTAR_MIP_LOSSLESS_HANDOVER_v2.md'
      - 'mission-control/grand-missions/handover/RESTART_DROPIN_2026-09-18_GM_V_v2.md'
      - '.github/workflows/gm-v-3pstar-mip-control.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  gm-v-3pstar-mip-control:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact head and predecessor ancestry
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          git merge-base --is-ancestor 0d3b66ee8c2566ed1e5f8b83c2932e4a9160bcbb HEAD
          git merge-base --is-ancestor 3df37a0485874f968f0dffa02bc474c5f4645fba HEAD
          echo "SOURCE_SHA=$actual" >> "$GITHUB_ENV"

      - name: Compile and run deterministic 3PSTAR MIP validator
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile mission-control/grand-missions/validate_gm_v_3pstar_mip_control.py
          python mission-control/grand-missions/validate_gm_v_3pstar_mip_control.py             --source-sha "$SOURCE_SHA"             --out /tmp/gm-v-3pstar-mip-1.json
          python mission-control/grand-missions/validate_gm_v_3pstar_mip_control.py             --source-sha "$SOURCE_SHA"             --out /tmp/gm-v-3pstar-mip-2.json
          cmp /tmp/gm-v-3pstar-mip-1.json /tmp/gm-v-3pstar-mip-2.json
          grep -q 'PASS_GM_V_3PSTAR_MIP_CONTROL' /tmp/gm-v-3pstar-mip-1.json

      - name: Bind latest valid predecessor runtime evidence (no pinned ids)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # #529 G05: was pinned to runs 35171901674 / 35343419829 and artifacts
          # 10476967287 / 10546460986, purged by 30-day retention (red with zero code
          # change). Now each predecessor resolves to its latest successful master run
          # whose head is an ancestor of this gate's source, with a live digested artifact.
          python mission-control/grand-missions/evidence_binding.py resolve \
            --producer gm-iv-runtime-capacity-proof-v2.yml \
            --artifact-prefix gm-iv-runtime-capacity-v2- \
            --source-sha "$SOURCE_SHA" \
            --run-out /tmp/capacity-run.json --artifact-out /tmp/capacity-artifact.json \
            --binding-out /tmp/capacity-binding.json
          python mission-control/grand-missions/evidence_binding.py resolve \
            --producer gm-v-governor-readiness.yml \
            --artifact-prefix gm-v-governor-readiness- \
            --source-sha "$SOURCE_SHA" \
            --run-out /tmp/gmv-run.json --artifact-out /tmp/gmv-artifact.json \
            --binding-out /tmp/gmv-binding.json
          python - <<'PY'
          import json
          for run_f, art_f, bind_f in (('/tmp/capacity-run.json','/tmp/capacity-artifact.json','/tmp/capacity-binding.json'),
                                       ('/tmp/gmv-run.json','/tmp/gmv-artifact.json','/tmp/gmv-binding.json')):
              run, art, b = (json.load(open(f)) for f in (run_f, art_f, bind_f))
              assert b['result']=='PASS' and b['pinned_ids_used'] is False
              assert run['status']=='completed' and run['conclusion']=='success' and run['head_sha']==b['head_sha']
              assert art['id']==b['artifact_id'] and art['expired'] is False
              assert art['digest']==b['artifact_digest'] and art['digest'].startswith('sha256:')
          print('PASS_LATEST_VALID_PREDECESSOR_RUNTIME_ARTIFACTS')
          PY

      - name: Enforce terminal handover boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('/tmp/gm-v-3pstar-mip-1.json'))
          assert r['gm_iv_state']=='ACTIVE_8_OF_8'
          assert r['gm_v_state']=='HELD'
          assert r['gm_v_launch_authorized'] is False
          assert r['three_pc_prove']=='WITHHELD_EXTERNAL'
          assert r['three_p3_authorized'] is False
          assert r['qps_runtime_gate']=='INFRA_PREEXECUTION_ZERO_STEP / RUNNER_ADMISSION'
          assert r['authority_transfer'] is False
          assert r['formal_credit_delta']==0
          print('PASS_GM_V_TERMINAL_WITHHOLD_BOUNDARY')
          PY

      - name: Upload exact-SHA 3PSTAR MIP handover receipt
        uses: actions/upload-artifact@v4
        with:
          name: gm-v-3pstar-mip-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/gm-v-3pstar-mip-1.json
            /tmp/gm-v-3pstar-mip-2.json
            /tmp/capacity-run.json
            /tmp/capacity-artifact.json
            /tmp/gmv-run.json
            /tmp/capacity-binding.json
            /tmp/gmv-binding.json
            /tmp/gmv-artifact.json
            mission-control/grand-missions/GM_V_3PSTAR_MIP_CONTROL_v1.json
            mission-control/grand-missions/GM_V_CURRENT_v1.json
            mission-control/grand-missions/handover/SC_2026-09-18_GM_V_3PSTAR_MIP_LOSSLESS_HANDOVER_v1.md
            mission-control/grand-missions/handover/RESTART_DROPIN_2026-09-18_GM_V_v1.md
            mission-control/grand-missions/handover/SC_2026-09-18_GM_V_3PSTAR_MIP_LOSSLESS_HANDOVER_v2.md
            mission-control/grand-missions/handover/RESTART_DROPIN_2026-09-18_GM_V_v2.md
          if-no-files-found: error
          retention-days: 30
