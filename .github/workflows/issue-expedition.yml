name: Issue expedition triway burndown (read-only contract tests)
on:
  pull_request:
    paths:
      - 'mission-control/qps-triage-ultra/issue-expedition/**'
      - '.github/workflows/issue-expedition.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: issue-expedition-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  test:
    name: triway contract tests (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checkout
        env:
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          echo "ISSUE_EXPEDITION_SOURCE_HEAD=$HEAD"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests with coverage
        working-directory: mission-control/qps-triage-ultra/issue-expedition
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check coverage==7.13.3
          python -m coverage run --branch --include=triway_burndown.py -m unittest -v test_triway_burndown
          python -m coverage report --fail-under=80
