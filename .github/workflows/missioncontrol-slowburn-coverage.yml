name: MissionControl CREW slow-burn ZERO frontier (bounded N+6)

on:
  pull_request:
    paths:
      - ".github/workflows/missioncontrol-slowburn-coverage.yml"
      - "mission-control/gogreen/tests/**"
      - "mission-control/gogreen/pulse_metrics.py"
  workflow_dispatch:
  # Scheduled workflows run only from the default branch after governed landing.
  schedule:
    - cron: "19 3 * * *"

permissions:
  contents: read

concurrency:
  group: mc-crew-slowburn-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  small-bits:
    name: CREW ${{ matrix.family }} Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {family: ZERO, python: "3.12", case: test_pulse_metrics.py}
          - {family: DOCK, python: "3.12", case: test_scale_dock.py}
          - {family: MATRIX, python: "3.12", case: test_scale_matrix.py}
          - {family: TIMELINE, python: "3.12", case: test_wave_timeline.py}
          - {family: ROLLUP, python: "3.12", case: test_pulse_rollup.py}
          - {family: TRIAGE, python: "3.12", case: test_rerun_triage.py}
    steps:
      - name: Exact-head read-only checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install bounded coverage instrumentor
        run: python -m pip install coverage==7.10.7 PyYAML==6.0.2
      - name: Native small-bit tests, statement and branch instrumentation
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TEST_CASE: ${{ matrix.case }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m coverage run --branch --source=mission-control/gogreen \
            -m unittest discover -s mission-control/gogreen/tests -p "$TEST_CASE" -v 2>&1 | tee native.log
          python -m coverage json -o coverage.json
          python -m coverage report --show-missing
          python - <<'PY'
          import json
          c=json.load(open("coverage.json", encoding="utf-8"))
          assert c["meta"].get("branch_coverage") is True
          assert c["files"], "empty coverage denominator is not a pass"
          print("SLOWBURN_MEASURED_ONLY: exact source, nonempty coverage file census")
          PY
      - name: Preserve small-bit source and output evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crew-slowburn-${{ matrix.family }}-${{ github.sha }}
          path: |
            native.log
            coverage.json
          retention-days: 14
