name: BD Workflow Frequency Telemetry

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  pull_request:
    paths:
      - tools/bd_workflow_frequency.py
      - tests/test_bd_workflow_frequency.py
      - .github/workflows/bd-workflow-frequency-telemetry.yml

permissions:
  actions: read
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Offline unit controls (measurement contract)
        run: python3 -m unittest discover -s tests -p 'test_bd_workflow_frequency.py' -v
      - name: Measure top workflow families
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .artifacts/bd-workflow-frequency
          python3 tools/bd_workflow_frequency.py \
            --repo "$GITHUB_REPOSITORY" \
            --limit 500 \
            --family 'qps_w3_federation=.github/workflows/qps-triage-ultra-w0.yml,.github/workflows/w3-16-m03-w0-recon.yml,.github/workflows/w3-11-non-origin-math-consumer.yml,.github/workflows/w3-13-measured-telemetry.yml,.github/workflows/w3-14-measured-pca.yml' \
            --family 'gm_fleet=.github/workflows/gm-fleet-03-capacity-gate.yml,.github/workflows/gm-fleet-02b.yml,.github/workflows/gm-fleet-03-ring1-recon.yml,.github/workflows/gm-fleet-03-f01-pilot.yml,.github/workflows/gm-fleet-03-ring2-recon.yml,.github/workflows/gm-fleet-03-f03-pilot.yml' \
            --out-json .artifacts/bd-workflow-frequency/metrics.json \
            --out-md .artifacts/bd-workflow-frequency/summary.md
          cat .artifacts/bd-workflow-frequency/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload frequency telemetry
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bd-workflow-frequency-${{ github.run_id }}
          path: .artifacts/bd-workflow-frequency/
          if-no-files-found: error
