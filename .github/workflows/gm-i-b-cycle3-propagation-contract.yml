name: GM-I-B Cycle3 Propagation Contract

on:
  pull_request:
    paths:
      - 'mission-control/grand-missions/GM_I_B_CYCLE3_PROPAGATION_CONTRACT_v1.json'
      - 'mission-control/grand-missions/validate_gm_i_b_cycle3_contract_v2.py'
      - '.github/workflows/gm-i-b-cycle3-propagation-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-self-check:
    runs-on: ubuntu-latest
    env:
      EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout literal source head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
      - name: Verify literal source head
        run: test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
      - name: Fetch immutable KEB atom
        run: |
          mkdir -p mission-control/grand-missions/generated
          curl --fail --location \
            https://raw.githubusercontent.com/GBOGEB/CODEX/bd1fb697e6aa86ebc077b92015201ad512728a13/ssot/bridge_rows/gg_math_temporal_pca_w4_p31_knowledge_atom.json \
            --output mission-control/grand-missions/generated/keb_item_0002.json
      - name: Execute Cycle3 contract self-check
        run: |
          python mission-control/grand-missions/validate_gm_i_b_cycle3_contract_v2.py \
            --contract mission-control/grand-missions/GM_I_B_CYCLE3_PROPAGATION_CONTRACT_v1.json \
            --atom mission-control/grand-missions/generated/keb_item_0002.json \
            --out mission-control/grand-missions/generated/GM_I_B_CYCLE3_CONTRACT_SELFCHECK_RECEIPT_v1.json
      - name: Verify first-leg KPIs
        run: |
          python - <<'PY'
          import json
          p='mission-control/grand-missions/generated/GM_I_B_CYCLE3_CONTRACT_SELFCHECK_RECEIPT_v1.json'
          r=json.load(open(p))
          assert r['status']=='PASS_CONTRACT_SELF_CHECK'
          assert r['kpi']['propagation_targets_total']==3
          assert r['kpi']['propagation_targets_reached']==1
          assert abs(r['kpi']['propagation_coverage']-1/3)<1e-12
          assert r['kpi']['semantic_parity']==1.0
          assert r['kpi']['reuse_ratio']==1.0
          assert r['kpi']['duplicate_implementation_count']==0
          assert r['kpi']['authority_inversion_count']==0
          assert r['authority_transfer'] is False
          print('PASS_GM_I_B_CYCLE3_CONTRACT')
          PY
      - name: Upload contract proof
        uses: actions/upload-artifact@v4
        with:
          name: gm-i-b-cycle3-contract-${{ env.EXACT_HEAD }}
          path: |
            mission-control/grand-missions/GM_I_B_CYCLE3_PROPAGATION_CONTRACT_v1.json
            mission-control/grand-missions/generated/keb_item_0002.json
            mission-control/grand-missions/generated/GM_I_B_CYCLE3_CONTRACT_SELFCHECK_RECEIPT_v1.json
          if-no-files-found: error
