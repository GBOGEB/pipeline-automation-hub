name: Taxonomy Metadata Plan (pure dry-run)
on:
  pull_request:
    paths:
      - mission-control/issue_rank/taxonomy_metadata_plan.py
      - mission-control/issue_rank/test_taxonomy_metadata_plan.py
      - .github/workflows/taxonomy-metadata-plan.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: taxonomy-metadata-plan-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  metadata-negative-contract:
    runs-on: ubuntu-24.04
    name: taxonomy metadata dryrun (py${{ matrix.python }})
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact source head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Negative tests (no GitHub token, no writes)
        working-directory: mission-control/issue_rank
        run: python -m unittest -v test_taxonomy_metadata_plan
