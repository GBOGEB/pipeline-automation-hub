name: MissionControl Makeover Navigator (read-only QA)
on:
  pull_request:
    paths:
      - 'mission-control/launchpad/**'
      - 'mission-control/federation-atlas/pages_portal.py'
      - 'mission-control/federation-atlas/test_pages_portal.py'
      - '.github/workflows/mc-makeover-launchpad-qa.yml'
  push:
    branches: [master]
    paths:
      - 'mission-control/launchpad/**'
      - 'mission-control/federation-atlas/pages_portal.py'
      - 'mission-control/federation-atlas/test_pages_portal.py'
      - '.github/workflows/mc-makeover-launchpad-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-model:
    name: Contract & renderer / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11','3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact source checkout
        env:
          EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXACT_SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Source-owned tests and measured focused coverage
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check coverage==7.13.3
          mkdir -p build/missioncontrol
          python -m coverage run --branch --source=nav_model,render_launchpad -m unittest discover -s mission-control/launchpad -p 'test_*.py' -v 2>&1 | tee build/missioncontrol/model-tests.log
          python -m coverage json -o build/missioncontrol/focused-coverage.json
          python - <<'PY'
          import json
          x=json.load(open('build/missioncontrol/focused-coverage.json'))['totals']
          assert x['covered_lines']>0 and x['num_branches']>0
          print('MC_MODEL_FOCUSED_SCOPE_ONLY',x['covered_lines'],x['num_statements'],x['covered_branches'],x['num_branches'])
          PY
      - name: Deterministic source snapshot / Mermaid / SIPOC
        env:
          MC_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python mission-control/launchpad/render_launchpad.py --out build/missioncontrol/view --sha "$MC_EXACT_HEAD"
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('build/missioncontrol/view')
          m=json.loads((p/'manifest.json').read_text())
          a=json.loads((p/'snapshot.json').read_text())
          assert a['counts']=={'repositories':6,'nodes':13,'edges':19,'reports':15,'receipt_edges_historical':3,'declared_edges':16,'execution_dependencies':7}
          assert a['admission']=='HOLD' and not a['policy']['mutation_enabled']
          for file,expected in m['files_sha256'].items():
              assert hashlib.sha256((p/file).read_bytes()).hexdigest()==expected
          print('MC_NAV_SOURCE_PARITY=PASS; native worker count UNKNOWN')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mc-makeover-model-${{ matrix.python }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/missioncontrol
          if-no-files-found: warn
  chromium-pages:
    name: Responsive / Pages packaging, 3 viewports
    runs-on: ubuntu-latest
    needs: exact-model
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Chromium test harness
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Build exact checkout and single-owner Pages archive
        env:
          MC_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MC_EXACT_HEAD"
          mkdir -p build/atlas build/view build/browser
          printf '%s\n' '<!doctype html><html><title>Local source Atlas stub for portal packaging test</title></html>' > build/atlas/index.html
          python mission-control/launchpad/render_launchpad.py --out build/view --sha "$MC_EXACT_HEAD"
          python -m unittest discover -s mission-control/federation-atlas -p 'test_pages_portal.py' -v
          python mission-control/federation-atlas/pages_portal.py --atlas build/atlas --out build/published --sha "$MC_EXACT_HEAD"
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('build/published');site=json.loads((p/'site-manifest.json').read_text())
          mc=json.loads((p/'missioncontrol/manifest.json').read_text())
          assert site['source_git_sha']==mc['source_head_sha']
          assert mc['publisher']=='EXISTING_ATLAS_PAGES_ONLY' and mc['merge_admission']=='HOLD'
          assert not site['merge_authorized']
          assert 'missioncontrol/index.html' in site['public_files_sha256']
          for f,sha in site['public_files_sha256'].items():
              assert hashlib.sha256((p/f).read_bytes()).hexdigest()==sha
          print('MC_PAGES_PACKAGING=PASS; deployed_http=NOT_VERIFIED')
          PY
      - name: Native Playwright controls / links / responsive negative seeds
        env:
          MC_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [ -f "$GITHUB_WORKSPACE/scripts/ci/qa_trap.sh" ] && QA_TITLE="Native Playwright controls / links / responsive negative seeds" . "$GITHUB_WORKSPACE/scripts/ci/qa_trap.sh"
          python mission-control/launchpad/browser_qa.py --html build/published/missioncontrol/index.html --manifest build/published/missioncontrol/manifest.json --out build/browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mc-makeover-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/browser
            build/published/missioncontrol
            build/published/site-manifest.json
          if-no-files-found: warn
