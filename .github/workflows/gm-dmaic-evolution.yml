name: GM DMAIC Evolution Control

on:
  pull_request:
    branches: [master]
    paths:
      - 'mission-control/grand-missions/GM_DMAIC_EVOLUTION_T7_T14_T21_v1.json'
      - 'mission-control/grand-missions/gm_dmaic_evolution_metrics.py'
      - 'mission-control/grand-missions/tests/test_gm_dmaic_evolution.py'
      - '.github/workflows/gm-dmaic-evolution.yml'
  push:
    branches: [master]
    paths:
      - 'mission-control/grand-missions/GM_DMAIC_EVOLUTION_T7_T14_T21_v1.json'
      - 'mission-control/grand-missions/gm_dmaic_evolution_metrics.py'
      - 'mission-control/grand-missions/tests/test_gm_dmaic_evolution.py'
      - '.github/workflows/gm-dmaic-evolution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Prove cohort evolution and fail-closed promotion gates
        run: |
          python -m unittest mission-control/grand-missions/tests/test_gm_dmaic_evolution.py -v
          python mission-control/grand-missions/gm_dmaic_evolution_metrics.py \
            --contract mission-control/grand-missions/GM_DMAIC_EVOLUTION_T7_T14_T21_v1.json \
            --out /tmp/gm-dmaic-evolution.json
      - name: Upload promotion receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gm-dmaic-evolution-${{ github.sha }}
          path: /tmp/gm-dmaic-evolution.json
