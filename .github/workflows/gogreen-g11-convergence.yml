name: GOGREEN G11 Cross-Lane Exact-Run Convergence
on:
  pull_request:
    paths:
      - 'mission-control/gogreen/convergence_bridge/**'
      - '.github/workflows/gogreen-g11-convergence.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: gogreen-g11-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reconcile-native:
    name: G11 G7/G9/G10 unique-run convergence and native scoped tests
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Native 47 test exact-source cross-lane hostile proof, statement and branch coverage
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m pip install --disable-pip-version-check 'coverage==7.13.3'
          mkdir -p "$RUNNER_TEMP/gogreen-g11"
          export COVERAGE_FILE="$RUNNER_TEMP/gogreen-g11/.coverage"
          python -m coverage run --branch \
            --include='*/mission-control/gogreen/convergence_bridge/reconcile.py' \
            -m unittest discover -s mission-control/gogreen/convergence_bridge/tests \
            -p 'test_reconcile.py' -v 2>&1 | tee "$RUNNER_TEMP/gogreen-g11/native_tests.log"
          python -m coverage json -o "$RUNNER_TEMP/gogreen-g11/coverage.json" -q
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          d=Path(os.environ['RUNNER_TEMP'])/'gogreen-g11'
          log=(d/'native_tests.log').read_text()
          if re.findall(r'Ran (\d+) tests? in',log)!=['47'] or '\nOK' not in log:
              raise SystemExit('G11 regression denominator not met')
          c=json.loads((d/'coverage.json').read_text())
          key='mission-control/gogreen/convergence_bridge/reconcile.py'
          if c['meta']['branch_coverage'] is not True or c['meta']['version']!='7.13.3':
              raise SystemExit('G11 coverage mode mismatch')
          if list(c['files'])!=[key]:raise SystemExit('G11 scope drift')
          x=c['files'][key]['summary']
          st=(x['covered_lines'],x['num_statements'])
          br=(x['covered_branches'],x['num_branches'])
          if min(st[1],br[1])<=0 or st[0]>st[1] or br[0]>br[1]:
              raise SystemExit('invalid source coverage denominator')
          if st[0]*100<90*st[1] or br[0]*100<85*br[1]:
              raise SystemExit(f'G11 source coverage below 90/85 ratchet {st} {br}')
          proof={'schema':'gogreen.g11.focused-native-coverage.v1',
            'exact_head':os.environ['EXPECTED_SHA'],'tests_passed':47,
            'production_module':key,'tool':'coverage==7.13.3',
            'statement_covered':st[0],'statement_eligible':st[1],
            'branch_covered':br[0],'branch_eligible':br[1],
            'whole_repo_coverage':None,'merge_authorized':False}
          (d/'native_coverage_receipt.json').write_text(json.dumps(proof,sort_keys=True,indent=2)+'\n')
          print(json.dumps(proof,sort_keys=True))
          PY
      - name: Reconcile 24 plus 57 and G10 native visual QA, verify output bytes
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          [ -f "$GITHUB_WORKSPACE/scripts/ci/qa_trap.sh" ] && QA_TITLE="Reconcile 24 plus 57 and G10 native visual QA, verify output bytes" . "$GITHUB_WORKSPACE/scripts/ci/qa_trap.sh"
          set -euo pipefail
          python mission-control/gogreen/convergence_bridge/reconcile.py \
            --root mission-control/gogreen \
            --source-sha "$EXPECTED_SHA" \
            --out "$RUNNER_TEMP/gogreen-g11/generated"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          d=Path(os.environ['RUNNER_TEMP'])/'gogreen-g11'
          out=d/'generated'
          manifest=json.loads((out/'manifest.json').read_text())
          assert manifest['exact_head']==os.environ['EXPECTED_SHA']
          for name,sha in manifest['files'].items():
              assert hashlib.sha256((out/name).read_bytes()).hexdigest()==sha
          data=json.loads((out/'metrics.json').read_text())
          assert (data['g7_selected_successful_run_ids'],data['g9_complete_window_run_ids'],
                  data['native_run_id_overlap'],data['unique_union_run_ids'])==(24,57,12,69)
          assert (data['unique_union_successes'],data['union_native_failed'],
                  data['union_native_cancelled'])==(58,10,1)
          assert data['global_fleet_success_rate'] is None and data['root_closure_credit']==0
          assert data['tracked_module_statements']==[531,531]
          assert data['tracked_module_branches']==[90,90]
          proof={'schema':'gogreen.g11.native-output.v1',
            'exact_head':os.environ['EXPECTED_SHA'],
            'run_id':int(os.environ['RUN_ID']),
            'attempt':int(os.environ['RUN_ATTEMPT']),
            'manifest_sha256':hashlib.sha256((out/'manifest.json').read_bytes()).hexdigest(),
            'artifact_bytes_verified_inside_run':True,
            'external_archive_custody':False,
            'independent_review':False,'root_closure_credit':0,'merge_authorized':False}
          (d/'native_receipt.json').write_text(json.dumps(proof,sort_keys=True,indent=2)+'\n')
          print(json.dumps(proof,sort_keys=True))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: gogreen-g11-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/gogreen-g11/
          retention-days: 30
          if-no-files-found: warn
