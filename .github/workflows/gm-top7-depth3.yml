name: GM Top7 Depth3 Mission Control

on:
  pull_request:
    branches: [master]
    paths:
      - 'mission-control/grand-missions/GM_TOP7_DEPTH3_MISSION_v1.json'
      - 'mission-control/grand-missions/gm_top7_depth3_metrics.py'
      - 'mission-control/grand-missions/tests/test_gm_top7_depth3.py'
      - '.github/workflows/gm-top7-depth3.yml'
  push:
    branches: [master]
    paths:
      - 'mission-control/grand-missions/GM_TOP7_DEPTH3_MISSION_v1.json'
      - 'mission-control/grand-missions/gm_top7_depth3_metrics.py'
      - 'mission-control/grand-missions/tests/test_gm_top7_depth3.py'
      - '.github/workflows/gm-top7-depth3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Validate mission contract and temporal metrics
        run: |
          python -m unittest mission-control/grand-missions/tests/test_gm_top7_depth3.py -v
          python mission-control/grand-missions/gm_top7_depth3_metrics.py \
            --contract mission-control/grand-missions/GM_TOP7_DEPTH3_MISSION_v1.json \
            --out /tmp/gm-top7-depth3-metrics.json
      - name: Upload metrics receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gm-top7-depth3-metrics-${{ github.sha }}
          path: /tmp/gm-top7-depth3-metrics.json
