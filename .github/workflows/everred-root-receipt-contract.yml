name: EVERRED Semantic Root Receipt Contract
on:
  pull_request:
    paths:
      - 'mission-control/qps-triage-ultra/p-process/everred/receipt_contract.py'
      - 'mission-control/qps-triage-ultra/p-process/everred/test_receipt_contract.py'
      - 'mission-control/qps-triage-ultra/p-process/everred/RECEIPT_CONTRACT.md'
      - '.github/workflows/everred-root-receipt-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fail-closed-receipt:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile receipt engine
        run: python -m py_compile mission-control/qps-triage-ultra/p-process/everred/receipt_contract.py
      - name: Execute adversarial and positive fixture contracts
        run: python -m unittest discover -s mission-control/qps-triage-ultra/p-process/everred -p test_receipt_contract.py -v