name: federation-exact-head-receipts
on:
  pull_request:
    paths:
      - 'mission-control/federation-atlas/exact_head_receipts.py'
      - 'mission-control/federation-atlas/test_exact_head_receipts.py'
      - '.github/workflows/federation-exact-head-receipts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-head-contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify matched-source and deliberate RED negatives
        run: |
          python -m unittest discover \
            -s mission-control/federation-atlas \
            -p test_exact_head_receipts.py -v
