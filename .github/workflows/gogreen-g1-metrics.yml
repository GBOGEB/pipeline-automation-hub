name: GOGREEN G1/G3 Coverage and Bounded Scaling Proof
on:
  pull_request:
    paths:
      - 'mission-control/gogreen/**'
      - '.github/workflows/gogreen-g1-metrics.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: gogreen-g1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  coverage-and-bounded-scale:
    name: G1/G3 source-bound coverage and scaling
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install pinned GoGREEN receipt-signature dependency
        run: python -m pip install --disable-pip-version-check 'cryptography==46.0.4'
      - name: Verify exact HEAD and coverage tool version
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m pip install 'coverage==7.13.3'
          python -m coverage --version
      - name: Native focused regression with source-bound metrics
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gogreen-g1"
          python -m coverage run --branch --source=mission-control/gogreen \
            -m unittest discover -s mission-control/gogreen/tests -q \
            2>&1 | tee "$RUNNER_TEMP/gogreen-g1/unittest.log"
          python -m coverage json -o "$RUNNER_TEMP/gogreen-g1/coverage.json"
          python mission-control/gogreen/scale_matrix.py \
            --output "$RUNNER_TEMP/gogreen-g1/scale_matrix.json"
          python mission-control/gogreen/pulse_metrics.py \
            --coverage-json "$RUNNER_TEMP/gogreen-g1/coverage.json" \
            --unittest-log "$RUNNER_TEMP/gogreen-g1/unittest.log" \
            --repository "$SOURCE_REPO" --expected-sha "$EXPECTED_SHA" \
            --wave-id 'G3-P3' --output "$RUNNER_TEMP/gogreen-g1/pulse.json"
      - name: Upload bounded evidence without admission
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gogreen-g1-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/gogreen-g1/
          if-no-files-found: warn
          retention-days: 30
