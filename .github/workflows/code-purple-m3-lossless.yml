name: CODE PURPLE M3 Lossless Stabilization
on:
  pull_request:
    paths:
      - 'mission-control/federation-atlas/m2_session/**'
      - 'handover/session/CODE_PURPLE_M2_LIVE_RECONCILIATION_20261015.md'
      - '.github/workflows/code-purple-m3-lossless.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m3-source-invariants:
    name: M3 existing source and historic lineage
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Exact-source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Preflight exact SHA and Node
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node --check mission-control/federation-atlas/m2_session/continuation/m3_handover.js
          node --check mission-control/federation-atlas/m2_session/continuation/test_m3_handover.js
      - name: Native 36-case M3 tests
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m3"
          node mission-control/federation-atlas/m2_session/continuation/test_m3_handover.js 2>&1 | tee "$RUNNER_TEMP/m3/m3_testflight.log"
          grep -Fqx 'Ran 36 M3 tests: PASS' "$RUNNER_TEMP/m3/m3_testflight.log"
      - name: Existing M2 portal 12-case native QA
        run: |
          [ -f "$GITHUB_WORKSPACE/scripts/ci/qa_trap.sh" ] && QA_TITLE="Existing M2 portal 12-case native QA" . "$GITHUB_WORKSPACE/scripts/ci/qa_trap.sh"
          set -euo pipefail
          node mission-control/federation-atlas/m2_session/test_m2_portal.js 2>&1 | tee "$RUNNER_TEMP/m3/m2_testflight.log"
          node mission-control/federation-atlas/m2_session/m2_portal.js --check
          grep -Fqx 'Ran 12 M2 source-bound HTML tests: PASS' "$RUNNER_TEMP/m3/m2_testflight.log"
      - name: Rebuild source-bound handover and verify SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NATIVE_RUN: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          [ -f "$GITHUB_WORKSPACE/scripts/ci/qa_trap.sh" ] && QA_TITLE="Rebuild source-bound handover and verify SHA" . "$GITHUB_WORKSPACE/scripts/ci/qa_trap.sh"
          set -euo pipefail
          SCRIPT=mission-control/federation-atlas/m2_session/continuation/m3_handover.js
          node "$SCRIPT" --out "$RUNNER_TEMP/m3" --source-sha "$EXPECTED_SHA"
          node "$SCRIPT" --check --out "$RUNNER_TEMP/m3" --source-sha "$EXPECTED_SHA"
          node - <<'JS'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const dir=path.join(process.env.RUNNER_TEMP,'m3');
          const report=JSON.parse(fs.readFileSync(path.join(dir,'M3_INDEX.json')));
          const m=JSON.parse(fs.readFileSync(path.join(dir,'M3_MANIFEST.json')));
          if(report.source_sha!==process.env.EXPECTED_SHA||m.source_sha!==process.env.EXPECTED_SHA)throw Error('source SHA mismatch');
          if(report.counts.intents!==16||report.counts.actions!==31||report.release!=='HOLD'||report.qps!=='DEFER'||report.merge_authorized!==false)throw Error('lineage/authority drift');
          for(const [name,value] of Object.entries(m.items)){
            const bytes=fs.readFileSync(path.join(dir,name));
            if(crypto.createHash('sha256').update(bytes).digest('hex')!==value.sha256||bytes.length!==value.bytes)throw Error('byte mismatch '+name);
          }
          const receipt={schema:'missioncontrol.m3_native_receipt.v2',source_sha:process.env.EXPECTED_SHA,run_id:Number(process.env.NATIVE_RUN),attempt:Number(process.env.ATTEMPT),intents:16,actions:31,m3_tests:36,m2_tests:12,qa:'PASS',browser_qa:'DEFER',qps:'DEFER',release:'HOLD',merge_authorized:false};
          fs.writeFileSync(path.join(dir,'M3_NATIVE_RECEIPT.json'),JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt));
          JS
      - name: Upload full text-only handover
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: m3-lossless-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/m3/
          if-no-files-found: error
          retention-days: 14
  inherited-golden-thread:
    name: Existing M1 recursive hash chain and intent checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Existing 8 plus 19 Golden Thread regression
        run: |
          set -euo pipefail
          python -m unittest discover -s mission-control/golden-thread -p test_golden_thread.py -v
          python -m unittest discover -s mission-control/golden-thread/session_hook -p test_session_hook.py -v
      - name: Rebuild existing M1 projection and verify source-bound bytes
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/session-check"
          python mission-control/golden-thread/session_hook/session_hook.py --input mission-control/golden-thread/session_hook/SESSION_INTAKE_V1.json --source-sha "$HEAD_SHA" --out "$RUNNER_TEMP/session-check"
          python mission-control/golden-thread/golden_thread.py verify "$RUNNER_TEMP/session-check/session_ledger.json"
