name: GOGREEN G8 Comparative Native N+1
on:
  pull_request:
    paths:
      - 'mission-control/gogreen/comparative/**'
      - '.github/workflows/gogreen-g8-comparative.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: gogreen-g8-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-comparative:
    name: G8 comparative data, HTML and adversarial tests
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout exact author head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Execute 31 native data/HTML and negative tests
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p "$RUNNER_TEMP/gogreen-g8"
          python -m unittest discover -s mission-control/gogreen/comparative \
            -p 'test_comparison.py' -v \
            2>&1 | tee "$RUNNER_TEMP/gogreen-g8/native_tests.log"
          python - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          root=Path('mission-control/gogreen/comparative')
          tmp=Path(os.environ['RUNNER_TEMP'])/'gogreen-g8'
          tests=(tmp/'native_tests.log').read_text()
          counts=re.findall(r'Ran (\d+) tests? in',tests)
          if counts != ['31'] or '\nOK' not in tests:
              raise SystemExit('native G8 test denominator not met')
          data=json.loads((root/'comparison.json').read_text())
          html=(root/'index.html').read_text()
          open_tag='<script id="data" type="application/json">'
          if html.count(open_tag)!=1:raise SystemExit('no unique embedded JSON source')
          raw=html.split(open_tag,1)[1].split('</script>',1)[0]
          embedded=json.loads(raw)
          if embedded != data:
              raise SystemExit('stale rendered HTML/JSON snapshot parity')
          assert data['portfolio']['created']==111
          assert data['portfolio']['closed']==72
          assert data['portfolio']['merged']==71
          assert data['top21']['repo_count_source_heads_verified']==21
          assert data['top21']['effective_admission'] is None
          assert data['go_green']['native_temporal']['runner_executed_successful_jobs']==9
          assert data['go_green']['native_temporal']['runner_busy_seconds']==235
          temporal=data['go_green']['native_temporal']
          assert temporal['native_Nplus1_test_methods_passed']==53
          assert temporal['matched_coverage_gain_pp']==5.7522
          assert temporal['matched_branch_gain_pp']==2.6316
          assert temporal['source_module_git_blob']=='e7b54f64890489b495bfa43de7b1e5a43902f47a'
          assert temporal['whole_repo_pass_pct'] is None
          pulse=data["go_green"]["qps_threepulse"]
          assert pulse["frozen_main_run_census"]=={
              "runs":33,"success":22,"failure":11,"cancelled":0,
              "source_population":"ALL_RETRIEVED_BRANCH_DATE_RUNS",
              "retrieved_page_complete":True}
          assert sum(x["n"] for x in pulse["failure_family_manifestations"])==11
          assert (pulse["first_red_exact_error_verified"],pulse["first_red_unknown"])==(10,1)
          assert (pulse["pulse_results"][1]["python_tests_passed"],
                  pulse["pulse_results"][1]["ts_tests_passed"])==(21,41)
          assert pulse["pulse_results"][2]["source_scope_comparable"] is False
          assert pulse["pulse_results"][2]["statement_n2"]==[30,30]
          assert pulse["pulse_results"][2]["branch_n2"]==[18,18]
          assert pulse["post_merge_controls"]["root_closure_credit"]==0

          hashes={}
          for name in ('comparison.json','index.html','test_comparison.py','README.md'):
              hashes[name]=hashlib.sha256((root/name).read_bytes()).hexdigest()
          proof={'schema':'gogreen.g8.native-comparative-receipt.v1',
                 'source_sha':os.environ['EXPECTED_SHA'],
                 'tests_passed':31,'portfolio_event_window':'2026-10-16..2026-10-17',
                 'source_head_discovery':21,'top21_admission':None,
                 'runner_busy_seconds_not_billed':235,'artifacts_sha256':hashes,
                 'root_closure_credit':0,'authority_transfer':False,
                 'merge_authorized':False,'external_artifact_custody':False}
          (tmp/'native_receipt.json').write_text(json.dumps(proof,sort_keys=True,indent=2)+'\n')
          (tmp/'index.html').write_bytes((root/'index.html').read_bytes())
          (tmp/'comparison.json').write_bytes((root/'comparison.json').read_bytes())
          print(json.dumps(proof,sort_keys=True))
          PY
      - name: Upload review artifacts, without Pages publication
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gogreen-g8-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/gogreen-g8/
          retention-days: 30
          if-no-files-found: warn
