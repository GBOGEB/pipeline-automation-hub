name: GOGREEN G0 Positive Evidence Testflight
on:
  pull_request:
    paths:
      - 'mission-control/gogreen/**'
      - '.github/workflows/gogreen-g0.yml'
  workflow_dispatch:
    inputs:
      live_scan:
        description: "Read-only six-repo sample (manual dispatch only; no stress)"
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: gogreen-g0-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-bound-contract:
    name: G0 offline evidence and synthetic bounds
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Immutable checkout v4.2.2; don't confuse PR merge ref with author head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install pinned GoGREEN receipt-signature dependency
        run: python -m pip install --disable-pip-version-check 'cryptography==46.0.4'
      - name: Source SHA and negative regression controls
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m compileall -q mission-control/gogreen
          python -m unittest discover -s mission-control/gogreen/tests -v
      - name: Produce and verify deterministic wide-first census
        run: |
          python mission-control/gogreen/spine.py \
            --input mission-control/gogreen/samples/fleet_g0.json \
            --out "$RUNNER_TEMP/gogreen-g0"
          python mission-control/gogreen/spine.py \
            --out "$RUNNER_TEMP/gogreen-g0" --verify
      - name: Bind producer output to exact checked-out PR head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_CONTEXT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          python - <<'PYCODE'
          import hashlib, json, os, subprocess
          from pathlib import Path
          checked = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert checked == os.environ["EXPECTED_HEAD"]
          out = Path(os.environ["RUNNER_TEMP"]) / "gogreen-g0"
          manifest = out / "manifest.json"
          receipt = {"schema": "gogreen.execution-provenance.v1",
                     "repository": os.environ["SOURCE_REPO"],
                     "checked_out_sha": checked,
                     "run_context_sha": os.environ["RUN_CONTEXT_SHA"],
                     "run_id": int(os.environ["RUN_ID"]),
                     "run_attempt": int(os.environ["RUN_ATTEMPT"]),
                     "manifest_file_sha256": hashlib.sha256(manifest.read_bytes()).hexdigest(),
                     "execution_proof": "EXACT_CHECKOUT_CONFIRMED",
                     "source_claims_not_admission": True, "authority_transfer": False}
          (out / "execution_provenance.json").write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(receipt, sort_keys=True))
          PYCODE
      - name: Optional bounded read-only live fleet scout
        if: github.event_name == 'workflow_dispatch' && inputs.live_scan == true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python mission-control/gogreen/collect_readonly.py \
            --catalog mission-control/gogreen/samples/fleet_g0.json \
            --out "$RUNNER_TEMP/gogreen-g0/live" --max-runs 2 --max-jobs 3
      - name: Test bounded local asyncio queue and injected negative control
        run: |
          python mission-control/gogreen/synthetic_probe.py \
            --total 32 --queue-depth 4 --workers 2 --cycles 2 \
            --output "$RUNNER_TEMP/gogreen-g0/synthetic_queue.json"
          python mission-control/gogreen/synthetic_probe.py \
            --total 8 --queue-depth 2 --workers 2 --cycles 2 --inject-failure 3 \
            --output "$RUNNER_TEMP/gogreen-g0/synthetic_expected_fault.json"
      - name: Upload bounded read-only proof; no source push
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gogreen-g0-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/gogreen-g0/
          if-no-files-found: warn
          retention-days: 30
