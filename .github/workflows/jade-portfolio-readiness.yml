name: JADE Portfolio Readiness QA

on:
  pull_request:
    paths:
      - 'mission-control/jade_temple/portfolio_readiness/**'
      - 'mission-control/jade_temple/tools/build_gate12_dov.py'
      - 'mission-control/jade_temple/tools/rolling5.py'
      - 'mission-control/jade_temple/tools/private_boundary.py'
      - 'mission-control/jade_temple/devops/lifecycle.py'
      - 'mission-control/jade_temple/data/GATE12_DOV_ACTIONS.json'
      - 'mission-control/jade_temple/data/FOCUS5_*.json'
      - 'mission-control/jade_temple/data/ROLLING5_*.json'
      - 'mission-control/jade_temple/data/TOP21_PORTFOLIO.json'
      - 'mission-control/gogreen/token_census/REGISTRY.json'
      - 'mission-control/issue_rank/*.py'
      - 'mission-control/jade_temple/sprint/requirements-optional.txt'
      - 'mission-control/qps-triage-ultra/issue-expedition/triway_burndown.py'
      - 'mission-control/federation-atlas/flightdeck/pulses/mip_statistical_qualification.py'
      - 'mission-control/federation-atlas/flightdeck/pulses/mip_provider_execution.py'
      - '.github/workflows/jade-portfolio-readiness.yml'

permissions:
  contents: read

concurrency:
  group: jade-portfolio-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  portfolio-qa:
    name: portfolio-readiness offline contracts and browser
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PORTFOLIO_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      # Frozen 18 Nov candidate-owner-input anchor; do not substitute dynamic HEAD.
      # Historical 09 Nov plan tasks remain pinned to 897298dc... and are HOLD
      # in the current projection until separately source-requalified.
      PORTFOLIO_PLANNING_SHA: 6bd23f96821d44c9ab81ec759340d8aa660f3de8
      HUB_MAIN_REPEAT_SHA: aec47c4c0d0ba026e67b266a2db1ea04f1999359
    steps:
      - name: Checkout the exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PORTFOLIO_EXPECTED_SHA"
          echo "PORTFOLIO_QA_OUT=$RUNNER_TEMP/jade-portfolio-readiness" >> "$GITHUB_ENV"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Run nonzero offline contract population
        run: |
          python - <<'PY'
          import sys
          import unittest
          suite = unittest.defaultTestLoader.discover(
              'mission-control/jade_temple/portfolio_readiness',
              pattern='test_portfolio_readiness.py')
          count = suite.countTestCases()
          if count <= 0:
              raise SystemExit('PORTFOLIO_ZERO_TEST_POPULATION')
          print(f'PORTFOLIO_CONTRACT_TESTS={count}', flush=True)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
      - name: Build source-bound offline review artifacts
        run: |
          set -euo pipefail
          python mission-control/jade_temple/portfolio_readiness/portfolio_readiness.py \
            --as-of "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --source-sha "$PORTFOLIO_PLANNING_SHA" \
            --root-next mission-control/jade_temple/portfolio_readiness/root_next_pilot_hub.json \
            --out "$PORTFOLIO_QA_OUT/site"
      - name: Verify source-bound ROOT NEXT pilot output cannot auto-close
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          output = Path(os.environ["PORTFOLIO_QA_OUT"]) / "site"
          doc = json.loads((output / "root_next_control.json").read_text(encoding="utf-8"))
          assert doc["status"] == "READ_ONLY_PROJECTION", doc["status"]
          assert (doc["total"], doc["actionable"], doc["closure_verified"]) == (2, 2, 0)
          assert {row["root_id"] for row in doc["items"]} == {
              "HUB-README-117-MAIN-PIPELINE", "HUB-README-170-EXCEL-SCHEDULE"}
          assert doc["gate_deficits"]["control"] == 2
          assert sum(item["gate_candidates"] for item in doc["items"]) == 3
          assert sum(len(item["pending_gates"]) for item in doc["items"]) == 13
          native = doc["items"][0]["evidence_candidates"]["native"]
          assert native["head_sha"] == os.environ["HUB_MAIN_REPEAT_SHA"]
          assert native["verification"] == "OWNER_INDEPENDENT_DOV_PENDING"
          assert native["receipt_url"].endswith("/runs/44878223386/artifacts/14696623268")
          assert all(row["root_source"]["blob_sha"] ==
                     "4a691127e9dd4d0a2ad4fb766f16273557b5157f"
                     for row in doc["items"])
          html = (output / "index.html").read_text(encoding="utf-8")
          assert "ROOT NEXT" in html and 'id="root-control-table"' in html
          print("ROOT_NEXT_PILOT_2_OF_2_SOURCE_BOUND / CONTROL_0 / QA_PASS")
          PY
      - name: Reprove historical MAIN pipeline on pinned current-main Git objects
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r excel_schedule_engine/requirements.txt
          python mission-control/jade_temple/portfolio_readiness/repeat_main_proof.py \
            --repo "$GITHUB_WORKSPACE" \
            --source-sha "$HUB_MAIN_REPEAT_SHA" \
            --out "$PORTFOLIO_QA_OUT/site/main_pipeline_repeat_proof.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path(os.environ["PORTFOLIO_QA_OUT"]) / "site"
          main = json.loads((p / "main_pipeline_repeat_proof.json").read_text())
          root = json.loads((p / "root_next_control.json").read_text())
          assert main["status"] == "PASS_NATIVE_REPEAT"
          assert main["source_sha"] == os.environ["HUB_MAIN_REPEAT_SHA"]
          assert main["root_readme_blob_sha"] == root["items"][0]["root_source"]["blob_sha"]
          assert main["test_count"] == main["required_test_count"] == 3
          assert not main["release_qualified"] and not main["control_qualified"]
          assert root["closure_verified"] == 0
          print("MAIN_ROOT_NATIVE_3_OF_3_PASS / SOURCE_PINNED / CONTROL_0")
          PY
      - name: Install the existing pinned browser QA dependency
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -c mission-control/jade_temple/sprint/requirements-optional.txt playwright
          python -m playwright install --with-deps chromium
      - name: Verify offline responsive UI and inert hostile text
        run: |
          set -euo pipefail
          python mission-control/jade_temple/portfolio_readiness/run_browser_qa.py \
            --html "$PORTFOLIO_QA_OUT/site/index.html" \
            --model "$PORTFOLIO_QA_OUT/site/portfolio_readiness.json" \
            --expected-source-sha "$PORTFOLIO_PLANNING_SHA" \
            --expected-checkout-sha "$PORTFOLIO_EXPECTED_SHA" \
            --out "$PORTFOLIO_QA_OUT/browser"
      - name: Upload source-bound review evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jade-portfolio-readiness-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/jade-portfolio-readiness/
          if-no-files-found: warn
          retention-days: 14
