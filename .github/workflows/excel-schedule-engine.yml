name: Excel Schedule Engine

on:
  pull_request:
    paths:
      - "excel_schedule_engine/**"
      - "README.md"
  push:
    branches: [master]
    paths:
      - "excel_schedule_engine/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r excel_schedule_engine/requirements.txt
      - run: python -m unittest discover -s excel_schedule_engine/tests -v
