name: Excel Schedule Engine

on:
  pull_request:
    paths:
      - "excel_schedule_engine/**"
      - "scripts/run_processing.py"
      - "tests/test_run_processing_recursive_integration.py"
      - ".github/workflows/excel-schedule-engine.yml"
      - "README.md"
  push:
    branches: [master]
    paths:
      - "excel_schedule_engine/**"
      - "scripts/run_processing.py"
      - "tests/test_run_processing_recursive_integration.py"
      - ".github/workflows/excel-schedule-engine.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Excel schedule-engine dependency
        run: python -m pip install -r excel_schedule_engine/requirements.txt
      - name: Compile schedule engine
        run: python -m py_compile excel_schedule_engine/src/excel_schedule_engine.py excel_schedule_engine/src/schedule_projection.py
      - name: Excel engine + schedule projection unit tests
        run: python -m unittest discover -s excel_schedule_engine/tests -v
      - name: MAIN runner Excel integration tests
        run: python -m unittest -v tests.test_run_processing_recursive_integration
