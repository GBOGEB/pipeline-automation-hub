name: First-Pass Closure Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [master]
  pull_request_review:
    types: [submitted, edited, dismissed]
    branches: [master]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: read
  actions: read
  statuses: write

jobs:
  first-pass-closure:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((github.event_name == 'pull_request_target' || github.event_name == 'pull_request_review') &&
       github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - name: Resolve live PR identity from GitHub
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request_target|pull_request_review)
              PR_NUMBER="${{ github.event.pull_request.number }}"
              ;;
            workflow_dispatch)
              PR_NUMBER="${{ inputs.pr_number }}"
              ;;
            *)
              echo "unsupported event" >&2
              exit 2
              ;;
          esac
          test -n "$PR_NUMBER"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          HEAD_SHA="$(printf '%s' "$PR_JSON" | jq -r '.head.sha')"
          BASE_SHA="$(printf '%s' "$PR_JSON" | jq -r '.base.sha')"
          test "${#HEAD_SHA}" -eq 40
          test "${#BASE_SHA}" -eq 40
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Publish head-bound pending status
        if: steps.pr.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state='pending' \
            -f context='First-Pass Closure Gate / first-pass-closure' \
            -f description='Trusted evaluator pending' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Checkout trusted PR-base controller
        id: trusted_checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.base_sha }}
          path: trusted-fpc
          persist-credentials: false

      - name: Unit-test trusted controller
        id: trusted_tests
        if: steps.trusted_checkout.outcome == 'success'
        continue-on-error: true
        run: python trusted-fpc/scripts/tests/test_first_pass_closure_gate.py

      - name: Evaluate candidate using trusted controller and policy
        id: gate
        if: steps.trusted_checkout.outcome == 'success' && steps.trusted_tests.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output/fpc
          python trusted-fpc/scripts/first_pass_closure_gate.py \
            --repo "${{ github.repository }}" \
            --pr "${{ steps.pr.outputs.number }}" \
            --policy trusted-fpc/mission-control/quality/FIRST_PASS_CLOSURE_POLICY_v1.json \
            --out output/fpc/FIRST_PASS_CLOSURE_GATE_RECEIPT.json

      - name: Synthesize deterministic FAIL receipt if trusted evaluator did not emit one
        if: always()
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          PR_OUTCOME: ${{ steps.pr.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.trusted_checkout.outcome }}
          TEST_OUTCOME: ${{ steps.trusted_tests.outcome }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          set -euo pipefail
          mkdir -p output/fpc
          RECEIPT=output/fpc/FIRST_PASS_CLOSURE_GATE_RECEIPT.json
          if [ ! -s "$RECEIPT" ]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema": "first_pass_closure_gate_receipt/v3",
              "status": "FAIL_FIRST_PASS_CLOSURE_GATE",
              "reason": (
                  "PRE_EVALUATOR_FAILURE:"
                  f"pr={os.environ.get('PR_OUTCOME','unknown')};"
                  f"checkout={os.environ.get('CHECKOUT_OUTCOME','unknown')};"
                  f"tests={os.environ.get('TEST_OUTCOME','unknown')};"
                  f"gate={os.environ.get('GATE_OUTCOME','unknown')}"
              ),
              "pr_number": os.environ.get("PR_NUMBER") or None,
              "head_sha": os.environ.get("HEAD_SHA") or None,
              "base_sha": os.environ.get("BASE_SHA") or None,
              "merge_allowed": False,
              "authority_transfer": False,
              "formal_credit_delta": 0,
          }
          Path("output/fpc/FIRST_PASS_CLOSURE_GATE_RECEIPT.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY
          fi

      - name: Validate emitted receipt is an exact bound PASS
        id: receipt
        if: always() && steps.trusted_checkout.outcome == 'success'
        continue-on-error: true
        run: |
          python trusted-fpc/scripts/first_pass_closure_gate.py \
            --validate-receipt output/fpc/FIRST_PASS_CLOSURE_GATE_RECEIPT.json \
            --expected-head "${{ steps.pr.outputs.head_sha }}" \
            --expected-base "${{ steps.pr.outputs.base_sha }}"

      - name: Disable auto-merge unless bound PASS receipt is proven
        if: always() && steps.pr.outputs.number != '' && steps.receipt.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          AUTO="$(printf '%s' "$PR_JSON" | jq -r 'if .auto_merge == null then "none" else "enabled" end')"
          if [ "$AUTO" = "enabled" ]; then
            NODE_ID="$(printf '%s' "$PR_JSON" | jq -r .node_id)"
            gh api graphql \
              -f query='mutation($id:ID!){disablePullRequestAutoMerge(input:{pullRequestId:$id}){pullRequest{number}}}' \
              -f id="$NODE_ID"
            echo "FPC_AUTO_MERGE_DISABLED=1"
          else
            echo "FPC_AUTO_MERGE_DISABLED=0"
          fi

      - name: Upload gate receipt
        id: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-pass-closure-gate
          path: output/fpc/FIRST_PASS_CLOSURE_GATE_RECEIPT.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish head-bound final gate status
        if: always() && steps.pr.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_OUTCOME: ${{ steps.pr.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.trusted_checkout.outcome }}
          TEST_OUTCOME: ${{ steps.trusted_tests.outcome }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          RECEIPT_OUTCOME: ${{ steps.receipt.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PR_OUTCOME" = "success" ] \
            && [ "$CHECKOUT_OUTCOME" = "success" ] \
            && [ "$TEST_OUTCOME" = "success" ] \
            && [ "$GATE_OUTCOME" = "success" ] \
            && [ "$RECEIPT_OUTCOME" = "success" ] \
            && [ "$ARTIFACT_OUTCOME" = "success" ]; then
            STATE='success'
            DESCRIPTION='Trusted exact-head gate PASS'
          else
            STATE='failure'
            DESCRIPTION='Trusted exact-head gate FAIL'
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="$STATE" \
            -f context='First-Pass Closure Gate / first-pass-closure' \
            -f description="$DESCRIPTION" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Fail closed unless trusted controller emitted a bound PASS receipt
        if: always()
        shell: bash
        env:
          PR_OUTCOME: ${{ steps.pr.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.trusted_checkout.outcome }}
          TEST_OUTCOME: ${{ steps.trusted_tests.outcome }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          RECEIPT_OUTCOME: ${{ steps.receipt.outcome }}
        run: |
          set -euo pipefail
          test "$PR_OUTCOME" = "success"
          test "$CHECKOUT_OUTCOME" = "success"
          test "$TEST_OUTCOME" = "success"
          test "$GATE_OUTCOME" = "success"
          test "$RECEIPT_OUTCOME" = "success"
          test "$ARTIFACT_OUTCOME" = "success"
          echo "First-Pass Closure Gate PASS_FROM_TRUSTED_BASE."
