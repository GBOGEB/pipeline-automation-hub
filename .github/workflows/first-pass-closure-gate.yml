name: First-Pass Closure Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [master]
  pull_request_review:
    types: [submitted, edited, dismissed]
    branches: [master]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: read
  actions: read

jobs:
  first-pass-closure:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((github.event_name == 'pull_request' || github.event_name == 'pull_request_review') &&
       github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR number before any fallible proof step
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request|pull_request_review)
              echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              PR_NUMBER="${{ inputs.pr_number }}"
              test -n "$PR_NUMBER" || { echo "pr_number input required" >&2; exit 2; }
              echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "unsupported event" >&2
              exit 2
              ;;
          esac

      - name: Checkout exact candidate head
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Unit-test gate logic
        id: tests
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        run: python -m unittest scripts/tests/test_first_pass_closure_gate.py

      - name: Evaluate exact-head first-pass closure
        id: gate
        if: steps.checkout.outcome == 'success' && steps.tests.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output/fpc
          python scripts/first_pass_closure_gate.py \
            --repo "${{ github.repository }}" \
            --pr "${{ steps.pr.outputs.number }}" \
            --policy mission-control/quality/FIRST_PASS_CLOSURE_POLICY_v1.json \
            --out output/fpc/FIRST_PASS_CLOSURE_GATE_RECEIPT.json

      - name: Synthesize deterministic FAIL receipt for pre-evaluator failures
        if: always()
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_OUTCOME: ${{ steps.pr.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          set -euo pipefail
          mkdir -p output/fpc
          RECEIPT=output/fpc/FIRST_PASS_CLOSURE_GATE_RECEIPT.json
          if [ ! -s "$RECEIPT" ]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          reason = (
              "PRE_EVALUATOR_FAILURE:"
              f"pr={os.environ.get('PR_OUTCOME','unknown')};"
              f"checkout={os.environ.get('CHECKOUT_OUTCOME','unknown')};"
              f"tests={os.environ.get('TEST_OUTCOME','unknown')};"
              f"gate={os.environ.get('GATE_OUTCOME','unknown')}"
          )
          payload = {
              "schema": "first_pass_closure_gate_receipt/v2",
              "status": "FAIL_FIRST_PASS_CLOSURE_GATE",
              "reason": reason,
              "pr_number": os.environ.get("PR_NUMBER") or None,
              "merge_allowed": False,
              "authority_transfer": False,
              "formal_credit_delta": 0,
          }
          Path("output/fpc/FIRST_PASS_CLOSURE_GATE_RECEIPT.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY
          fi

      - name: Disable auto-merge unless gate is proven green
        if: always() && steps.pr.outputs.number != '' && steps.gate.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          AUTO="$(printf '%s' "$PR_JSON" | jq -r 'if .auto_merge == null then "none" else "enabled" end')"
          if [ "$AUTO" = "enabled" ]; then
            NODE_ID="$(printf '%s' "$PR_JSON" | jq -r .node_id)"
            gh api graphql \
              -f query='mutation($id:ID!){disablePullRequestAutoMerge(input:{pullRequestId:$id}){pullRequest{number}}}' \
              -f id="$NODE_ID"
            echo "FPC_AUTO_MERGE_DISABLED=1"
          else
            echo "FPC_AUTO_MERGE_DISABLED=0"
          fi

      - name: Upload gate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-pass-closure-gate
          path: output/fpc/FIRST_PASS_CLOSURE_GATE_RECEIPT.json
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed unless every proof stage succeeded
        if: always()
        shell: bash
        env:
          PR_OUTCOME: ${{ steps.pr.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          set -euo pipefail
          test "$PR_OUTCOME" = "success"
          test "$CHECKOUT_OUTCOME" = "success"
          test "$TEST_OUTCOME" = "success"
          test "$GATE_OUTCOME" = "success"
          echo "First-Pass Closure Gate PASS."
