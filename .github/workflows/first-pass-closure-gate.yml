name: First-Pass Closure Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [master]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: read
  actions: read

jobs:
  first-pass-closure:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted gate implementation from default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Unit-test gate logic
        run: python -m unittest scripts/tests/test_first_pass_closure_gate.py

      - name: Resolve PR number
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request_target)
              echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              PR_NUMBER="${{ inputs.pr_number }}"
              test -n "$PR_NUMBER" || { echo "pr_number input required" >&2; exit 2; }
              echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "unsupported event" >&2
              exit 2
              ;;
          esac

      - name: Evaluate exact-head first-pass closure
        id: gate
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output/fpc
          python scripts/first_pass_closure_gate.py             --repo "${{ github.repository }}"             --pr "${{ steps.pr.outputs.number }}"             --policy mission-control/quality/FIRST_PASS_CLOSURE_POLICY_v1.json             --out output/fpc/FIRST_PASS_CLOSURE_GATE_RECEIPT.json

      - name: Disable auto-merge unless the evaluator succeeded
        if: always() && steps.gate.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          AUTO="$(printf '%s' "$PR_JSON" | jq -r 'if .auto_merge == null then "none" else "enabled" end')"
          if [ "$AUTO" = "enabled" ]; then
            NODE_ID="$(printf '%s' "$PR_JSON" | jq -r .node_id)"
            gh api graphql               -f query='mutation($id:ID!){disablePullRequestAutoMerge(input:{pullRequestId:$id}){pullRequest{number}}}'               -f id="$NODE_ID"
            echo "FPC_AUTO_MERGE_DISABLED=1"
          else
            echo "FPC_AUTO_MERGE_DISABLED=0"
          fi

      - name: Upload gate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-pass-closure-gate
          path: output/fpc/FIRST_PASS_CLOSURE_GATE_RECEIPT.json
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed unless the evaluator succeeded
        if: always() && steps.gate.outcome != 'success'
        run: |
          echo "First-Pass Closure Gate is RED; merge remains held."
          exit 1
