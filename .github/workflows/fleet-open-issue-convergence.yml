name: Fleet Open-Issue Convergence
on:
  pull_request:
    branches: [master]
    paths:
      - 'mission-control/historian/FLEET_OPEN_ISSUE_CONVERGENCE_CURRENT_v1.json'
      - 'mission-control/historian/validate_fleet_open_issue_convergence.py'
      - 'mission-control/qps-triage-ultra/missions/LM-10_W260_BD_CONVERGENCE_CURRENT_v1.yaml'
      - 'mission-control/qps-triage-ultra/missions/LM-10_MISSION_CONTROL_v3.yaml'
      - '.github/workflows/fleet-open-issue-convergence.yml'
  push:
    branches: [master]
    paths:
      - 'mission-control/historian/FLEET_OPEN_ISSUE_CONVERGENCE_CURRENT_v1.json'
      - 'mission-control/historian/validate_fleet_open_issue_convergence.py'
      - 'mission-control/qps-triage-ultra/missions/LM-10_W260_BD_CONVERGENCE_CURRENT_v1.yaml'
      - 'mission-control/qps-triage-ultra/missions/LM-10_MISSION_CONTROL_v3.yaml'
      - '.github/workflows/fleet-open-issue-convergence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Prove canonical W260 mutation fails closed
        run: |
          set -euo pipefail
          python mission-control/historian/validate_fleet_open_issue_convergence.py --self-test | tee fleet-mutation.out
          grep -q PASS_FLEET_W260_CANONICAL_BD_MUTATION fleet-mutation.out
      - name: Validate fleet compression
        run: |
          set -euo pipefail
          python mission-control/historian/validate_fleet_open_issue_convergence.py | tee fleet.out
          grep -q PASS_FLEET_OPEN_ISSUE_CONVERGENCE_94_31_0_63 fleet.out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fleet-open-issue-convergence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            fleet.out
            fleet-mutation.out
            mission-control/historian/FLEET_OPEN_ISSUE_CONVERGENCE_CURRENT_v1.json
          if-no-files-found: error
