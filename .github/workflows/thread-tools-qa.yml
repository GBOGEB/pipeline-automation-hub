name: Thread Tools Offline QA
on:
  pull_request:
    paths:
      - 'tools/threads/**'
      - 'mission-control/qps-triage-ultra/issue-expedition/triway_burndown.py'
      - 'mission-control/qps-triage-ultra/issue-expedition/test_triway_burndown.py'
      - '.github/workflows/thread-tools-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  thread-tools-offline:
    name: Thread tools offline Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: '3.11' }
          - { os: ubuntu-24.04, python: '3.12' }
          - { os: windows-2022, python: '3.12' }
    steps:
      - name: Checkout immutable candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Exact-head offline tests (thread tools + triway parser owner)
        shell: bash
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          python -W error::DeprecationWarning -m unittest discover -s tools/threads -p 'test_threads.py' -v
          python -m unittest discover -s mission-control/qps-triage-ultra/issue-expedition -p 'test_triway_burndown.py'
