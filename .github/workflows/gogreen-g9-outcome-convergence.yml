name: GOGREEN G9 Complete-Window Outcome Convergence
on:
  pull_request:
    paths:
      - 'mission-control/gogreen/outcome_convergence/**'
      - '.github/workflows/gogreen-g9-outcome-convergence.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: gogreen-g9-${{ github.ref }}
  cancel-in-progress: false
jobs:
  outcome-denominator:
    name: G9 full-population 57 run native metric testflight
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Native 49 positive and hostile tests with scoped branch instrumentation
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          python -m pip install --disable-pip-version-check 'coverage==7.13.3'
          mkdir -p "$RUNNER_TEMP/gogreen-g9"
          export COVERAGE_FILE="$RUNNER_TEMP/gogreen-g9/.coverage"
          python -m coverage run --branch \
            --include='*/mission-control/gogreen/outcome_convergence/outcome_flight.py' \
            -m unittest discover -s mission-control/gogreen/outcome_convergence/tests \
            -p 'test_outcome_flight.py' -v 2>&1 | tee "$RUNNER_TEMP/gogreen-g9/native_tests.log"
          python -m coverage json -o "$RUNNER_TEMP/gogreen-g9/coverage.json" -q
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'gogreen-g9'
          log=(p/'native_tests.log').read_text()
          if re.findall(r'Ran (\d+) tests? in',log)!=['49'] or '\nOK' not in log:
              raise SystemExit("G9 regression test denominator not achieved")
          c=json.loads((p/'coverage.json').read_text())
          key='mission-control/gogreen/outcome_convergence/outcome_flight.py'
          if c['meta']['branch_coverage'] is not True or c['meta']['version']!='7.13.3':
              raise SystemExit("wrong branch instrumentation")
          if list(c['files'])!=[key]:raise SystemExit('scope drift')
          s=c['files'][key]['summary']
          st=(s['covered_lines'],s['num_statements'])
          br=(s['covered_branches'],s['num_branches'])
          if min(st[1],br[1])<=0 or st[0]>st[1] or br[0]>br[1]:
              raise SystemExit("invalid coverage eligible denominator")
          if st[0]*100<85*st[1] or br[0]*100<80*br[1]:
              raise SystemExit("G9 scoped coverage below 85/80 ratchet")
          r={'schema':'gogreen.g9.focused-coverage.v1',
             'exact_head':os.environ['HEAD_SHA'],'tests_passed':49,
             'scope':key,'source_tool':'coverage==7.13.3',
             'statement_covered':st[0],'statement_eligible':st[1],
             'branch_covered':br[0],'branch_eligible':br[1],
             'whole_repo_coverage':None,'root_closures':0,'merge_authorized':False}
          (p/'native_coverage_receipt.json').write_text(json.dumps(r,sort_keys=True,indent=2)+'\n')
          print(json.dumps(r,sort_keys=True))
          PY
      - name: Compute complete cohort metric and typed SIPOC, hash every output
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python mission-control/gogreen/outcome_convergence/outcome_flight.py \
            --input mission-control/gogreen/outcome_convergence/samples/native_full_window_20261017.json \
            --out "$RUNNER_TEMP/gogreen-g9/generated" --source-sha "$HEAD_SHA"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          d=Path(os.environ['RUNNER_TEMP'])/'gogreen-g9'
          x=d/'generated'
          m=json.loads((x/'manifest.json').read_text())
          assert m['source_sha']==os.environ['HEAD_SHA']
          for name,expected in m['files'].items():
              assert hashlib.sha256((x/name).read_bytes()).hexdigest()==expected
          v=json.loads((x/'metrics.json').read_text())
          assert (v['total_native_runs'],v['native_terminal_success'],
                  v['native_terminal_failure'],v['native_terminal_cancelled'])==(57,46,10,1)
          assert v['independent_native_trials'] is None
          result={'schema':'gogreen.g9.native-output-receipt.v1',
                  'exact_head':os.environ['HEAD_SHA'],
                  'run_id':int(os.environ['RUN_ID']),
                  'attempt':int(os.environ['RUN_ATTEMPT']),
                  'manifest_sha256':hashlib.sha256((x/'manifest.json').read_bytes()).hexdigest(),
                  'artifact_bytes_verified_in_workflow':True,
                  'external_custody':False,'root_closure_credit':0,'merge_authorized':False}
          (d/'native_receipt.json').write_text(json.dumps(result,sort_keys=True,indent=2)+'\n')
          print(json.dumps(result,sort_keys=True))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: gogreen-g9-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/gogreen-g9/
          retention-days: 30
          if-no-files-found: warn
