name: MissionControl Temporal CONTROL Acceptance

on:
  pull_request:
    branches: [master]
    paths:
      - 'mission-control/qps-triage-ultra/crew/measured/frontier/temporal/CONTROL_POLICY_ACCEPTANCE_v1.json'
      - 'mission-control/qps-triage-ultra/crew/measured/frontier/temporal/validate_control_policy_acceptance.py'
      - 'mission-control/qps-triage-ultra/crew/measured/frontier/temporal/TEMPORAL_POLICY_CONFIG_v1.json'
      - '.github/workflows/crew-temporal-control-acceptance.yml'
  push:
    branches: [master]
    paths:
      - 'mission-control/qps-triage-ultra/crew/measured/frontier/temporal/CONTROL_POLICY_ACCEPTANCE_v1.json'
      - 'mission-control/qps-triage-ultra/crew/measured/frontier/temporal/validate_control_policy_acceptance.py'
      - 'mission-control/qps-triage-ultra/crew/measured/frontier/temporal/TEMPORAL_POLICY_CONFIG_v1.json'
      - '.github/workflows/crew-temporal-control-acceptance.yml'

permissions:
  contents: read

jobs:
  validate-control-acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source head
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
      - name: Validate bounded temporal CONTROL acceptance
        run: >-
          python mission-control/qps-triage-ultra/crew/measured/frontier/temporal/validate_control_policy_acceptance.py
          --receipt mission-control/qps-triage-ultra/crew/measured/frontier/temporal/CONTROL_POLICY_ACCEPTANCE_v1.json
          --config mission-control/qps-triage-ultra/crew/measured/frontier/temporal/TEMPORAL_POLICY_CONFIG_v1.json
