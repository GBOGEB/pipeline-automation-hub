name: Taxonomy N15 Full 11-module Coverage
on:
  pull_request:
    paths:
      - '.github/workflows/taxonomy-n15-11-module-coverage.yml'
      - 'mission-control/issue_rank/test_taxonomy_coverage_n15.py'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: taxonomy-n15-coverage-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  coverage:
    name: N15 11-module branch frontier (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact-source head check
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Eleven module source+branch coverage / no zero-covered files
        working-directory: mission-control/issue_rank
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check coverage==7.13.3
          python -m coverage run --branch \
            --source=title_taxonomy,taxonomy_pulse,taxonomy_explorer,taxonomy_metadata_plan,taxonomy_admission_audit,taxonomy_public_ingress,taxonomy_root_occurrence,taxonomy_dmaic_efficacy,taxonomy_slowburn_crew,taxonomy_peer_confidence,taxonomy_successor_audit \
            -m unittest -v test_title_taxonomy test_taxonomy_pulse test_taxonomy_explorer \
            test_taxonomy_metadata_plan test_taxonomy_admission_audit test_taxonomy_public_ingress \
            test_taxonomy_root_occurrence test_taxonomy_dmaic_efficacy \
            test_taxonomy_slowburn_crew test_taxonomy_peer_confidence \
            test_taxonomy_successor_audit test_taxonomy_coverage_n15
          python -m coverage report --fail-under=75
          python -m coverage json -o coverage-n15.json
          python - <<'PY'
          import json
          data=json.load(open("coverage-n15.json",encoding="utf-8"))
          expected={
              "title_taxonomy.py","taxonomy_pulse.py","taxonomy_explorer.py",
              "taxonomy_metadata_plan.py","taxonomy_admission_audit.py",
              "taxonomy_public_ingress.py","taxonomy_root_occurrence.py",
              "taxonomy_dmaic_efficacy.py","taxonomy_slowburn_crew.py",
              "taxonomy_peer_confidence.py","taxonomy_successor_audit.py"}
          files=data["files"]
          assert set(files)==expected, ("MODULE_ROSTER_DRIFT",sorted(files),sorted(expected))
          zero=[path for path,v in files.items() if v["summary"]["covered_lines"]==0]
          assert not zero, ("ZERO_COVERED_FILES",zero)
          under=[(path,v["summary"]["percent_covered"]) for path,v in files.items()
                 if v["summary"]["percent_covered"] < 60]
          assert not under, ("PER_MODULE_BELOW_60",under)
          print("N15_SCOPE_COVERAGE",json.dumps({
            "scope_modules":len(files),"zero_covered_files":len(zero),
            "combined_percent":data["totals"]["percent_covered"],
            "per_module_percent":{p:round(x["summary"]["percent_covered"],2)
                                   for p,x in sorted(files.items())},
            "branch_instrumented":True,"formal_credit_delta":0},
            sort_keys=True))
          PY
