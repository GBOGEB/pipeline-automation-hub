name: Mission Control N3 Evidence Metrics

on:
  pull_request:
    paths:
      - 'mission-control/v2/n3_*.py'
      - 'mission-control/v2/g3p_live_*.py'
      - 'mission-control/v2/g3p_live_template.html'
      - 'mission-control/v2/test_g3p_live_dashboard.py'
      - 'mission-control/v2/test_n3_*.py'
      - 'mission-control/federation-atlas/CBD_GOLDEN_GRAPH_N3_20261017.json'
      - 'mission-control/federation-atlas/CBD_GOLDEN_GRAPH_N6_20261017.json'
      - 'mission-control/federation-atlas/G3A_N10_N12_FORECAST_20261017.json'
      - 'mission-control/federation-atlas/MC_G3A_PR620_NATIVE_CENSUS_20261017.json'
      - 'mission-control/federation-atlas/G3A_N10_N12_LOCAL_OBSERVATIONS_20261017.json'
      - '.github/workflows/mission-control-n3-evidence.yml'
  push:
    branches: [master]
    paths:
      - 'mission-control/v2/n3_*.py'
      - 'mission-control/v2/test_n3_*.py'
      - 'mission-control/federation-atlas/CBD_GOLDEN_GRAPH_N3_20261017.json'
      - 'mission-control/federation-atlas/CBD_GOLDEN_GRAPH_N6_20261017.json'
      - '.github/workflows/mission-control-n3-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-tests:
    name: N3 evidence Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned coverage
        run: python -m pip install --disable-pip-version-check coverage==7.13.3
      - name: Run bounded N3 unit, adversarial and CLI tests
        run: |
          python -m coverage run --branch --source=mission-control/v2 -m unittest discover -s mission-control/v2 -p 'test_n3_*.py' -v
          python -m coverage run --append --branch --source=mission-control/v2 -m unittest discover -s mission-control/v2 -p 'test_g3p_live_dashboard.py' -v
          python -m coverage json -o /tmp/n3-coverage.json
      - name: Require focused statement+branch coverage >= 80
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('/tmp/n3-coverage.json').read_text())['files']
          modules=('n3_continuation.py','n3_integrity.py','n3_metrics.py','n3_dashboard.py','n3_native_join.py','n3_wave_federation.py','g3p_live_dashboard.py')
          s=[v['summary'] for k,v in c.items() if Path(k).name in modules]
          assert len(s)==7, f'expected 7 exact source basenames, got {len(s)}'
          numerator=sum(x['covered_lines']+x['covered_branches'] for x in s)
          denominator=sum(x['num_statements']+x['num_branches'] for x in s)
          assert denominator>0
          pct=100*numerator/denominator
          print(f'FOCUSED_N3_STMT_BRANCH={pct:.2f}% ({numerator}/{denominator})')
          assert pct>=80, 'focused N3 changed-scope quality gate failed'
          branches=sum(x['covered_branches'] for x in s)
          branch_total=sum(x['num_branches'] for x in s)
          assert branch_total>0 and 100*branches/branch_total>=80, 'N3 branch coverage gate failed'
          print(f'FOCUSED_N3_BRANCH={branches}/{branch_total}')
          g3a_modules=('n3_continuation.py','n3_integrity.py','n3_metrics.py','n3_dashboard.py','n3_native_join.py','n3_wave_federation.py','n3_workflow_census.py','n3_g3a_assessment.py')
          g3a=[v['summary'] for k,v in c.items() if Path(k).name in g3a_modules]
          assert len(g3a)==8, f'expected 8 exact G3A source basenames, got {len(g3a)}'
          g3a_numerator=sum(x['covered_lines']+x['covered_branches'] for x in g3a)
          g3a_denominator=sum(x['num_statements']+x['num_branches'] for x in g3a)
          assert g3a_denominator>0
          g3a_pct=100*g3a_numerator/g3a_denominator
          print(f'FOCUSED_G3A_STMT_BRANCH={g3a_pct:.2f}% ({g3a_numerator}/{g3a_denominator})')
          assert g3a_pct>=80, 'focused G3A changed-scope quality gate failed'
          g3a_branches=sum(x['covered_branches'] for x in g3a)
          g3a_branch_total=sum(x['num_branches'] for x in g3a)
          assert g3a_branch_total>0 and 100*g3a_branches/g3a_branch_total>=80, 'G3A branch coverage gate failed'
          print(f'FOCUSED_G3A_BRANCH={g3a_branches}/{g3a_branch_total}')
          PY
      - name: Test G3P live N-index replay and fail-closed HTTP/SSE
        run: |
          python -m coverage run --branch --source=mission-control/v2 -m unittest discover -s mission-control/v2 -p 'test_g3p_live_dashboard.py' -v
          python -m coverage json -o /tmp/g3p-live-coverage.json
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('/tmp/g3p-live-coverage.json').read_text())['files']
          matches=[v['summary'] for k,v in c.items() if Path(k).name=='g3p_live_dashboard.py']
          assert len(matches)==1, 'source blob denominator not unique'
          x=matches[0]
          lp=100*x['covered_lines']/x['num_statements']
          bp=100*x['covered_branches']/x['num_branches']
          print(f'G3P_LIVE_STMT={x["covered_lines"]}/{x["num_statements"]} {lp:.2f}%')
          print(f'G3P_LIVE_BRANCH={x["covered_branches"]}/{x["num_branches"]} {bp:.2f}%')
          assert lp>=85 and bp>=80, 'G3P live focused coverage gate failed'
          PY
      - name: Produce source-bound audit, telemetry and HTML projection
        run: |
          mkdir -p /tmp/n3-evidence
          python mission-control/v2/n3_integrity.py mission-control/federation-atlas/CBD_GOLDEN_GRAPH_N3_20261017.json --out /tmp/n3-evidence/audit.json
          python mission-control/v2/n3_dashboard.py mission-control/federation-atlas/CBD_GOLDEN_GRAPH_N3_20261017.json --html /tmp/n3-evidence/index.html --metrics /tmp/n3-evidence/metrics.json
          cp /tmp/n3-coverage.json /tmp/n3-evidence/coverage.json
          python mission-control/v2/n3_workflow_census.py \
            mission-control/federation-atlas/MC_G3A_PR620_NATIVE_CENSUS_20261017.json \
            --out /tmp/n3-evidence/g3a-pr620-native-census.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/n3-evidence/g3a-pr620-native-census.json').read_text())
          m=x['metrics']
          assert m['workflow_runs_observed']==7 and m['reported_total_jobs_for_known_runs']==8
          assert m['queued_or_pending_workflows']['numerator']==7
          assert m['observed_queued_jobs']==8
          assert m['known_run_attempts']['numerator']==7
          assert m['observed_artifact_checks']==7
          assert m['queue_latency_p95_ms'] is None
          assert m['terminal_workflows']['numerator']==0
          assert m['successful_terminal_workflows']['pct'] is None
          assert x['native_exact_head_pass'] is False and x['merge_admission']=='HOLD'
          print('G3A_HISTORICAL_CENSUS=PASS; TESTED_NATIVE_HEAD=UNVERIFIED; ADMISSION=HOLD')
          python mission-control/v2/g3p_live_dashboard.py --ledgers \
            mission-control/federation-atlas/CBD_GOLDEN_GRAPH_N3_20261017.json \
            mission-control/federation-atlas/CBD_GOLDEN_GRAPH_N6_20261017.json \
            --out-dir /tmp/n3-evidence/live
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('/tmp/n3-evidence/live')
          x=json.loads((p/'g3p-lineage.json').read_text())
          manifest=json.loads((p/'g3p-manifest.json').read_text())
          assert len(x['nodes'])==6 and len(x['edges'])==5 and x['merge_admission']=='HOLD'
          assert x['metrics']['intervening_unproven_source_boundaries']==1
          assert x['metrics']['authenticated_native_pulse_receipts']==0
          assert all(hashlib.sha256((p/name).read_bytes()).hexdigest()==sha for name,sha in manifest['outputs_sha256'].items())
          html=(p/'g3p-lineage.html').read_text()
          assert 'id="reload"' in html and 'EventSource' in html and 'id="replay"' in html
          print('G3P_LIVE_N6_EXPORT=PASS; LINKAGE_VALIDATED; CI_ADMISSION_SEPARATE')
          PY
          python mission-control/v2/n3_wave_federation.py \
            --ledgers mission-control/federation-atlas/CBD_GOLDEN_GRAPH_N3_20261017.json mission-control/federation-atlas/CBD_GOLDEN_GRAPH_N6_20261017.json \
            --out-dir /tmp/n3-evidence
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/n3-evidence')
          g=json.loads((p/'g3p-lineage.json').read_text())
          assert g['metrics']['waves']==2 and g['metrics']['pulses']==6 and g['metrics']['edge_count']==5
          assert g['metrics']['intervening_unproven_source_boundaries']==1
          assert g['merge_admission']=='HOLD' and g['authority_transfer'] is False
          assert (p/'g3p-lineage.mmd').read_text().count('-.->')==1
          assert (p/'g3p-lineage.html').stat().st_size>1000
          print('G3P_DAG_SIPOC_PROJECTION=PASS; SOURCE_ANCESTRY=UNKNOWN; ADMISSION=HOLD')
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/n3-evidence')
          a=json.loads((p/'audit.json').read_text())
          m=json.loads((p/'metrics.json').read_text())
          assert a['issue_count']==0 and a['merge_admission']=='HOLD'
          assert m['metrics']['measurement_completeness']=={'numerator':0,'denominator':9,'fraction':0.0}
          assert m['metrics']['native_attested_receipts']['numerator']==0
          assert m['source_ledger_digest'] in (p/'index.html').read_text()
          assert m['authority_transfer'] is False
          print('N3_PROJECTION=PASS; ADMISSION=HOLD; STATISTICS=DEFER')
          PY
      - name: Upload read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n3-evidence-py${{ matrix.python-version }}
          path: /tmp/n3-evidence/
          if-no-files-found: warn
