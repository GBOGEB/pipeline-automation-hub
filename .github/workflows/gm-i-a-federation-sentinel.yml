name: GM-I-A Federation Sentinel

on:
  pull_request:
    branches: [master]
    paths:
      - 'mission-control/grand-missions/GM-I-A_FAST_HEAVY_FEDERATION_CONTROL_v0.1.yaml'
      - 'mission-control/grand-missions/GM-I-A_FAST_HEAVY_FEDERATION_TOPOLOGY_v0.1.json'
      - 'mission-control/grand-missions/validate_gm_i_a_federation_control.py'
      - '.github/workflows/gm-i-a-federation-sentinel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  federation-sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML
      - name: Validate exact federation graph and credit invariants
        run: python mission-control/grand-missions/validate_gm_i_a_federation_control.py
      - name: Bind sentinel receipt
        run: sha256sum mission-control/grand-missions/receipts/GM_I_A_FEDERATION_SENTINEL_RECEIPT.json | tee mission-control/grand-missions/receipts/GM_I_A_FEDERATION_SENTINEL_SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: gm-i-a-federation-sentinel-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            mission-control/grand-missions/receipts/GM_I_A_FEDERATION_SENTINEL_RECEIPT.json
            mission-control/grand-missions/receipts/GM_I_A_FEDERATION_SENTINEL_SHA256SUMS
          if-no-files-found: error
