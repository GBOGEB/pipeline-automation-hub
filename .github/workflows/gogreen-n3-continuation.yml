name: GOGREEN N3 Governed Three-Pulse Continuation
on:
  pull_request:
    paths:
      - 'mission-control/v2/MC_GLOSSARY_TAXONOMY_v2.json'
      - 'docs/governance/GOGREEN_CORE_INTENT_TAXONOMY_v1.md'
      - 'mission-control/gogreen/n3_continuation/**'
      - '.github/workflows/gogreen-n3-continuation.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: gogreen-n3-${{ github.ref }}
  cancel-in-progress: false
jobs:
  n3-contract:
    name: N3 bounded 3PSTAR and 3WSTAR native invariant qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Native 68 positive and adversarial N3 tests and focused branch/statement instrument
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p "$RUNNER_TEMP/gogreen-n3"
          python -m pip install --disable-pip-version-check 'coverage==7.13.3'
          export COVERAGE_FILE="$RUNNER_TEMP/gogreen-n3/.coverage"
          python -m coverage run --branch \
            --include='*/mission-control/gogreen/n3_continuation/protocol.py' \
            -m unittest discover \
            -s mission-control/gogreen/n3_continuation/tests \
            -p 'test_protocol.py' -v \
            2>&1 | tee "$RUNNER_TEMP/gogreen-n3/native_tests.log"
          python -m coverage json \
            -o "$RUNNER_TEMP/gogreen-n3/coverage.json" -q
          python - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          out=Path(os.environ["RUNNER_TEMP"])/"gogreen-n3"
          log=(out/"native_tests.log").read_text()
          if re.findall(r"Ran (\d+) tests? in",log)!=["68"] or "\nOK" not in log:
              raise SystemExit("N3 68-test native regression denominator not met")
          d=json.loads((out/"coverage.json").read_text())
          key="mission-control/gogreen/n3_continuation/protocol.py"
          if d["meta"]["version"]!="7.13.3" or d["meta"]["branch_coverage"] is not True:
              raise SystemExit("N3 coverage instrumentation/tool changed")
          if list(d["files"])!=[key]:
              raise SystemExit("N3 source scope drift or tests included in denominator")
          summary=d["files"][key]["summary"]
          lines=(summary["covered_lines"],summary["num_statements"])
          branches=(summary["covered_branches"],summary["num_branches"])
          if min(lines[1],branches[1])<=0 or lines[0]>lines[1] or branches[0]>branches[1]:
              raise SystemExit("N3 invalid statement/branch denominator")
          if 100*lines[0]<90*lines[1] or 100*branches[0]<85*branches[1]:
              raise SystemExit(f"N3 focused coverage below 90/85: {lines}, {branches}")
          vocab=json.loads(Path("mission-control/v2/MC_GLOSSARY_TAXONOMY_v2.json").read_text())
          if vocab["n3_continuation_extension"]["canonical_machine_tokens"]!={"three_pulses":"3PSTAR","three_waves":"3WSTAR","invoke":"N3_CONTINUE"}:
              raise SystemExit("N3 canonical vocabulary inconsistent")
          receipt={"schema":"codepurple.n3.native-qualification.v1",
              "exact_head_sha":os.environ["EXPECTED_SHA"],
              "native_run_id":int(os.environ["RUN_ID"]),
              "run_attempt":int(os.environ["RUN_ATTEMPT"]),
              "native_tests_executed_passed":68,
              "covered_statements":lines[0],"eligible_statements":lines[1],
              "covered_branches":branches[0],"eligible_branches":branches[1],
              "source_scope":key,"coverage_tool":"7.13.3",
              "federation_wide_adoption":None,"whole_repository_coverage":None,
              "native_proof_of_future_unsupervised_calls":False,
              "merge_authorized":False,"formal_root_closure_credit":0}
          path=out/"native_qualification.json"
          path.write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
          hashes={}
          for name in ["native_tests.log","coverage.json","native_qualification.json"]:
              hashes[name]=hashlib.sha256((out/name).read_bytes()).hexdigest()
          manifest={"schema":"codepurple.n3.native-manifest.v1",
                    "exact_head":receipt["exact_head_sha"],"run_id":receipt["native_run_id"],
                    "attempt":receipt["run_attempt"],"sha256":hashes,
                    "independent_external_archive_custody":False,
                    "merge_authorized":False}
          (out/"native_manifest.json").write_text(json.dumps(manifest,sort_keys=True,indent=2)+"\n")
          print(json.dumps(receipt,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gogreen-n3-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/gogreen-n3/
          retention-days: 30
          if-no-files-found: warn
