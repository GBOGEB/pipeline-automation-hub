name: MCEX-W1 01 stage-only factorial branch
on:
  pull_request:
    paths:
      - 'mission-control/side-missions/MCEX_W1/arm_01/**'
      - '.github/workflows/mcex-w1-01.yml'
permissions:
  contents: read
jobs:
  simulation-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Source checkout guard
        env:
          MCEX_EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$MCEX_EXACT_HEAD"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Run identical negative and factorial tests
        run: |
          set -euo pipefail
          node --test 'mission-control/side-missions/MCEX_W1/arm_01/test.mjs'
      - name: Emit exact-head candidate simulation receipt
        env:
          MCEX_EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node 'mission-control/side-missions/MCEX_W1/arm_01/emit.mjs' 'build/mcex/arm-01-receipt.json'
          node -e 'const fs=require("node:fs");const r=JSON.parse(fs.readFileSync("build/mcex/arm-01-receipt.json"));if(r.metrics.cases!==22||r.metrics.negative_cases!==20||r.metrics.false_green||r.metrics.git_writes||r.metrics.remote_writes||r.boundary.merge_admission!=="HOLD")process.exit(7);'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mcex-arm-01-${{ github.event.pull_request.head.sha }}
          path: build/mcex/
          if-no-files-found: warn
