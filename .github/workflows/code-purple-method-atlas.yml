          path: /tmp/code-purple-atlas/
          if-no-files-found: error

  publish-pages:
    name: Publish CODE PURPLE review site
    needs: render
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: missioncontrol-pages-publication
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download exact-run Atlas artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: code-purple-method-atlas-${{ github.sha }}
          path: ./atlas-artifact
      - name: Verify public hashes and checkout
        env:
          EXACT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path("atlas-artifact/pages").resolve()
          r=json.loads((root/"site-manifest.json").read_text())
          assert r["source_git_sha"]==os.environ["EXACT_SHA"]
          assert r["merge_authorized"] is False and r["qps_owner_decision"]=="DEFER"
          for rel,expected in r["public_files_sha256"].items():
              p=(root/rel).resolve()
              assert p.is_file() and root in p.parents
              assert hashlib.sha256(p.read_bytes()).hexdigest()==expected
          PY
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload sanitized Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./atlas-artifact/pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Checkout exact-main read-only Pages proof
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: publisher-source
      - name: Independent HTTP 200 and repeated hosted hash parity
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python publisher-source/mission-control/html_qa/hosted_pages_verify.py \
            --expected-dir ./atlas-artifact/pages \
            --base-url "$PAGES_URL" \
            --receipt ./g3p-hosted-parity.json \
            --repeat 2 --attempts 8 --wait 5
          test -s ./g3p-hosted-parity.json
      - name: Independent hosted Live Lossless repeated SHA proof
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python publisher-source/mission-control/v2/handoff/live_lossless/hosted_readback.py \
            --expected-dir ./atlas-artifact/pages \
            --base-url "$PAGES_URL" \
            --receipt ./live-lossless-hosted-parity.json \
            --repeat 2 --attempts 8 --wait 5
          test -s ./live-lossless-hosted-parity.json
      - name: Independent JADE N+2 served Pages exact-head SHA parity
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          EXACT_SHA: ${{ github.sha }}
        run: |
          python publisher-source/mission-control/jade_temple/tools/hosted_parity.py \
            --expected-dir ./atlas-artifact/pages \
            --base-url "$PAGES_URL" --head "$EXACT_SHA" \
            --receipt ./jade-hosted-parity.json \
            --repeat 2 --attempts 8 --wait 5
          test -s ./jade-hosted-parity.json
      - name: Preserve hosted Pages proof receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g3p-hosted-parity-${{ github.sha }}
          path: |
            ./g3p-hosted-parity.json
            ./live-lossless-hosted-parity.json
            ./jade-hosted-parity.json
          if-no-files-found: warn
