          python "$SRC/main.py" check --root .
          python "$SRC/main.py" build --root . \
            --out /tmp/code-purple-atlas/orchestration --head "$EXACT_SHA"
          python "$SRC/main.py" check --root . \
            --out /tmp/code-purple-atlas/orchestration --head "$EXACT_SHA"
          python "$SRC/browser_qa.py" --html /tmp/code-purple-atlas/orchestration/index.html \
            --out /tmp/code-purple-atlas/orchestration-qa --head "$EXACT_SHA"
      - name: Bind source-owned coverage-integrity view when present
        shell: bash
        env:
          EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          SRC=mission-control/federation-atlas
          if [ -e "$SRC/coverage_integrity.py" ] || \
             [ -e "$SRC/COVERAGE_INTEGRITY_OBSERVATIONS_v1.json" ] || \
             [ -e "$SRC/test_coverage_integrity.py" ]; then
            test -f "$SRC/coverage_integrity.py"
            test -f "$SRC/COVERAGE_INTEGRITY_OBSERVATIONS_v1.json"
            test -f "$SRC/test_coverage_integrity.py"
            python -m unittest discover -s mission-control/federation-atlas -p test_coverage_integrity.py -v
            python "$SRC/coverage_integrity.py" \
              --head "$EXACT_SHA" --out /tmp/code-purple-atlas/coverage-integrity
            python "$SRC/coverage_integrity.py" \
              --head "$EXACT_SHA" --out /tmp/code-purple-atlas/coverage-integrity \
              --verify-only
            echo "COVERAGE_INTEGRITY=SOURCE_BOUND_VIEW; authority=HOLD"
          else
            echo "COVERAGE_INTEGRITY=SOURCE_OWNER_NOT_YET_JOINED"
          fi
      - name: Build public review projection
        env:
          EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python mission-control/federation-atlas/pages_portal.py --atlas /tmp/code-purple-atlas --out /tmp/code-purple-atlas/pages --sha "$EXACT_SHA"
          test -s /tmp/code-purple-atlas/pages/site-manifest.json
      - name: W32 Global DoV three-viewport / status-overlay browser QA
        shell: bash
        env:
          EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [ -f "$GITHUB_WORKSPACE/scripts/ci/qa_trap.sh" ] && QA_TITLE="W32 Global DoV three-viewport / status-overlay browser QA" . "$GITHUB_WORKSPACE/scripts/ci/qa_trap.sh"
          set -euo pipefail
          python mission-control/federation-atlas/convergence_browser_qa.py \
            --html /tmp/code-purple-atlas/pages/convergence/index.html \
            --out /tmp/code-purple-atlas/convergence/browser_qa \
            --head "$EXACT_SHA"
          test -s /tmp/code-purple-atlas/convergence/browser_qa/qa_receipt.json
      - name: N3 responsive Plotly / SHA-bound Pages / control QA
        shell: bash
        env:
          EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [ -f "$GITHUB_WORKSPACE/scripts/ci/qa_trap.sh" ] && QA_TITLE="N3 responsive Plotly / SHA-bound Pages / control QA" . "$GITHUB_WORKSPACE/scripts/ci/qa_trap.sh"
          set -euo pipefail
          SRC=mission-control/federation-atlas/mission_rebuild
          python "$SRC/n3_browser_qa.py" \
            --head "$EXACT_SHA" \
            --source /tmp/code-purple-atlas/mission-rebuild \
            --public /tmp/code-purple-atlas/pages/mission-rebuild \
            --screens /tmp/code-purple-atlas/mission-rebuild/n3-screenshots \
            --out /tmp/code-purple-atlas/mission-rebuild/n3-html-qa.json
          test -s /tmp/code-purple-atlas/mission-rebuild/n3-html-qa.json
      - name: Mission Control W1 Playwright three-viewport DoV and Pages byte parity
        shell: bash
        env:
          EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          set +e
          python mission-control/federation-atlas/mission_rebuild/browser_qa.py \
            --source /tmp/code-purple-atlas/mission-rebuild \
            --portal /tmp/code-purple-atlas/pages/mission-rebuild \
            --sha "$EXACT_SHA" \
            --out /tmp/code-purple-atlas/mission-rebuild/w1-browser-qa.json \
            --screens /tmp/code-purple-atlas/mission-rebuild/browser-screens 2>&1 | tee "$RUNNER_TEMP/qa-w1-browser-qa.log"
          rc=${PIPESTATUS[0]}; set -e
          if [ "$rc" -ne 0 ]; then
            msg=$(grep -E "Error|assert|require|FAIL|mismatch|parity" "$RUNNER_TEMP/qa-w1-browser-qa.log" | tail -n 3 | tr '\n' ' ' | cut -c1-900)
            echo "::error title=w1-browser-qa::${msg:-exit $rc (no assertion text captured)}"
            exit "$rc"
          fi
          test -s /tmp/code-purple-atlas/mission-rebuild/w1-browser-qa.json
      - name: W2 native Plotly responsive QA and Pages source/hash parity
        shell: bash
        env:
          EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          set +e
          python mission-control/federation-atlas/mission_rebuild/w2_browser_qa.py \
