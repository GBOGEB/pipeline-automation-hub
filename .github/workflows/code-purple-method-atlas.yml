          cp -r mission-control/qps-triage-ultra/p-process/site /tmp/code-purple-atlas/p-process
      - name: W32 Global DoV source-locked hub / local-scope branch coverage
        shell: bash
        env:
          EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          SRC=mission-control/federation-atlas
          mkdir -p /tmp/code-purple-atlas/convergence
          python -m pip install --disable-pip-version-check coverage==7.13.3
          python -m coverage run --branch --source=convergence_hub -m unittest discover \
            -s "$SRC" -p 'test_convergence_hub.py' -v > "$RUNNER_TEMP/convergence-hub-tests.log" 2>&1
          cat "$RUNNER_TEMP/convergence-hub-tests.log"
          python -m coverage json -q -o /tmp/code-purple-atlas/convergence/w32_coverage.json
          cp "$RUNNER_TEMP/convergence-hub-tests.log" /tmp/code-purple-atlas/convergence/w32_tests.log
          python "$SRC/convergence_hub.py" --source "$SRC/CONVERGENCE_HUB_SOURCES_W32.json" \
            --out /tmp/code-purple-atlas/convergence --head "$EXACT_SHA"
          python "$SRC/convergence_hub.py" --out /tmp/code-purple-atlas/convergence \
            --head "$EXACT_SHA" --verify-only
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          root=Path("/tmp/code-purple-atlas/convergence")
          log=(root/"w32_tests.log").read_text()
          found=[int(n) for n in re.findall(r"Ran (\d+) tests? in",log)]
          assert len(found)==1 and found[0]>=15 and "\nOK" in log, "W32_NATIVE_TEST_COUNT_OR_FAILURE"
          c=json.loads((root/"w32_coverage.json").read_text())["totals"]
          assert c["num_statements"]>0 and c["num_branches"]>0
          l=json.loads((root/"ledger.json").read_text())
          assert l["presentation_head"]==os.environ["EXACT_SHA"]
          assert l["populations"]["canonical_federation"]["eligible"]==42
          assert l["kpis"]["coverage_rollup_global"] is None
          assert l["authority"]["merge_admission"]=="HOLD"
          print(json.dumps({"w32_tests":found[0],
                            "scope":"CONVERGENCE_HUB_MODULE_ONLY",
                            "statements":[c["covered_lines"],c["num_statements"]],
                            "branches":[c["covered_branches"],c["num_branches"]],
                            "cross_repository_coverage_credit":False},sort_keys=True))
          PY
      - name: W34 source-bound Superstitch / DOW TESTFLIGHT and visual QA
        shell: bash
        env:
          EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [ -f "$GITHUB_WORKSPACE/scripts/ci/qa_trap.sh" ] && QA_TITLE="W34 source-bound Superstitch / DOW TESTFLIGHT and visual QA" . "$GITHUB_WORKSPACE/scripts/ci/qa_trap.sh"
          set -euo pipefail
          SRC=mission-control/federation-atlas/superstitch
          python "$SRC/testflight.py" --mode pr --expected-head "$EXACT_SHA" --browser \
            --out "$RUNNER_TEMP/w34-testflight"
          mkdir -p /tmp/code-purple-atlas/superstitch
          cp "$RUNNER_TEMP/w34-testflight/site/"* /tmp/code-purple-atlas/superstitch/
          cp "$RUNNER_TEMP/w34-testflight/home_testflight_receipt.json" \
            /tmp/code-purple-atlas/w34-home-testflight-receipt.json
          python "$SRC/build.py" --head "$EXACT_SHA" \
            --out /tmp/code-purple-atlas/superstitch --verify-only
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          for VIEW in desktop mobile; do
            python "$SRC/visual_pattern_scanner.py" \
              --image "$RUNNER_TEMP/w34-testflight/browser/$VIEW.png" \
              --out "/tmp/code-purple-atlas/w34-$VIEW-pattern.json"
          done
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path("/tmp/code-purple-atlas/superstitch")
          m=json.loads((root/"manifest.json").read_text())
          t=json.loads((Path(os.environ["RUNNER_TEMP"])/"w34-testflight"/"home_testflight_receipt.json").read_text())
          b=json.loads((Path(os.environ["RUNNER_TEMP"])/"w34-testflight"/"browser"/"browser_qa_receipt.json").read_text())
          assert m["presentation_head"]==os.environ["EXACT_SHA"]
          assert m["run_dispatch"] is False and m["merger_admission"]=="HOLD"
          assert t["qualification"]=="LOCAL_ONLY_NOT_GITHUB_NATIVE"
          assert t["status"]=="PASS_LOCAL_PR_REPRODUCTION"
          assert len(b["checks"])==3 and all(x["interactions"]=="PASS"
               and x["page_errors"]==0 and x["document_horizontal_overflow_px"]==0
               for x in b["checks"])
          assert len(m["member_sha256"])==16
          print(json.dumps({"W34_SUPERSTITCH":"LOCAL_REPRO_ON_NATIVE_RUNNER",
            "presentation_head":m["presentation_head"],"members":len(m["member_sha256"]),
            "viewports":len(b["checks"]),"native_owner_acceptance":None,
            "merge_admission":"HOLD"},sort_keys=True))
          PY
      - name: Build source-bound execution Atlas and validate every output member
        shell: bash
        env:
          EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [ -f "$GITHUB_WORKSPACE/scripts/ci/qa_trap.sh" ] && QA_TITLE="Build source-bound execution Atlas and validate every output member" . "$GITHUB_WORKSPACE/scripts/ci/qa_trap.sh"
          set -euo pipefail
