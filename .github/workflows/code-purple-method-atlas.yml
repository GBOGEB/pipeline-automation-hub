name: CODE PURPLE Method Atlas (read-only)
on:
  pull_request:
    paths:
      - 'mission-control/qps-triage-ultra/p-process/site/**'
      - 'mission-control/federation-atlas/**'
      - 'mission-control/jade_temple/**'
      - 'mission-control/html_qa/**'
      - 'mission-control/v2/handoff/live_lossless/**'
      - 'mission-control/grand-missions/GM_DMAIC_EVOLUTION_T7_T14_T21_v1.json'
      - 'mission-control/grand-missions/GM_DMAIC_COVERAGE_TELEMETRY_v1.json'
      - 'mission-control/grand-missions/GM-I-A_FAST_HEAVY_FEDERATION_TOPOLOGY_v0.1.json'
      - 'scripts/zero_test_gate_audit.py'
      - '.github/workflows/code-purple-method-atlas.yml'
  push:
    branches: [master]
    paths:
      - 'mission-control/qps-triage-ultra/p-process/site/**'
      - 'mission-control/federation-atlas/**'
      - 'mission-control/jade_temple/**'
      - 'mission-control/html_qa/**'
      - 'mission-control/v2/handoff/live_lossless/**'
      - 'mission-control/v2/MC_MISSION_STATUS_CURRENT_v1.json'
      - 'mission-control/grand-missions/GM_DMAIC_EVOLUTION_T7_T14_T21_v1.json'
      - 'mission-control/grand-missions/GM_DMAIC_COVERAGE_TELEMETRY_v1.json'
      - 'mission-control/grand-missions/GM-I-A_FAST_HEAVY_FEDERATION_TOPOLOGY_v0.1.json'
      - 'scripts/zero_test_gate_audit.py'
      - '.github/workflows/code-purple-method-atlas.yml'
  workflow_dispatch:
    inputs:
      method:
        type: choice
        description: "Observed method pulse, not automatic promotion"
        options: [ALL, SIPOC, DAG, DMAIC, '3P*', MIP, PCA, BT, LDAB]
        default: ALL
      stage:
        type: string
        description: "Registered method stage (optional)"
        required: false
      history_refresh:
        type: boolean
        description: "Opt-in read-only merged PR historical run recensus (no mutation)"
        default: false
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-latest
    # Same-PR/ref rebuilds share one render slot. This is not a fleet-wide
    # capacity claim; the local broker separately bounds generator workers.
    concurrency:
      group: method-atlas-render-${{ github.event.pull_request.number || github.ref }}
      queue: max
      cancel-in-progress: false
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert checkout identity
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned YAML parser
        run: python -m pip install pyyaml==6.0.3
      - name: Install pinned offline Plotly for MissionControl W2
        run: python -m pip install --disable-pip-version-check plotly==6.5.2
      - name: Contract and Doctor routing tests
        run: python -m unittest discover -s mission-control/federation-atlas -p "test_*.py" -v
      - name: CODE PURPLE series must match this tree (append an entry per closed iteration)
        run: python mission-control/federation-atlas/code_purple_series.py check
      - name: Build CODE PURPLE control page
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python mission-control/federation-atlas/build_code_purple.py --out /tmp/code-purple-atlas
      - name: Build method-aware read-only dashboard
        env:
          SELECTED_METHOD: ${{ inputs.method || 'ALL' }}
          SELECTED_STAGE: ${{ inputs.stage || '' }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$SELECTED_METHOD" = "ALL" ]; then
            python mission-control/federation-atlas/build_atlas.py --out /tmp/code-purple-atlas
          elif [ -z "$SELECTED_STAGE" ]; then
            python mission-control/federation-atlas/build_atlas.py --method "$SELECTED_METHOD" --out /tmp/code-purple-atlas
          else
            python mission-control/federation-atlas/build_atlas.py --method "$SELECTED_METHOD" --stage "$SELECTED_STAGE" --out /tmp/code-purple-atlas
          fi
      - name: Build Mission Control W1 repo/graph explorer
        shell: bash
        env:
          EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python -m unittest discover -s mission-control/federation-atlas/mission_rebuild -p 'test_*.py' -v
          python mission-control/federation-atlas/mission_rebuild/build.py --source-sha "$EXACT_SHA" --out /tmp/code-purple-atlas/mission-rebuild
          test -s /tmp/code-purple-atlas/mission-rebuild/manifest.json
      - name: Capture bounded native W1 and gg_MATH read-only statuses
        shell: bash
        env:
          EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python mission-control/federation-atlas/mission_rebuild/w2_live_bridge.py \
            --head "$EXACT_SHA" \
            --out /tmp/code-purple-atlas/mission-rebuild/evidence.json
          python mission-control/federation-atlas/mission_rebuild/w2_plotly.py \
            --snapshot /tmp/code-purple-atlas/mission-rebuild/evidence.json \
            --out /tmp/code-purple-atlas/mission-rebuild
          test -s /tmp/code-purple-atlas/mission-rebuild/evidence-manifest.json
      - name: N3 bounded native historical queue KPI / REX projection
        shell: bash
        env:
          EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SRC=mission-control/federation-atlas/mission_rebuild
          python "$SRC/n3_kpi_bridge.py" --head "$EXACT_SHA" \
            --native-readonly --out /tmp/code-purple-atlas/mission-rebuild
          test -s /tmp/code-purple-atlas/mission-rebuild/n3-metrics.json
          test -s /tmp/code-purple-atlas/mission-rebuild/n3-manifest.json
      - name: "CPQ N5: source-bound convergence + disjoint test-coverage receipt"
        env:
          EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          SRC=mission-control/federation-atlas
          python -m pip install --disable-pip-version-check coverage==7.13.3
          python -m coverage run --branch --source=cpq_convergence_n5,source_freshness -m unittest discover \
            -s mission-control/federation-atlas -p "test_cpq_convergence_n5.py" -v
          python -m coverage json -o /tmp/code-purple-atlas/cpq-n5-coverage.json -q
          python "$SRC/cpq_convergence_n5.py" \
            --queue "$SRC/CODE_PURPLE_BD_QUEUE_v1.json" \
            --top7 "$SRC/TOP7_CENSUS_PULSES_v1.json" \
            --head "$EXACT_SHA" --out /tmp/code-purple-atlas
          python - <<'PY'
          import json,os
          from pathlib import Path
          out=Path('/tmp/code-purple-atlas')
          r=json.loads((out/'cpq-n5.json').read_text())
          c=json.loads((out/'cpq-n5-coverage.json').read_text())
          t=c['totals']
          assert r['source']['exact_master_sha']==os.environ['EXACT_SHA']
          q=json.loads(Path('mission-control/federation-atlas/CODE_PURPLE_BD_QUEUE_v1.json').read_text())
          rows=len(q['items'])
          assert rows>=18 and r['metrics']['canonical_rows']==rows
          assert r['metrics']['open']+r['metrics']['done']==rows
          assert r['metrics']['work_orders_with_routes']==r['metrics']['open']
          assert r['admission']=='HOLD' and r['formal_credit_delta']==0
          assert r['metrics']['accepted_causal_root_closures'] is None
          assert r['top7']['matched_fleet_delta'] is None
          assert t['covered_lines']>0 and t['num_branches']>0
          assert t['percent_statements_covered']>=90
          assert t['percent_branches_covered']>=90
          print('CPQ_N5_FOCUSED_COVERAGE=PASS; scope=cpq_convergence_n5_only')
          PY
      - name: "CPQ N6: historical I2 job lineage and scoped coverage"
        shell: bash
        env:
          EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          SRC=mission-control/federation-atlas
          python -m coverage run --branch --source=cpq_i2_replay -m unittest discover -s mission-control/federation-atlas -p "test_cpq_i2_replay.py" -v
          python -m coverage json -q -o /tmp/code-purple-atlas/cpq-n6-i2-coverage.json
          python "$SRC/cpq_i2_replay.py" \
            --input "$SRC/CPQ_I2_NATIVE_READBACK_20261017.json" \
            --out /tmp/code-purple-atlas/cpq-n6-i2-historical.json \
            --head "$EXACT_SHA"
          python - <<'PY'
          import json,os
          from pathlib import Path
          out=Path('/tmp/code-purple-atlas')
          r=json.loads((out/'cpq-n6-i2-historical.json').read_text())
          c=json.loads((out/'cpq-n6-i2-coverage.json').read_text())['totals']
          assert r['consumer_source_sha']==os.environ['EXACT_SHA']
          assert (r['native_run_count'],r['distinct_heads'],r['paired_e2e_quality_success_runs'])==(3,3,2)
          assert r['paired_success_run_ids']==[36336861952,36420226456]
          assert r['i2_canonical_control_handoff'] is None
          assert r['cpq013_max_unchanged_root_auto_repeat_after_control'] is None
          assert r['cpq013_eligible_denominator'] is None
          assert r['accepted_causal_root_closures'] is None
          assert r['admission']=='HOLD'
          assert c['num_statements']>0 and c['num_branches']>0
          assert c['percent_statements_covered']>=90 and c['percent_branches_covered']>=90
          print('CPQ_N6_I2_NATIVE=PASS; COVERAGE=FOCUSED_ONLY; CONTROL=HOLD')
          PY
      - name: "CPQ N5: native browser/SVG seeded-negative visual proof"
        shell: bash
        run: |
          [ -f "$GITHUB_WORKSPACE/scripts/ci/qa_trap.sh" ] && QA_TITLE="CPQ N5: native browser/SVG seeded-negative visual proof" . "$GITHUB_WORKSPACE/scripts/ci/qa_trap.sh"
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
          python mission-control/federation-atlas/cpq_browser_check.py \
            --atlas /tmp/code-purple-atlas/code-purple.html \
            --cpq /tmp/code-purple-atlas/cpq-n5.html \
            --report /tmp/code-purple-atlas/cpq-n5.json \
            --out /tmp/code-purple-atlas/cpq-browser
          test -s /tmp/code-purple-atlas/cpq-browser/browser_receipt.json
      - name: Build CODE-HEALTH Central with exact-checkout and fail-closed corpus
        env:
          EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python mission-control/federation-atlas/central/code_health.py \
            --exact-git-sha "$EXACT_SHA" --out /tmp/code-purple-atlas
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          out=Path("/tmp/code-purple-atlas")
          source=Path("mission-control/federation-atlas/central/CODE_HEALTH_CENTRAL_v1.json")
          m=json.loads((out/"code-health-manifest.json").read_text())
          report=json.loads((out/"code-health.json").read_text())
          assert m["checkout_sha"]==report["checkout_sha"]==os.environ["EXACT_SHA"]
          assert m["source_sha256"]==hashlib.sha256(source.read_bytes()).hexdigest()
          assert m["admission"]==report["admission"]=="HOLD"
          assert m["merge_authorized"] is report["merge_authorized"] is False
          assert report["canonical_root_closures"] is None
          assert report["crew_auth_launches"] is None
          assert report["runner_capacity_slots"] is None
          assert (report["lane_count"],report["stage_count"])==(10,39)
          assert (report["graph_nodes"],report["graph_edges"])==(26,29)
          assert report["open_issues"]==143 and report["open_prs"]==68
          assert report["historical_runtime_cohorts"]==1
          assert report["historical_queue_job_samples"]==18
          # Historical native jobs are not currently free runner slots.
          assert report["runner_capacity_slots"] is None
          for name,digest in m["files_sha256"].items():
              assert hashlib.sha256((out/name).read_bytes()).hexdigest()==digest
          assert (out/"code-health.html").stat().st_size > 10000
          print(json.dumps({"checkout_sha":os.environ["EXACT_SHA"],
                            "code_health":"SOURCE_MATCHED_ARTIFACT",
                            "mode":"READ_ONLY","admission":"HOLD",
                            "authenticated_crew_launches":None},sort_keys=True))
          PY
      - name: Produce source-owned side-load inventory and Kubernetes proof ladder
        env:
          EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          SRC=mission-control/federation-atlas
          OUT=/tmp/code-purple-atlas
          python "$SRC/sideload_k8s.py" --out "$OUT"
          python "$SRC/sideload_telemetry.py" --out "$OUT"
          python "$SRC/build_sideload_operator.py" --out "$OUT" --telemetry "$OUT/sideload-telemetry.json"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          out=Path("/tmp/code-purple-atlas")
          source=Path("mission-control/federation-atlas")
          assert len(os.environ["EXACT_SHA"])==40
          inv=json.loads((out/"sideload-k8s.json").read_text())
          manifest=json.loads((out/"sideload-k8s.sha256.json").read_text())
          proof=json.loads((out/"sideload-operator-receipt.json").read_text())
          telemetry=json.loads((out/"sideload-telemetry.json").read_text())
          telehash=json.loads((out/"sideload-telemetry.sha256.json").read_text())
          operator=json.loads((source/"SIDELOAD_OPERATOR_CONTRACT_v1.json").read_text())
          src=json.loads((source/"SIDELOAD_K8S_SOURCE_v1.json").read_text())
          assert inv["repo_owners"]==3 and inv["source_surfaces"]==8
          assert {x["role"] for x in src["adapters"]}=={"QPS","KEB","DOW"}
          assert {x["id"] for x in operator["lanes"]}=={"QPS","KEB","DOW","MC"}
          assert inv["merge_admission"]==proof["admission"]=="HOLD"
          assert inv["authority_transfer"] is proof["authority_transfer"] is False
          assert inv["authenticated_runtime"] is None
          assert proof["native_cluster_receipt"] is None
          assert telemetry["source_run_id"]==38774568289 and telemetry["source_sha"]=="4d8240082f532c13d5cfb240747b04caed13e5bf"
          assert telemetry["metrics"]["restart_count"]==0
          assert telemetry["unbound"]["queue_p95_seconds"] is None
          assert telemetry["unbound"]["cpu_peak_millicores"] is None
          assert telemetry["qps_disposition"]==telehash["qps_disposition"]=="DEFER"
          assert telemetry["release"]==telehash["admission"]=="HOLD"
          assert hashlib.sha256((out/"sideload-telemetry.json").read_bytes()).hexdigest()==telehash["projection_sha256"]
          for name, digest in manifest["files"].items():
              assert hashlib.sha256((out/name).read_bytes()).hexdigest()==digest
          assert hashlib.sha256((out/"sideload-operator.html").read_bytes()).hexdigest()==proof["html_sha256"]
          assert hashlib.sha256((source/"SIDELOAD_OPERATOR_CONTRACT_v1.json").read_bytes()).hexdigest()==proof["source_sha256"]
          assert (out/"sideload-k8s.html").stat().st_size>1000
          assert (out/"sideload-operator.html").stat().st_size>1000
          print(json.dumps({"operator_status":"EXACT_HEAD_GENERATION_PASS","checkout_sha":os.environ["EXACT_SHA"],"source_rows":8,"repos":3,"admission":"HOLD","html_sha256":proof["html_sha256"]},sort_keys=True))
          PY
      - name: Flight Deck source-matched producer (single Atlas artifact, no Pages)
        env:
          EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          SRC=mission-control/federation-atlas/flightdeck
          FLEET=mission-control/gogreen/samples/fleet_g1.json
          OUT=/tmp/code-purple-atlas/flightdeck
          python -m pip install --disable-pip-version-check coverage==7.13.3
          python -m coverage run --branch --source=flightdeck -m unittest discover \
            -s mission-control/federation-atlas/flightdeck -p test_flightdeck.py -v > "$RUNNER_TEMP/flightdeck-tests.log" 2>&1
          cat "$RUNNER_TEMP/flightdeck-tests.log"
          python -m coverage json -o "$RUNNER_TEMP/flightdeck-coverage.json" -q
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          log=(Path(os.environ["RUNNER_TEMP"])/"flightdeck-tests.log").read_text()
          found=[int(x) for x in re.findall(r"Ran (\d+) tests? in",log)]
          if len(found)!=1 or found[0]<42 or "\nOK" not in log:
              raise SystemExit("FLIGHTDECK_ZERO_OR_FAILED_TESTS")
          c=json.loads((Path(os.environ["RUNNER_TEMP"])/"flightdeck-coverage.json").read_text())
          t=c["totals"]
          if c["meta"].get("version")!="7.13.3" or len(c["files"])!=1:
              raise SystemExit("FLIGHTDECK_SCOPE_OR_TOOL_DRIFT")
          if t["percent_statements_covered"]<95 or t["percent_branches_covered"]<90:
              raise SystemExit("FLIGHTDECK_FOCUSED_COVERAGE_BELOW_FLOOR")
          print(json.dumps({"status":"PASS","executed":found[0],"lines_pct":t["percent_statements_covered"],"branches_pct":t["percent_branches_covered"],"scope":"FOCUSED_FLIGHTDECK_MODULE","fleet_coverage_claim":False},sort_keys=True))
          PY
          python "$SRC/flightdeck.py" preflight --fleet "$FLEET" \
            --snapshot "$SRC/head_snapshot.json" --contract "$SRC/flightdeck_contract.json"
          python "$SRC/flightdeck.py" build --fleet "$FLEET" \
            --snapshot "$SRC/head_snapshot.json" --contract "$SRC/flightdeck_contract.json" \
            --out "$OUT" --exact-git-sha "$EXACT_SHA"
          # The HTML names four binary derivatives as plain text (pages_portal.py
          # never publishes binaries). Generate them here so they ride in the run artifact.
          python -m pip install --disable-pip-version-check \
            python-docx==1.2.0 openpyxl==3.1.5 reportlab==4.4.3
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/flightdeck-npm" 'pptxgenjs@3.12.0'
          export NODE_PATH="$RUNNER_TEMP/flightdeck-npm/node_modules"
          python "$SRC/office_export.py" --input "$OUT/census.json" --out "$OUT"
          for file in evidence_register.xlsx federation_report.docx mission_brief.pptx linked_evidence_book.pdf; do
            test -s "$OUT/$file"
          done
          python "$SRC/flightdeck.py" seal --out "$OUT"
          python "$SRC/flightdeck.py" verify --out "$OUT"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("/tmp/code-purple-atlas/flightdeck")
          c=json.loads((p/"census.json").read_text())
          m=json.loads((p/"manifest.json").read_text())
          assert c["exact_checkout_sha"]==m["exact_checkout_sha"]==os.environ["EXACT_SHA"]
          assert c["metrics"]["eligible_cells"]==42
          assert c["metrics"]["unobserved_cells"]==36
          assert c["merge_authorized"] is False
          for n in ("index.html","flightdeck.svg","bd_leaves.json","anchors.json","GUIDE.md"):
              assert (p/n).is_file() and (p/n).stat().st_size>0
          print("FLIGHTDECK_EXACT_SHA_ARTIFACT_INTEGRITY=PASS")
          PY
          cp "$RUNNER_TEMP/flightdeck-coverage.json" /tmp/code-purple-atlas/flightdeck-coverage.json
          cp "$RUNNER_TEMP/flightdeck-tests.log" /tmp/code-purple-atlas/flightdeck-tests.log
      - name: Roll up historical federation waves and method eligibility
        run: |
          python mission-control/federation-atlas/federation_pulse_rollup.py \
            --input mission-control/federation-atlas/FEDERATION_OBSERVED_PULSES_v1.json \
            --out /tmp/code-purple-atlas
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/code-purple-atlas/federation-wave-metrics.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          assert data["qps_owner_decision"] == "DEFER"
          assert data["native_cross_repo_chain_verified"] is None
          assert data["measured_coverage_breadth"]["eligible"] == 5
          with Path("/tmp/code-purple-atlas/federation-wave-summary.md").open(
                  "w", encoding="utf-8") as stream:
              stream.write("# Federation source-bound observation pulse\\n")
              stream.write(
                  "Measured coverage repositories: "
                  + str(data["measured_coverage_breadth"]["observed"])
                  + "/5 (NOT full fleet coverage)\\n"
              )
          PY
      - name: Add latest source-bound federation pulse on top of frozen history
        run: |
          python mission-control/federation-atlas/federation_latest_overlay.py \
            --status mission-control/federation-atlas/FEDERATION_STATUS_N2_v1.json \
            --history mission-control/federation-atlas/FEDERATION_OBSERVED_PULSES_v1.json \
            --out /tmp/code-purple-atlas
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/code-purple-atlas/federation-latest.json")
          result=json.loads(p.read_text(encoding="utf-8"))
          assert result["w70"]["state"] == "TERMINAL_FAIL"
          assert result["w70"]["line"] is None
          assert result["w70"]["branch"] is None
          assert result["qps_source_pulse"] == "P2"
          assert result["qps_engineering_decision"] == "DEFER"
          assert result["native_cross_repo_chain_verified"] is None
          assert (Path("/tmp/code-purple-atlas/federation-latest.html")
                  .stat().st_size > 1000)
          PY
      - name: Build read-only BD CHAR temporal pulse viewer
        run: |
          SRC=mission-control/federation-atlas/flightdeck/pulses
          python -m unittest discover -s mission-control/federation-atlas/flightdeck/pulses -p "test_bd_char_viewer.py" -v
          python "$SRC/bd_char_viewer.py" --source "$SRC/BD_CHAR_SFED_20261016_P2.json" --out /tmp/code-purple-atlas/bd-char
          test -s /tmp/code-purple-atlas/bd-char/index.html
          test -s /tmp/code-purple-atlas/bd-char/snapshot.json
          test -s /tmp/code-purple-atlas/bd-char/manifest.json
      - name: Verify merged PR chronology and bounded ancestry
        shell: bash
        run: |
          set -euo pipefail
          SRC=mission-control/federation-atlas/flightdeck/pulses
          python -m unittest discover -s mission-control/federation-atlas/flightdeck/pulses -p "test_pr_merge_temporal_viewer.py" -v
          python "$SRC/pr_merge_temporal_viewer.py" --source "$SRC/PR_MERGE_TEMPORAL_H1_20261016.json" --out /tmp/code-purple-atlas/pr-history
          test -s /tmp/code-purple-atlas/pr-history/index.html
          test -s /tmp/code-purple-atlas/pr-history/snapshot.json
          test -s /tmp/code-purple-atlas/pr-history/manifest.json
      - name: Backfill past merged PR runs and attempts (read-only)
        shell: bash
        env:
          LIVE_HISTORY: ${{ github.event_name == 'push' || inputs.history_refresh == true }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SRC=mission-control/federation-atlas/flightdeck/pulses
          python -m unittest discover -s mission-control/federation-atlas/flightdeck/pulses -p "test_pr_run_history_collect.py" -v
          options=()
          if [ "$LIVE_HISTORY" = "true" ]; then
            options+=(--live)
          fi
          python "$SRC/pr_run_history_collect.py" --source "$SRC/PR_MERGE_TEMPORAL_H1_20261016.json" --out /tmp/code-purple-atlas/pr-history/native-refresh.json "${options[@]}"
          test -s /tmp/code-purple-atlas/pr-history/native-refresh.json
      - name: Build P3 typed worker and IDE review (no dispatch)
        shell: bash
        run: |
          set -euo pipefail
          SRC=mission-control/federation-atlas/flightdeck/pulses/devkit
          python -m unittest discover -s mission-control/federation-atlas/flightdeck/pulses/devkit -p "test_worker_devkit.py" -v
          python -m unittest discover -s mission-control/federation-atlas/flightdeck/pulses/devkit -p "test_worker_viewer.py" -v
          python "$SRC/worker_viewer.py" --plan "$SRC/worker_plan.json" --observed "$SRC/OBSERVED_P3_20261016.json" --out /tmp/code-purple-atlas/worker-devkit
          test -s /tmp/code-purple-atlas/worker-devkit/index.html
          test -s /tmp/code-purple-atlas/worker-devkit/manifest.json
      - name: Build recursive SIPOC federation home from canonical source
        shell: bash
