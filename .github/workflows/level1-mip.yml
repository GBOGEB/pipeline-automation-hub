name: Level 1 MIP

on:
  pull_request:
    paths:
      - "LEVEL1.md"
      - "level1/**"
      - "skill/**"
      - ".github/workflows/level1-mip.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  level1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tested head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Compile Level-1 kernel
        run: python -m py_compile level1/runtime.py
      - name: Unit controls (analytic engines, census arithmetic, CLI contract)
        run: python -m unittest discover -s level1 -p 'test_*.py' -v
      - name: Execute census MIP and orchestration
        run: |
          python level1/runtime.py census
          python level1/runtime.py mip
          python level1/runtime.py orchestrate > level1-orchestration.json
      - name: Prove analytics fail closed without measured inputs
        run: |
          python level1/runtime.py pca
          python level1/runtime.py bt
      - name: Prove Level-1.0 and emit receipt
        run: python level1/runtime.py self-test | tee level1-receipt.json
      - name: Upload Level-1 receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: level1-mip-receipt
          path: |
            level1-receipt.json
            level1-orchestration.json
