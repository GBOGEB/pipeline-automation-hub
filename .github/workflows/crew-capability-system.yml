name: MissionControl Crew Capability System

on:
  pull_request:
    branches: [master]
    paths:
      - 'mission-control/qps-triage-ultra/crew/**'
      - '.github/workflows/crew-capability-system.yml'
  push:
    branches:
      - master
      - mission/crew-capability-system-v1-20260913
    paths:
      - 'mission-control/qps-triage-ultra/crew/**'
      - '.github/workflows/crew-capability-system.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-crew-system:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source head
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
      - name: Run crew validator regression tests
        run: |
          python -m unittest -v mission-control/qps-triage-ultra/crew/test_validate_crew_system.py
      - name: Validate Crew Registry Competency Matrix and REX Ledger
        run: |
          python mission-control/qps-triage-ultra/crew/validate_crew_system.py \
            | tee mission-control/qps-triage-ultra/crew/CREW_VALIDATION_RECEIPT.json
      - name: Enforce real execution evidence
        shell: bash
        run: |
          test -s mission-control/qps-triage-ultra/crew/CREW_VALIDATION_RECEIPT.json
          grep -q '"status": "PASS_CREW_SYSTEM"' mission-control/qps-triage-ultra/crew/CREW_VALIDATION_RECEIPT.json
      - name: Upload crew validation receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crew-capability-receipt-${{ github.event.pull_request.head.sha || github.sha }}
          path: mission-control/qps-triage-ultra/crew/CREW_VALIDATION_RECEIPT.json
