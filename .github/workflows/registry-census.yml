name: Registry Census (read-only)
# #529 G01: canonical registry + YAML tiers stay generator-consistent and retrievable.
on:
  pull_request:
    paths:
      - 'mission-control/registry/**'
      - '.github/workflows/registry-census.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5.1.0 (node24)
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Registry tests and tier retrieval
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pyyaml==6.0.3
          python -m unittest discover -s mission-control/registry -p 'test_*.py' -v
          for t in all.top_3 all.top_7 all.top_21 owned.top_14 all.bottom_7; do
            echo "## $t"; python mission-control/registry/census.py get mission-control/registry/REPO_TIERS.yaml "$t"
          done | tee -a "$GITHUB_STEP_SUMMARY"
