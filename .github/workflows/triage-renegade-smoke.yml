name: TRIAGE Renegade Smoke

on:
  pull_request:
    paths:
      - 'triage/renegade_incubator/**'
      - 'scripts/triage_renegade_smoke.py'
      - 'scripts/tests/test_triage_renegade_smoke.py'
      - '.github/workflows/triage-renegade-smoke.yml'
  push:
    branches:
      - 'triage/renegade-incubator-*'
    paths:
      - 'triage/renegade_incubator/**'
      - 'scripts/triage_renegade_smoke.py'
      - '.github/workflows/triage-renegade-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pyyaml
      - name: Negative controls (every fail-closed rule must fire)
        run: python -m unittest discover -s scripts/tests -p 'test_triage_renegade_smoke.py' -v
      - run: python scripts/triage_renegade_smoke.py
