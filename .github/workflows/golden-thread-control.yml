name: Golden Thread Control

on:
  pull_request:
    paths:
      - "mission-control/golden-thread/**"
      - ".github/workflows/golden-thread-control.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden-thread-control:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Golden Thread modules
        run: |
          python -m py_compile \
            mission-control/golden-thread/golden_thread.py \
            mission-control/golden-thread/checkpoint_replay.py \
            mission-control/golden-thread/rendition_family.py \
            mission-control/golden-thread/side_effect_receipts.py \
            mission-control/golden-thread/office_semantic_carrier.py

      - name: Run Golden Thread unit tests
        run: |
          python -m unittest discover \
            -s mission-control/golden-thread \
            -p 'test_*.py' \
            -v

      - name: Prove checkpoint replay equivalence
        working-directory: mission-control/golden-thread
        run: |
          python checkpoint_replay.py create \
            fixtures/COLD_TAIL_BOOTSTRAP_LEDGER_v1.json \
            GT-0012 \
            CP-COLD-TAIL-0012 \
            --created-at 2026-09-17T02:00:00Z \
            --out /tmp/golden-thread-checkpoint.json
          python checkpoint_replay.py verify \
            fixtures/COLD_TAIL_BOOTSTRAP_LEDGER_v1.json \
            /tmp/golden-thread-checkpoint.json
          python checkpoint_replay.py verify-equivalence \
            fixtures/COLD_TAIL_BOOTSTRAP_LEDGER_v1.json \
            /tmp/golden-thread-checkpoint.json

      - name: Prove rendition-family zero delta
        working-directory: mission-control/golden-thread
        run: |
          python golden_thread.py rebuild-current \
            fixtures/COLD_TAIL_BOOTSTRAP_LEDGER_v1.json \
            --out /tmp/golden-thread-truth.json
          python rendition_family.py render \
            /tmp/golden-thread-truth.json \
            /tmp/golden-thread-renditions
          python rendition_family.py verify \
            /tmp/golden-thread-truth.json \
            /tmp/golden-thread-renditions

      - name: Prove side-effect replay suppression and successor lineage
        working-directory: mission-control/golden-thread
        run: |
          python - <<'PY'
          import side_effect_receipts as sr

          intent = {
              "authority_domain": "GBOGEB/pipeline-automation-hub",
              "action": "GITHUB_ISSUE_COMMENT_CREATE",
              "target": "GBOGEB/pipeline-automation-hub#153",
              "mechanism": "REG",
              "source_state_digest": sr.digest({"projection": "k42"}),
              "payload_digest": sr.digest({"comment": "golden thread receipt"}),
              "schema_version": "github.issue_comment.v1",
              "expected_semantic_delta": "NONE_CONTROL_RECEIPT_ONLY",
          }
          registry = sr.empty_registry()
          first = sr.plan(registry, intent)
          assert first["emit_side_effect"] is True
          registry = sr.register_planned(registry, intent)
          replay = sr.plan(registry, intent)
          assert replay["decision"] == "REPLAY_EXISTING"
          assert replay["emit_side_effect"] is False

          changed = dict(intent)
          changed["payload_digest"] = sr.digest({"comment": "changed payload"})
          successor = sr.plan(registry, changed)
          assert successor["decision"] == "NEW_TRANSACTION"
          assert successor["changed_from_parent"] is True
          assert successor["parent_transaction_id"] == first["transaction_id"]
          print(sr.canonical_json({
              "status": "PASS",
              "first_transaction_id": first["transaction_id"],
              "replay_emit_side_effect": replay["emit_side_effect"],
              "successor_transaction_id": successor["transaction_id"],
              "authority_transfer": False,
          }))
          PY

      - name: Prove live GitHub receipt exact replay suppression
        working-directory: mission-control/golden-thread
        run: |
          python -m unittest -v \
            test_live_side_effect_receipt.LiveSideEffectReceiptTests.test_live_github_receipt_replays_without_duplicate_emission

      - name: Prove DOCX XLSX PPTX semantic carrier zero delta
        working-directory: mission-control/golden-thread
        run: |
          python -m unittest -v \
            test_office_semantic_carrier.OfficeSemanticCarrierTests.test_docx_xlsx_pptx_extract_same_canonical_truth \
            test_office_semantic_carrier.OfficeSemanticCarrierTests.test_unrelated_office_metadata_does_not_change_semantic_identity \
            test_office_semantic_carrier.OfficeSemanticCarrierTests.test_identical_reinjection_is_byte_preserving_replay \
            test_office_semantic_carrier.OfficeSemanticCarrierTests.test_truth_tamper_fails_closed
