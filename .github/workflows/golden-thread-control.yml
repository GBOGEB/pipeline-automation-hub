name: Golden Thread Control

on:
  pull_request:
    paths:
      - "mission-control/golden-thread/**"
      - ".github/workflows/golden-thread-control.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  golden-thread-control:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Golden Thread modules
        run: |
          python -m py_compile \
            mission-control/golden-thread/golden_thread.py \
            mission-control/golden-thread/checkpoint_replay.py \
            mission-control/golden-thread/checkpoint_registry.py \
            mission-control/golden-thread/rendition_family.py \
            mission-control/golden-thread/side_effect_receipts.py \
            mission-control/golden-thread/office_semantic_carrier.py \
            mission-control/golden-thread/github_roundtrip.py

      - name: Run Golden Thread unit tests
        run: |
          python -m unittest discover \
            -s mission-control/golden-thread \
            -p 'test_*.py' \
            -v

      - name: Prove checkpoint replay equivalence
        working-directory: mission-control/golden-thread
        run: |
          python checkpoint_replay.py create \
            fixtures/COLD_TAIL_BOOTSTRAP_LEDGER_v1.json \
            GT-0012 \
            CP-COLD-TAIL-0012 \
            --created-at 2026-09-17T02:00:00Z \
            --out /tmp/golden-thread-checkpoint.json
          python checkpoint_replay.py verify \
            fixtures/COLD_TAIL_BOOTSTRAP_LEDGER_v1.json \
            /tmp/golden-thread-checkpoint.json
          python checkpoint_replay.py verify-equivalence \
            fixtures/COLD_TAIL_BOOTSTRAP_LEDGER_v1.json \
            /tmp/golden-thread-checkpoint.json

      - name: Prove rendition-family zero delta
        working-directory: mission-control/golden-thread
        run: |
          python golden_thread.py rebuild-current \
            fixtures/COLD_TAIL_BOOTSTRAP_LEDGER_v1.json \
            --out /tmp/golden-thread-truth.json
          python rendition_family.py render \
            /tmp/golden-thread-truth.json \
            /tmp/golden-thread-renditions
          python rendition_family.py verify \
            /tmp/golden-thread-truth.json \
            /tmp/golden-thread-renditions

      - name: Prove side-effect replay suppression and successor lineage
        working-directory: mission-control/golden-thread
        run: |
          python - <<'PY'
          import side_effect_receipts as sr

          intent = {
              "authority_domain": "GBOGEB/pipeline-automation-hub",
              "action": "GITHUB_ISSUE_COMMENT_CREATE",
              "target": "GBOGEB/pipeline-automation-hub#153",
              "mechanism": "REG",
              "source_state_digest": sr.digest({"projection": "k42"}),
              "payload_digest": sr.digest({"comment": "golden thread receipt"}),
              "schema_version": "github.issue_comment.v1",
              "expected_semantic_delta": "NONE_CONTROL_RECEIPT_ONLY",
          }
          registry = sr.empty_registry()
          first = sr.plan(registry, intent)
          assert first["emit_side_effect"] is True
          registry = sr.register_planned(registry, intent)
          replay = sr.plan(registry, intent)
          assert replay["decision"] == "REPLAY_EXISTING"
          assert replay["emit_side_effect"] is False

          changed = dict(intent)
          changed["payload_digest"] = sr.digest({"comment": "changed payload"})
          successor = sr.plan(registry, changed)
          assert successor["decision"] == "NEW_TRANSACTION"
          assert successor["changed_from_parent"] is True
          assert successor["parent_transaction_id"] == first["transaction_id"]
          print(sr.canonical_json({
              "status": "PASS",
              "first_transaction_id": first["transaction_id"],
              "replay_emit_side_effect": replay["emit_side_effect"],
              "successor_transaction_id": successor["transaction_id"],
              "authority_transfer": False,
          }))
          PY

      - name: Prove live GitHub receipt exact replay suppression
        working-directory: mission-control/golden-thread
        run: |
          python -m unittest -v \
            test_live_side_effect_receipt.LiveSideEffectReceiptTests.test_live_github_receipt_replays_without_duplicate_emission

      - name: Prove DOCX XLSX PPTX semantic carrier zero delta
        working-directory: mission-control/golden-thread
        run: |
          python -m unittest -v \
            test_office_semantic_carrier.OfficeSemanticCarrierTests.test_docx_xlsx_pptx_extract_same_canonical_truth \
            test_office_semantic_carrier.OfficeSemanticCarrierTests.test_unrelated_office_metadata_does_not_change_semantic_identity \
            test_office_semantic_carrier.OfficeSemanticCarrierTests.test_identical_reinjection_is_byte_preserving_replay \
            test_office_semantic_carrier.OfficeSemanticCarrierTests.test_truth_tamper_fails_closed

      - name: Prove real GitHub commit tree blob seven-format round-trip
        working-directory: mission-control/golden-thread
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python golden_thread.py rebuild-current \
            fixtures/COLD_TAIL_BOOTSTRAP_LEDGER_v1.json \
            --out /tmp/golden-thread-p2-truth.json
          python github_roundtrip.py roundtrip \
            /tmp/golden-thread-p2-truth.json \
            --repo "${{ github.repository }}" \
            --source-sha "$SOURCE_SHA" \
            --timestamp "2026-09-17T02:05:00Z" \
            --out /tmp/golden-thread-p2-roundtrip-receipt.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/golden-thread-p2-roundtrip-receipt.json'))
          assert r['status']=='PASS'
          assert r['rendition_count']==7
          assert r['semantic_delta']==0
          assert r['unexplained_semantic_delta']==0
          assert r['ref_updated'] is False
          assert r['visual_fidelity_credit'] is False
          assert r['authority_transfer'] is False
          assert len(r['blob_shas'])==7
          print(json.dumps(r, sort_keys=True))
          PY

      - name: Prove checkpoint registry cadence selection and replay compatibility
        working-directory: mission-control/golden-thread
        run: |
          python - <<'PY'
          import json
          import checkpoint_registry as cr
          import checkpoint_replay as cpr

          ledger=json.load(open('fixtures/COLD_TAIL_BOOTSTRAP_LEDGER_v1.json'))
          policy=cr.cadence_policy(every_n_events=4)
          registry=cr.empty_registry(ledger, policy)

          d0=cr.cadence_decision(registry, ledger, policy, boundary='GT-0008')
          assert d0['status']=='DUE' and d0['reason']=='GENESIS_NO_CHECKPOINT'
          cp8=cpr.create_checkpoint(ledger,'GT-0008','CP-P3-0008',created_at='2026-09-17T02:08:00Z')
          registry,_=cr.register_checkpoint(registry,ledger,policy,cp8,trigger=d0['reason'],checkpoint_ref='CP-P3-0008.json')

          d1=cr.cadence_decision(registry,ledger,policy,boundary='GT-0011')
          assert d1['status']=='NOT_DUE'
          d2=cr.cadence_decision(registry,ledger,policy,boundary='GT-0012')
          assert d2['status']=='DUE' and d2['reason']=='EVENT_INTERVAL'
          cp12=cpr.create_checkpoint(ledger,'GT-0012','CP-P3-0012',created_at='2026-09-17T02:12:00Z')
          registry,_=cr.register_checkpoint(registry,ledger,policy,cp12,trigger=d2['reason'],checkpoint_ref='CP-P3-0012.json')

          dm=cr.cadence_decision(registry,ledger,policy,boundary='GT-0014',trigger='RELEASE_BOUNDARY')
          assert dm['status']=='DUE' and dm['reason']=='MILESTONE:RELEASE_BOUNDARY'
          cp14=cpr.create_checkpoint(ledger,'GT-0014','CP-P3-0014',created_at='2026-09-17T02:14:00Z')
          registry,_=cr.register_checkpoint(registry,ledger,policy,cp14,trigger='RELEASE_BOUNDARY',checkpoint_ref='CP-P3-0014.json')

          cr.verify_registry(registry,ledger,policy)
          s10=cr.select_checkpoint(registry,ledger,policy,boundary='GT-0010')
          scur=cr.select_checkpoint(registry,ledger,policy)
          assert s10['checkpoint']['checkpoint_id']=='CP-P3-0008'
          assert scur['checkpoint']['checkpoint_id']=='CP-P3-0014'
          assert cpr.verify_replay_equivalence(ledger,cp8,'GT-0010')['status']=='PASS'
          assert cpr.verify_replay_equivalence(ledger,cp14)['status']=='PASS'
          repeat=cr.cadence_decision(registry,ledger,policy,boundary='GT-0014',trigger='RELEASE_BOUNDARY')
          assert repeat['status']=='NOT_DUE' and repeat['reason']=='ALREADY_CHECKPOINTED'
          print(json.dumps({
            'status':'PASS',
            'checkpoint_count':len(registry['entries']),
            'registry_digest':registry['registry_digest'],
            'selected_as_of_GT_0010':s10['checkpoint']['checkpoint_id'],
            'selected_current':scur['checkpoint']['checkpoint_id'],
            'duplicate_boundary_suppressed':True,
            'wall_clock_cadence_authoritative':False,
            'visual_fidelity_credit':False,
            'authority_transfer':False,
          },sort_keys=True))
          PY
