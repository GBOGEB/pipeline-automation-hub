name: GM-I-B Cycle3 3P3 Content-Address Relay Proof

on:
  pull_request:
    branches: [master]
    paths:
      - 'mission-control/grand-missions/evidence_mirror/QPS_W264_3P3_TEMPORAL_PCA_PROPAGATION_CHILD_RECEIPT_v1.json'
      - 'mission-control/grand-missions/GM_I_B_CYCLE3_QPS_CONTENT_ADDRESS_RELAY_v1.json'
      - 'mission-control/grand-missions/validate_gm_i_b_cycle3_propagation_proof.py'
      - '.github/workflows/gm-i-b-cycle3-propagation-proof-relay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aggregate-proof-relay:
    runs-on: ubuntu-latest
    env:
      EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      QPS_BLOB: 7be807efcd8c737addfc25cc45b50565d691d9b1
      QPS_RELAY: mission-control/grand-missions/evidence_mirror/QPS_W264_3P3_TEMPORAL_PCA_PROPAGATION_CHILD_RECEIPT_v1.json
    steps:
      - name: Checkout literal MissionControl relay head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
      - name: Verify literal relay head
        run: test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
      - name: Prove QPS source-relay byte identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git hash-object "$QPS_RELAY")"
          echo "expected=$QPS_BLOB"
          echo "actual=$actual"
          test "$actual" = "$QPS_BLOB"
          python - <<'PY'
          import json, os
          from pathlib import Path
          relay=json.loads(Path('mission-control/grand-missions/GM_I_B_CYCLE3_QPS_CONTENT_ADDRESS_RELAY_v1.json').read_text())
          assert relay['source']['git_blob_sha1']==os.environ['QPS_BLOB']
          assert relay['relay']['git_blob_sha1']==os.environ['QPS_BLOB']
          assert relay['relay']['byte_identity']=='PASS_SAME_GIT_BLOB'
          assert relay['proof_rule']['authority_transfer'] is False
          assert relay['proof_rule']['formal_credit_delta']==0
          assert relay['proof_rule']['hard_gate_compensation_allowed'] is False
          print('PASS_QPS_CONTENT_ADDRESS_RELAY')
          PY
      - name: Fetch immutable public Cycle3 evidence and bind local QPS relay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mission-control/grand-missions/generated/input
          curl --fail --location https://raw.githubusercontent.com/GBOGEB/pipeline-automation-hub/3348189fd52883befb24f5c5b6bb3953cd8725ab/mission-control/grand-missions/GM_I_B_CYCLE3_PROPAGATION_CONTRACT_v1.json --output mission-control/grand-missions/generated/input/contract.json
          curl --fail --location https://raw.githubusercontent.com/GBOGEB/CODEX/bd1fb697e6aa86ebc077b92015201ad512728a13/ssot/bridge_rows/gg_math_temporal_pca_w4_p31_knowledge_atom.json --output mission-control/grand-missions/generated/input/atom.json
          curl --fail --location https://raw.githubusercontent.com/GBOGEB/CoolProp/0c645ac28ac73e1873268a3f6f505aaeffb41a8d/qps/recon/GM_I_B_CYCLE3_TEMPORAL_PCA_6D_ADAPTER_RECEIPT_v1.json --output mission-control/grand-missions/generated/input/coolprop.json
          cp "$QPS_RELAY" mission-control/grand-missions/generated/input/qps.json
          test "$(git hash-object mission-control/grand-missions/generated/input/qps.json)" = "$QPS_BLOB"
      - name: Recompute full Cycle3 exit predicate
        run: |
          python mission-control/grand-missions/validate_gm_i_b_cycle3_propagation_proof.py \
            --contract mission-control/grand-missions/generated/input/contract.json \
            --atom mission-control/grand-missions/generated/input/atom.json \
            --coolprop mission-control/grand-missions/generated/input/coolprop.json \
            --qps mission-control/grand-missions/generated/input/qps.json \
            --out mission-control/grand-missions/generated/GM_I_B_CYCLE3_PROPAGATION_PROOF_v1.json
      - name: Enforce frozen Cycle3 KPI vector
        run: |
          python - <<'PY'
          import json, os
          r=json.load(open('mission-control/grand-missions/generated/GM_I_B_CYCLE3_PROPAGATION_PROOF_v1.json'))
          assert r['status']=='PASS_3P3_PROPAGATION_PROOF'
          assert r['cycle3_state_candidate']=='CONTROL'
          assert r['source_head']==os.environ['EXACT_HEAD']
          k=r['kpi']
          assert (k['propagation_coverage']['numerator'],k['propagation_coverage']['denominator'],k['propagation_coverage']['value'])==(3,3,1.0)
          assert (k['semantic_parity']['numerator'],k['semantic_parity']['denominator'],k['semantic_parity']['value'])==(18,18,1.0)
          assert (k['reuse_ratio']['numerator'],k['reuse_ratio']['denominator'],k['reuse_ratio']['value'])==(3,3,1.0)
          assert k['duplicate_implementation_count']['value']==0
          assert (k['child_disposition_coverage']['numerator'],k['child_disposition_coverage']['denominator'],k['child_disposition_coverage']['value'])==(2,2,1.0)
          assert k['propagation_depth']['value']>=2
          assert k['authority_inversion_count']['value']==0
          assert r['3p3']['Preserve_or_Pin']=='PASS'
          assert r['3p3']['Propagate_or_Penetrate']=='PASS'
          assert r['3p3']['Prove_or_Promote']=='PASS_KNOWLEDGE_DIAGNOSTIC_CONTROL_ONLY'
          assert r['authority_transfer'] is False
          assert r['formal_credit_delta']==0
          print('PASS_GM_I_B_CYCLE3_3P3_CONTENT_ADDRESS_RELAY_PROOF')
          PY
      - name: Emit source-bound relay receipt
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          proof=Path('mission-control/grand-missions/generated/GM_I_B_CYCLE3_PROPAGATION_PROOF_v1.json')
          receipt={
            'schema':'missioncontrol.gm_i_b.cycle3.content_address_relay_runtime_receipt.v1',
            'source_head':os.environ['EXACT_HEAD'],
            'workflow_run_id':int(os.environ['RUN_ID']),
            'workflow_run_attempt':int(os.environ['RUN_ATTEMPT']),
            'qps_original_commit':'29a3a619b17b37eca5accfa2fd747401a2387c7b',
            'qps_original_git_blob_sha1':os.environ['QPS_BLOB'],
            'relay_git_blob_sha1':os.environ['QPS_BLOB'],
            'byte_identity':'PASS_SAME_GIT_BLOB',
            'aggregate_proof_present':proof.exists(),
            'aggregate_proof_sha256':hashlib.sha256(proof.read_bytes()).hexdigest() if proof.exists() else None,
            'authority_transfer':False,
            'formal_credit_delta':0,
            'hard_gate_compensation_allowed':False,
          }
          Path('mission-control/grand-missions/generated/GM_I_B_CYCLE3_CONTENT_ADDRESS_RELAY_RECEIPT_v1.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Upload Cycle3 relay proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gm-i-b-cycle3-content-address-relay-${{ env.EXACT_HEAD }}
          path: |
            mission-control/grand-missions/generated/GM_I_B_CYCLE3_PROPAGATION_PROOF_v1.json
            mission-control/grand-missions/generated/GM_I_B_CYCLE3_CONTENT_ADDRESS_RELAY_RECEIPT_v1.json
            mission-control/grand-missions/generated/input/contract.json
            mission-control/grand-missions/generated/input/atom.json
            mission-control/grand-missions/generated/input/coolprop.json
            mission-control/grand-missions/generated/input/qps.json
          if-no-files-found: warn
