contracts:
  - id: gmi.repo_snapshot.v1
    direction: GITHUB_TO_DRIVE
    owner_repo: GBOGEB/GEMINI
    disposition: NEW_NO_EXISTING_OWNER
    wave: R2-W1
    join_key: commit_sha
    fields: [repo, commit_sha, tree_sha, generated_at, files_path_to_git_blob_oid, manifest_sha256, census_sha]
  - id: gmi.proposal_profile.v1
    direction: DRIVE_TO_GITHUB
    owner_repo: GBOGEB/GEMINI
    disposition: PROFILE_OF_EXISTING
    reuse_of: GBOGEB/GEMINI:docs/bridge/PACKAGE_CONTRACT.md
    wave: R2-W2
    join_key: base_sha
    fields: [base_sha, changes_path, changes_base_blob, changes_mode, changes_artifact_ref, intent]
  - id: gmi.broker_receipt
    direction: GITHUB_TO_DRIVE
    owner_repo: GBOGEB/GEMINI
    disposition: REUSE_EXISTING
    reuse_of: GBOGEB/GEMINI:docs/bridge/BATCH_IDEMPOTENCY.md
    wave: R2-W2
    join_key: idempotency_key

broker:
