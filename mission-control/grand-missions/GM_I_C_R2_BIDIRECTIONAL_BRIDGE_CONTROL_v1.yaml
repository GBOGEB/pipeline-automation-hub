general_mission:
  statement: >-
    Keep GitHub as the single source of truth while giving Drive-only agents (Gemini in Drive/Docs)
    and Drive-connected consumers (ChatGPT, Claude) a governed two-way lane: main is PUBLISHED one-way
    to Drive as an exact-SHA snapshot without git metadata, and Drive-originated changes are INGESTED
    only as proposals that a broker turns into review-gated draft PRs at their declared base SHA.
  success_condition: IC7_ROUNDTRIP_PASS_AND_IC9_CONTROL_WITH_ZERO_AUTHORITY_LEAKAGE
  not_in_scope:
    - GIT_WORKTREES_OR_GIT_METADATA_INSIDE_GOOGLE_DRIVE
    - DIRECT_PUSH_TO_DEFAULT_BRANCH_BY_ANY_AGENT_OR_BROKER
    - R3_SUCCESSOR_GIT_BUNDLE_LANE_GEMINI_16
    - QPS_ENGINEERING_OR_RELEASE_AUTHORITY

