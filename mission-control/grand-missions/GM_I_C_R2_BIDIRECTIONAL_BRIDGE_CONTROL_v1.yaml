  owner: S03_DOCKMASTER
  state: WITHHELD_CONFIG_MISSING_OWNER_ACTION_REQUIRED
  statement: >-
    Unchanged by this re-open. R2 waves W1 and W2 are offline and do not need Drive credentials;
    W4 and later are blocked until the owner-only setup in W3 is done and one hosted IC3 run passes.

