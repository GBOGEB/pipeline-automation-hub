button{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font:inherit;cursor:pointer}
main{max-width:1360px;margin:0 auto;padding:8px 16px 48px}
section{margin-top:24px}
h2{font-size:18px;margin:0 0 10px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--grey);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}

.owner{font:12px var(--mono);color:var(--muted);word-break:break-word}
.head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.head .v{font-size:30px;font-weight:650;letter-spacing:-.02em}
.head .l{color:var(--muted)}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
dt{color:var(--muted)}dd{margin:0;text-align:right;word-break:break-word}
.unk{color:var(--grey);font-style:italic}
.pill{display:inline-block;font:600 11px var(--mono);padding:3px 7px;border-radius:999px;background:var(--grey-bg);color:var(--grey);white-space:nowrap}
.pill[data-tone=green]{background:var(--green-bg);color:var(--green)}.pill[data-tone=amber]{background:var(--amber-bg);color:var(--amber)}
.pill[data-tone=red]{background:var(--red-bg);color:var(--red)}.pill[data-tone=blue]{background:var(--blue-bg);color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.tbl{overflow:auto;max-height:260px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{position:sticky;top:0;background:var(--surface-2);font-weight:600}
.cap{font-size:13px;color:var(--muted);margin:0 0 4px}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.links a{font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;text-decoration:none;min-height:32px;display:inline-flex;align-items:center}
.src{font:12px var(--mono);color:var(--muted);word-break:break-all}
.note{background:var(--amber-bg);color:var(--text);border-radius:8px;padding:10px;font-size:14px}
.launch{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}
.launch a{display:block;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;text-decoration:none;color:var(--text);min-height:44px}
.launch a:hover{border-color:var(--blue)}
.launch b{display:block;font-weight:600}
.launch small{font:11px var(--mono);color:var(--muted);word-break:break-all}
.grp{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}

const $=s=>document.querySelector(s);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const GREEN=/^(PASS|GREEN|SUCCESS|DONE|MERGED|CONTROL|TRUE)/i, RED=/(FAIL|RED\b|BLOCK|ERROR)/i,
      AMBER=/^(HOLD|AMBER|WAIT|PENDING|SHADOW|TODO|REPAIR|NEEDS|ACTIVE)/i, GREY=/^(UNKNOWN|GREY|NONE|NULL)$/i;
function tone(v){
  if(v===null||v===undefined)return "grey";
  const s=String(v);
  if(GREY.test(s))return "grey"; if(RED.test(s))return "red"; if(GREEN.test(s))return "green"; if(AMBER.test(s))return "amber";
  return "blue";
}
function val(v,unit){
  if(v===null||v===undefined)return '<span class="unk">unknown</span>';
  if(typeof v==="object"&&!Array.isArray(v))
    return '<span class="chips">'+Object.entries(v).map(([k,x])=>'<span class="pill" data-tone="'+tone(k)+'">'+esc(k)+' '+esc(x===null?"unknown":x)+'</span>').join("")+'</span>';
  if(Array.isArray(v))return esc(v.join(", "));
  return esc(v)+(unit?esc(unit):"");
}
const blob=(p)=>D.repo_url+"/blob/"+D.source_sha+"/"+p;

  if(t.owner)h+='<div class="owner">owner: '+esc(t.owner)+'</div>';

  if(t.headline)h+='<div class="head"><span class="v">'+val(t.headline.value,t.headline.unit)+'</span><span class="l">'+esc(t.headline.label)+'</span></div>';
  if(t.fields&&t.fields.length)h+='<dl>'+t.fields.map(f=>'<dt>'+esc(f.label)+'</dt><dd>'+val(f.value,f.unit)+'</dd>').join("")+'</dl>';
  (t.lists||[]).forEach(l=>{
    h+='<div><p class="cap">'+esc(l.label)+' ('+l.rows.length+')</p><div class="tbl"><table><thead><tr>'+l.columns.map(c=>'<th scope="col">'+esc(c)+'</th>').join("")+'</tr></thead><tbody>'+
       l.rows.map(r=>'<tr>'+r.map(c=>'<td>'+val(c)+'</td>').join("")+'</tr>').join("")+'</tbody></table></div></div>';
  });
  h+='<div class="links">'+t.pages.map(p=>'<a href="'+esc(p.href)+'">'+esc(p.path.split("/").pop())+'</a>').join("");
  if(t.input)h+='<a href="'+esc(blob(t.input))+'" rel="noopener noreferrer">source @ '+esc(t.input_oid.slice(0,7))+'</a>';
  return h+'</div></article>';
}
function render(){
  $("#rule").textContent=D.rule;
  $("#pulse").textContent="read at "+D.source_sha+" · "+D.source_date+" · computes_metrics="+D.computes_metrics+" · missing_fields="+D.missing_fields.length;
  $("#tiles").innerHTML=D.tiles.map(tile).join("");
  const groups=[...new Set(D.pages.map(p=>p.group))];
  $("#pages").innerHTML=groups.map(g=>'<div class="grp">'+esc(g)+'</div><div class="launch">'+D.pages.filter(p=>p.group===g).map(p=>
    '<a href="'+esc(p.href)+'" data-q="'+esc((p.title+" "+p.path).toLowerCase())+'"><b>'+esc(p.title)+'</b><small>'+esc(p.path)+'</small></a>').join("")+'</div>').join("");
  $("#prov").innerHTML=D.tiles.filter(t=>t.input).map(t=>'<tr><td>'+esc(t.label)+'</td><td><a href="'+esc(blob(t.input))+'" rel="noopener noreferrer">'+esc(t.input)+'</a></td><td>'+esc(t.input_oid)+'</td><td>'+esc(t.owner)+'</td><td>'+val(t.schema)+'</td></tr>').join("");
}
render();
$("#q").addEventListener("input",e=>{const q=e.target.value.trim().toLowerCase();
  document.querySelectorAll("[data-q]").forEach(n=>{n.hidden=q!==""&&!n.dataset.q.includes(q);});});
$("#theme").addEventListener("click",e=>{const r=document.documentElement;
  const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme=dark?"light":"dark";e.currentTarget.setAttribute("aria-pressed",String(!dark));});
</script>
</body>
</html>
