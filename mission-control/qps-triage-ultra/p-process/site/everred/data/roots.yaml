# EVERRED 3.0 root ledger — GBOGEB federation (ABACUS authority; CODEX coordinates only).
# Occurrences are harvested, never typed here. A signature match makes an occurrence a CANDIDATE member of a root;
# causal proof lives in `evidence`. Root IDs are persistent; retired IDs stay as aliases (V3 §2.3).
schema: everred.roots/3.0
repo_scope: [GBOGEB/ABACUS, GBOGEB/CODEX, GBOGEB/cryoplant-project]
probe_scope: [GBOGEB/ABACUS, GBOGEB/CODEX, GBOGEB/cryoplant-project, GBOGEB/gg_MATH, GBOGEB/pipeline-automation-hub, GBOGEB/Q_engineering_tools]
nightly_workflows:
  GBOGEB/ABACUS: [ci-cd-tests.yml]
  GBOGEB/CODEX: []
  GBOGEB/cryoplant-project: []
id_format: <REPO>-RC-YYYY-NNNN
lifecycle: [DISCOVERED, TRIAGED, OWNED, FIX_COMMITTED, PRODUCER_GREEN, CONSUMERS_REPLAYED, VERIFIED_FIXED, CLOSED, BLOCKED_AUTHORITY, BLOCKED_INFRA, BLOCKED_DEPENDENCY, REOPENED]
dimensions:                            # V3 §8: independent states, never one global GREEN/RED
  diagnosis: [CANDIDATE, CONFIRMED, UNRESOLVED]
  repair: [NONE, PROPOSED, COMMITTED, PRODUCER_VERIFIED]
  integration: [NOT_EVALUATED, PREVIEW_PASSED, EXACT_HEAD_PASSED]
  security: [PASS, RED, UNKNOWN, NA]
  governance: [EFFECTIVE, INEFFECTIVE, UNKNOWN]
  admission: [HOLD, ELIGIBLE, ADMITTED, NA]
  control: [UNCONTROLLED, INTEGRATED, UNDER_OBSERVATION, CLOSED, REOPENED]
classes: [PRODUCT_DEFECT, TEST_OR_MEASUREMENT_DEFECT, GENERATED_ARTIFACT_DRIFT, INFRA_ENV_DEFECT, EXISTING_REPOSITORY_DEBT, SECURITY_OR_POLICY, CONTROL_PLANE_DRIFT]

roots:
  - id: ABACUS-RC-2026-0001
    aliases: [EVR-ABACUS-0001]
    title: ABACUS default branch has no required status checks (rules emptied 12 Oct; partly restored 15 Oct)
    class: CONTROL_PLANE_DRIFT
    severity: P0
    state: BLOCKED_AUTHORITY
    dims: {diagnosis: CONFIRMED, repair: PROPOSED, integration: NA, security: NA, governance: INEFFECTIVE, admission: NA, control: UNCONTROLLED}
    owner: GBOGEB
    match: [{probe: ruleset_drift, repo: GBOGEB/ABACUS}]
    evidence:
      - "12 Oct 17:58: ruleset 24494381 emptied during break-glass; 61 PRs merged with PR Feedback Gate green on 0"
      - "15 Oct 10:35: deletion, pull_request (thread resolution) and non_fast_forward restored; required_status_checks still absent"
      - "Open PRs #2075-#2077: PR Feedback Gate failure; merges continue without a required check"
    canonical_repair: "Owner imports rulesets/ABACUS.basic.json (or adds its required_status_checks rule to 24494381); ABACUS.hard.json once PR Feedback Gate can pass"
    regression_contract: "verify_rulesets.py probe every census; any gap = RED (CONTROL_PLANE_DRIFT)"
    consumers: [all ABACUS PRs]

