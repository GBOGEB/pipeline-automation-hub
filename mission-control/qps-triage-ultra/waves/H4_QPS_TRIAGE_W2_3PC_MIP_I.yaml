three_pulse_transaction:
  - pulse: H4-QPS-W2-P1
    method_step: PREPARE
    formal_state: HOLD_GATE_NOT_RELEASED
    preflight_state: SUBSTANTIAL_INPUTS_FROZEN_RESIDUALS_EXPLICIT
    primary_lane: H1_QPS
    supporting_lanes: [H2_KEB, H3_DOW]
    objective: >-
      Freeze one exact source atom, exact consumer version, reference period,
      component/system boundary, architecture fields, and expected child
      re-entry question before any reliability calculation is credited.
    preferred_atom: COLD_COMPRESSOR_TRAIN
    fallback_atom: ALAT_HP_COMPRESSOR
    explicit_child_reentry_question: >-
      Given the accepted ALAT three-stage series architecture, 105000 h per-stage
      MTBF and 13 h total service-restoration MTTR, does the child accept the
      analytical consumer contract for provisional independent-stage reliability
      diagnostics while keeping common-cause/non-overlap and Table-10 promotion
      DEFERred until issue #75 evidence closes?
    required_output:
      - exact_source_identity
      - exact_consumer_identity
      - source_origin
      - reference_period
      - architecture_and_common_cause_fields
      - explicit_child_reentry_question
      - zero_promotion_before_proof
    stop_gate: MISSING_EXACT_SOURCE_OR_CONSEQUENCE_SCOPE

  - pulse: H4-QPS-W2-P2
    method_step: PROVE
    formal_state: HOLD_GATE_NOT_RELEASED
    preflight_state: PROOF_VECTOR_DEFINED_NOT_EXECUTED
    primary_lane: H3_DOW
    supporting_lanes: [H2_KEB, H1_QPS]
    objective: >-
      Reproduce MTBF/lambda/exposure/Poisson outputs deterministically, verify
      provenance survival, and separately test whether system consequence is
      source-bound or remains scenario-only.
    proof_vector:
      - per_stage_MTBF_105000h_normalization
      - three_stage_independent_series_rate_0_2502857143_per_year
      - selected_reference_period_mu_P0_P_ge_1_Pk
      - exact_child_blob_and_consumer_blob_provenance
      - preserve_SOURCE_BOUND_vs_SCENARIO_vs_USER_OVERRIDE
      - preserve_component_vs_system_scope
      - assert_common_cause_open_is_not_zero
      - assert_verified_Table10_rate_remains_0_0_per_year
    required_output:
      - deterministic_MTBF_lambda_parity
      - deterministic_mu_P0_P_ge_1_Pk
      - exact_provenance_parity
      - model_state
      - architecture_readiness
      - system_consequence_readiness
      - exact_SHA_receipt
    stop_gate: FIRST_EXECUTION_OR_PROVENANCE_RED

  - pulse: H4-QPS-W2-P3
    method_step: COMMIT
    formal_state: HOLD_GATE_NOT_RELEASED
    preflight_state: DISPOSITION_CONTRACT_DEFINED_NOT_APPLIED
    primary_lane: H1_QPS
    supporting_lanes: [H2_KEB, H4_QPS_TRIAGE]
    objective: >-
      Commit only the bounded child disposition: accept the analytical consumer
      contract for the proven scope or explicitly DEFER/HOLD it. Do not convert
      component evidence into Table-10 credit unless the child consequence gates
      independently support that promotion.
    allowed_dispositions: [ACCEPT_ANALYTICAL_CONSUMER, DEFER, HOLD, REJECT]
    forbidden_dispositions:
      - AUTO_TABLE10_PROMOTE
      - AUTO_N_PLUS_1_ACCEPT
      - AUTO_SYSTEM_EVENT_RATE
    required_output:
      - child_disposition
      - exact_source_and_consumer_identity
      - formal_credit_delta
      - next_first_red_if_deferred

