victory_condition: >-
  One exact source atom traverses Prepare -> Prove -> Commit with no authority
  leakage, the shared operating-state adapter is defined against the existing
  numerical SSOT, and all outputs are exact-SHA or exact-artifact bound.

stop_rule: >-
  Stop W2 after one successful bounded transaction and one justified ledger
  adapter. Do not expand to all five atoms in the same wave. While the formal
  gate remains held, permit source/consumer identity prebinding, residual
  enumeration and proof-vector definition only; do not execute P2, mutate child
  disposition, mutate Mission Control current pointers or implement the adapter.
