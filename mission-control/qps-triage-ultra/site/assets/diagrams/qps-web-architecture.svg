<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">QPS web architecture</title>
  <desc id="desc">MissionControl SSOT feeds both the Next operational cockpit and the Jekyll static evidence atlas. Shared QPS UI tokens feed both. Jekyll feeds same-release parity, while runtime evidence returns from Next to MissionControl.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker>
  </defs>
  <style>
    .box{fill:none;stroke:currentColor;stroke-width:2}.label{font:16px system-ui,sans-serif;fill:currentColor}.small{font:13px system-ui,sans-serif;fill:currentColor}.flow{fill:none;stroke:currentColor;stroke-width:2;marker-end:url(#arrow)}.feedback{stroke-dasharray:8 6}
  </style>
  <rect class="box" x="40" y="130" width="230" height="90" rx="10"/><text class="label" x="155" y="165" text-anchor="middle">MissionControl SSOT</text><text class="small" x="155" y="190" text-anchor="middle">JSON · YAML · receipts · REX</text>
  <rect class="box" x="390" y="40" width="230" height="90" rx="10"/><text class="label" x="505" y="75" text-anchor="middle">Next / React</text><text class="small" x="505" y="100" text-anchor="middle">operational cockpit</text>
  <rect class="box" x="390" y="230" width="230" height="90" rx="10"/><text class="label" x="505" y="265" text-anchor="middle">Jekyll / HTML</text><text class="small" x="505" y="290" text-anchor="middle">static evidence atlas</text>
  <rect class="box" x="730" y="130" width="210" height="90" rx="10"/><text class="label" x="835" y="165" text-anchor="middle">QPS UI Tokens v1.2</text><text class="small" x="835" y="190" text-anchor="middle">shared vocabulary</text>
  <rect class="box" x="970" y="230" width="190" height="90" rx="10"/><text class="label" x="1065" y="265" text-anchor="middle">Release parity</text><text class="small" x="1065" y="290" text-anchor="middle">HTML · PDF · XLSX</text>
  <path class="flow" d="M270 155 C320 120 340 90 390 85"/><path class="flow" d="M270 195 C320 225 340 265 390 275"/>
  <path class="flow" d="M730 155 C680 120 660 90 620 85"/><path class="flow" d="M730 195 C680 225 660 265 620 275"/>
  <path class="flow" d="M620 275 L970 275"/>
  <path class="flow feedback" d="M390 105 C335 105 315 135 270 145"/>
</svg>
