runtime_lane_policy:
  measured_inputs:
    - queue_seconds
    - execute_seconds
    - queue_execute_ratio
    - queue_fraction
    - predicted_execute_seconds
    - runner_class
    - cache_hit
    - build_fraction
    - artifact_bytes
    - mission_state
    - crew_units_waiting
    - DoV_unlock
  lanes:
    FAST:
      predicted_execute_seconds_max: 60
      examples: [receipt_validation, schema_gate, small_python_probe, BT_PCA_gate, truth_probe]
    NORMAL:
      predicted_execute_seconds_max: 300
      examples: [ordinary_tests, small_consumer, moderate_calculation]
    HEAVY:
      predicted_execute_seconds_min_exclusive: 300
      examples: [source_build, large_dependency_install, docker_build, large_artifact]
    SPECIAL:
      predicate: requires_dedicated_habitat
      examples: [Windows_HEPAK_Excel, private_runner, GPU, licensed_runtime]
  starvation_class:
    name: STARVED_FAST
    initial_expert_seeded_rule:
      predicted_execute_seconds_max: 60
      queue_execute_ratio_min: 5
      mission_state_in: [ACTIVE, BD0]
    action: priority_release_or_reserved_fast_capacity
    evidence_class: EXPERT_SEEDED_UNTIL_CALIBRATED

long_execution_optimizer_order:
  - repeated_dependency_install: CACHE_OR_PREBUILT_IMAGE
  - repeated_upstream_compile: BUILD_ONCE_EXACT_SHA_ARTIFACT_CONSUME_MANY
  - monolithic_workflow: SPLIT_DAG_AND_PARALLELIZE_INDEPENDENT_STAGES
  - large_checkout: SPARSE_SHALLOW_TARGETED_CHECKOUT
  - wrong_runner_class: ROUTE_TO_FAST_NORMAL_HEAVY_SPECIAL
  - persistent_queue_pressure_after_routing: CONSIDER_EXTRA_RUNNER
  - intrinsically_compute_heavy_after_optimization: LARGER_OR_PARALLEL_HEAVY_RUNNER

runner_scale_gate:
  principle: OPTIMIZE_REMOVE_REUSE_SPLIT_ROUTE_PRIORITIZE_THEN_SCALE
  extra_FAST_runner_candidate_when:
    - at_least_3_comparable_measured_pulses_show_STARVED_FAST
    - at_least_2_useful_FAST_jobs_are_simultaneously_runnable
    - queue_pressure_is_not_only_external_private_runner_failure
    - reserved_fast_capacity_would_reduce_ACTIVE_or_BD0_critical_path
  extra_HEAVY_runner_candidate_when:
    - caching_reuse_and_decomposition_have_been_attempted_or_ruled_out
    - remaining_work_is_parallelizable_or_larger_runner_is_resource_justified
    - heavy_lane_blocks_ACTIVE_or_BD0_progress
  no_scale_if:
    - one_off_job
    - low_DoV_unlock
    - repeated_build_can_be_eliminated_by_artifact_reuse
    - job_is_waiting_on_external_license_or_private_admission
  metrics:
    QER: queue_seconds_div_execute_seconds
    queue_fraction: queue_seconds_div_total_seconds
    crew_wait_loss: queue_seconds_times_active_crew_units

PCA_BT_DMAIC_policy:
  PCA:
    role: discover_latent_workload_structure_not_direct_scheduler
    current_runtime_hypothesis:
      PC1: execution_or_workload_footprint
      PC2: queue_or_admission_friction
      possible_future_PC3: human_dependency_or_crew_wait
    scheduler_uses_raw_measured_fields: true
  BT:
    role: rank_next_intervention_or_BD_promotion_from_observed_outcomes
    reverse_pressure_question: what_must_be_false_for_current_rank_1_to_lose_priority
  DMAIC:
    Define: named_BG_and_target_CG
    Measure: exact_runtime_and_receipts
    Analyze: queue_vs_execute_vs_evidence_vs_rework
    Improve: lowest_cost_highest_DoV_unlock_action
    Control: merged_or_fresh_repeat_with_temporal_receipt

