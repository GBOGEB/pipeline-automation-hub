objective: >-
  Build and independently challenge a canonical eleven-point mathematical stack
  for QPS TRIAGE, with explicit high-dimensional noise/signal separation via RMT,
  covariance/PCA/ANOVA, Bradley-Terry and relational statistics, Monte Carlo/SDE,
  spectral graph mathematics, calculus/asymptotics, temporal DAG mathematics and
  bounded ML baselines. Return every material result and failure as REX without
  transferring engineering, compliance, release or procurement authority.
activation_policy:
  strategic_WIP_non_displacement: true
  current_global_first_red_remains: cryoplant-project#923_runner_admission
  current_W3_strategic_gate_remains: W3_12_HEPAK_NUMERIC_RECEIPT
  activation_rule: >-
    LM-10 may perform source-side research and isolated public gg_MATH runtime now,
    but may not displace the sole ACTIVE strategic QPS gate or second currently
    ACTIVE/BD0 crew without Governor rebalance evidence.
  promotion_to_ACTIVE_requires:
    - named_execution_slice
    - available_crew_or_explicit_rebalance
    - exact_head_runtime_path
    - no_authority_collision
crew_plan:
  U01_Governor:
    role: GATE_ONLY
    availability: CONTROL
    use: authority_boundary_and_final_local_disposition
  U05_Analyst:
    role: ANALYTIC_OWNER
    availability: CURRENTLY_BD0_RUNTIME_LANE_SCHEDULER
    use: PCA_BT_RMT_ANOVA_metrics_after_rebalance_or_scheduler_return
  U06_QA_Signalman:
    role: INDEPENDENT_ATTESTATION
    availability: CURRENTLY_ACTIVE_W3_12
    use: exact_SHA_receipts_after_return_or_explicit_rebalance
  U07_Cartographer_Oculars:
    role: OBSERVABILITY_AND_VISUALS
    availability: CONTROL
    use: Plotly_scree_PC1_PC3_graph_spectra_temporal_views
  U08_REX_KEB_Integrator:
    role: REX_CURATOR_TECHNICAL_CHALLENGER
    availability: CONTROL
    use: academic_register_provenance_assumption_and_REX_fanin
  S04_Scientist:
    role: DOMAIN_VALIDATION_SPECIALIST
    availability: CURRENTLY_ACTIVE_W3_12
    use: model_assumption_and_validity_challenge_after_return_or_explicit_rebalance
  S05_Engineer:
    role: BOUNDED_IMPLEMENTER
    availability: CURRENTLY_BD0_RUNTIME_LANE_SCHEDULER
    use: kernels_tests_receipts_after_rebalance_or_scheduler_return
crew_rules:
  - do_not_fabricate_secondment
  - preserve_current_ACTIVE_and_BD0_assignments_until_explicit_return_or_rebalance
  - reserve_specialists_summoned_only_on_named_first_red
  - builder_cannot_self_attest
  - gg_MATH_runtime_PASS_is_implementation_evidence_not_QPS_authority
resources:
  repositories:
    - GBOGEB/gg_MATH
    - GBOGEB/pipeline-automation-hub
    - GBOGEB/cryoplant-project
    - GBOGEB/ABACUS
    - GBOGEB/DOCX_RTM_Automation
    - GBOGEB/Q_engineering_tools
  compute:
    - GitHub_Actions_public_gg_MATH
    - deterministic_dependency_free_reference_kernels
    - production_numpy_scipy_sklearn_statsmodels_networkx_plotly_lane_after_reference_pass
