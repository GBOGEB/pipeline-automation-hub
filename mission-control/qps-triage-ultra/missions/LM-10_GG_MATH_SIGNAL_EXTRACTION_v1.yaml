    - exact_SHA
    - source_DOI_or_primary_URL
    - formula_assumptions
    - synthetic_vs_measured_flag
    - random_seed_and_sample_count
    - feature_schema_and_units
    - null_model_and_aspect_ratio
    - independent_challenge_result
    - consumer_disposition
math_hierarchy:
  H01: MATRIX_CORE
  H02: COVARIANCE_CORRELATION_ANOVA
  H03: EIGEN_PCA_ORTHOGONAL_TRANSFORMS
  H04: RMT_MP_BBP_TRACY_WIDOM_PARALLEL_ANALYSIS
  H05: RELATIONAL_BT_PEARSON_ASSOCIATION_LAMBDA
  H06: MONTE_CARLO_SDE_LANGEVIN_FOKKER_PLANCK
  H07: SPECTRAL_GRAPH_LAPLACIAN_TOPOLOGY
  H08: CALCULUS_INTEGRATION_DIFFERENTIATION_KINEMATICS
  H09: ASYMPTOTICS_REGIME_MAPS_DIMENSIONLESS_RATIOS
  H10: TEMPORAL_DAG_LINEAGE_RECURSION
  H11: ML_BASELINES_MODEL_MIXING_AND_CROSS_LEG_FUSION
canonical_pipeline:
  - SOURCE_AND_ASSUMPTIONS
  - REFERENCE_FORMULA
  - DETERMINISTIC_KERNEL
  - INDEPENDENT_CHALLENGE
  - EXACT_HEAD_RUNTIME_RECEIPT
  - SYNTHETIC_CALIBRATION
  - MEASURED_QPS_DIAGNOSTIC
  - QPS_CONSUMER_DISPOSITION
  - REX_FANIN
  - FRESH_HEAD_REPEAT
  - CONTROL_OR_DEFER
authority_ladder:
  A0_REFERENCE: literature_or_formula_only
  A1_IMPLEMENTED: code_exists_not_yet_challenged
  A2_VERIFIED_KERNEL: independent_challenge_passed
  A3_SYNTHETIC_CALIBRATED: bounded_fixture_only
  A4_MEASURED_DIAGNOSTIC: real_QPS_data_but_no_decision_authority
  A5_GOVERNED_CONSUMER: QPS_consumed_with_source_and_gate_receipt
  A6_DOMAIN_AUTHORITY: external_to_gg_MATH_requires_existing_TM_QA_Governor_contract
forbidden_promotions:
  - MP_BULK_OUTLIER_is_not_automatically_signal
  - PCA_loading_is_not_Bradley_Terry_evidence
  - synthetic_rows_do_not_promote_PCA_or_BT
  - Monte_Carlo_precision_does_not_create_input_validity
  - ML_accuracy_does_not_override_hard_dependencies_or_authority
  - graph_smoothness_does_not_prove_causality
  - correlation_does_not_prove_causality
  - gg_MATH_does_not_issue_engineering_compliance_negotiation_acceptance_or_release_status
victory_conditions:
  source_side:
    - full_academic_register_with_post_2000_bridge
    - eleven_point_machine_readable_assimilation_register
    - executable_reference_kernels_for_each_mathematical_family_or_explicit_DEFER
    - independent_test_for_every_executable_kernel
    - authority_and_lambda_namespace_canon
  runtime:
    - exact_head_steps_gt_0
    - all_reference_challenges_pass_or_first_red_retained
    - receipt_binds_repo_branch_SHA_schema_seed_and_digest
  consumer:
    - QPS_TRIAGE_consumes_at_least_one_measured_math_receipt_without_authority_leakage
  rex:
    - at_least_one_new_REX_from_heterogeneous_math_frontier
    - REX_classified_reusable_for_future_multi_frontier_missions
stop_rules:
  - stop_on_first_non_compensating_red_per_execution_slice
  - do_not_patch_application_math_when_runtime_steps_equal_zero
  - do_not_activate_DNN_CNN_before_baseline_data_contract_and_leakage_test
  - do_not_use_MP_or_BBP_without_recording_null_model_p_n_sigma_and_preprocessing
  - do_not_call_a_lambda_metric_without_namespace
future_mission_value:
  hypothesis: >-
    A deliberately heterogeneous mathematical single-frontier mission increases
    REX diversity before larger fleet expansion, exposing assumption, numerical,
    data-shape, graph-topology, stochastic and authority failure modes cheaply.
  transfer_targets:
    - GM_IV_later_frontiers
    - held_GM_V_future_activation
    - candidate_81_repo_31_integration_expansion_objective
  note: candidate expansion targets are not canonical Grand Mission authority.
