schema: qps.local_mission.v1
mission_id: LM-10
name: GG_MATH_SIGNAL_EXTRACTION
state: BD0_STAGED_SINGLE_FRONTIER
authority_transfer: false
mission_shape:
  analogy: GM-I_SINGLE_FRONTIER_SHAPE_ONLY
  grand_mission_member: false
  frontier_count: 1
  frontier:
    repo: GBOGEB/gg_MATH
    branch: mission/v-rmt-spectral-assimilation-v1
    role: MATH_BUNKER_HIGH_DIMENSIONAL_SIGNAL_EXTRACTION
  consumer:
    system: QPS_TRIAGE_ULTRA
    role: GOVERNED_DIAGNOSTIC_CONSUMER
  home:
