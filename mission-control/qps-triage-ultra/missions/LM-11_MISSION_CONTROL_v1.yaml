mission_objectives:
  primary:
    - recover_full_wave_and_pulse_sequence_with_PR_commit_lineage
    - resolve_causal_semantic_and_temporal_dependencies
    - identify_wave_families_mainline_parallel_side_load_correction_revisit_and_historical_only_lanes
  secondary:
    - reconstruct_QPS_TRIAGE_nodes_edges_and_cross_repo_satellites
    - emit_full_and_sectional_DAGs_with_entry_exit_points
    - classify_human_outputs_hybrid_control_machine_state_and_code_core
