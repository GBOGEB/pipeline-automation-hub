  final:
    - comprehensive_QPS_TRIAGE_and_satellite_node_atlas_in_GM_I_to_GM_V_style_without_consuming_a_GM_number

identity_model:
  hierarchy: [Mission, WaveFamily, Wave, Cycle, Pulse, PR, Run, Artifact, Atom]
  temporal_fields: [global_seq, mission_seq, wave_seq, pulse_seq, event_time, observed_time, release_time]
  ancestry_fields: [previous_event, previous_in_lane, causal_parent, semantic_predecessor, prior_current, source_base_sha]
  rule: chronological_predecessor_NE_causal_parent_NE_semantic_predecessor_NE_prior_current

node_types:
  - WAVE
  - PULSE
  - CORRECTION
  - REVISIT
  - P3R_CYCLE
  - PR
  - COMMIT
  - RUN
  - SOURCE
  - CANONICAL_OBJECT
  - RECEIPT
  - ARTIFACT
  - CURRENT_POINTER
  - SATELLITE_REPO

edge_types:
  - PRECEDES
  - PARENT_OF
  - DEPENDS_ON
  - PRODUCES
  - CONSUMES
  - EVIDENCED_BY
  - SUPERSEDES
  - CORRECTS
  - REVISITS
  - ALIASES
  - BRIDGES
  - FEDERATES_TO
  - RETURNED_AS
  - REENTERS
  - FORKS
  - JOINS
  - PARALLEL_NONCOMPENSATING
  - PROMOTES_TO_CURRENT

artifact_classes:
  HUMAN_OUTPUT:
    observed_formats: [DOCX, PDF, XLSX, PPTX, HTML]
    authority: GENERATED_VIEW_NOT_GOVERNING_SOURCE
  HYBRID_CONTROL:
    observed_formats: [YAML, YML, MD]
    examples: [mission_contract, control_plane, handover, burndown, navigation_report]
  MACHINE_STATE:
    observed_formats: [JSON]
    examples: [receipt, manifest, canonical_object, lineage_projection, hash_manifest]
  CODE_CORE:
    observed_formats: [PYTHON, TYPESCRIPT_ZOD, SHELL, POWERSHELL]
    rule: additional_languages_are_census_observations_not_assumptions

wave_semantics:
  wave: bounded_victory_scope
  pulse: additive_same_scope_work
  correction: incorrect_or_incomplete_prior_assertion_repaired
  revisit: same_scope_reopened_by_new_evidence
  p3r: recursive_cycle_inside_wave
  new_wave_gate: method_population_authority_chain_release_mechanism_or_workstream_materially_changes
  directory_rule: absence_of_triage_wNNN_directory_does_not_prove_absence_of_wave_history

truth_guards:
  - repository_authority_over_chat_memory
  - append_only_temporal_history_no_destructive_lineage_rewrite
  - github_PR_number_commit_SHA_and_historical_title_are_immutable_provenance
  - hash_difference_detects_change_but_does_not_promote_truth
  - MERGED_NE_PERPETUATED
  - PARENT_PASS_NE_CHILD_ACCEPT
  - ZOD_PASS_NE_CHILD_ACCEPT
  - UNKNOWN_OR_DEFER_NE_ZERO
  - no_new_wave_for_narrow_repair_rerun_binary_refresh_visualization_or_source_hunt
  - no_engineering_compliance_negotiation_or_release_credit_from_cartography

first_red:
  id: LINEAGE_AUTHORITY_POINTER_DRIFT_110_111
  state: OPEN_RECONCILE_WITHOUT_HISTORY_REWRITE
  observation: >-
    QPS_WAVE_LINEAGE_NORMALIZATION_v0.1 and QPS_DOUBLE_3PR_LINEAGE_CLOSURE preserve PR110/W03 and PR111/W02 as distinct successor nodes,
    while QPS_CANONICAL_LINEAGE_RESOLVER_v1 and its current navigation projection treat PR110 as a superseded planning sidecar under PR111.
    The mission shall determine resolver revision/authority precedence and preserve both historical interpretations as temporal evidence.

