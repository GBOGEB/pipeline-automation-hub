    rule: DOV0_through_DOV6_required_except_explicit_Governor_DEFER
    excludes: A6_domain_authority

stop_conditions:
  per_pulse:
    - first_non_compensating_red_observed
    - exact_source_identity_missing
    - assumptions_or_units_undefined_for_required_formula
    - independent_challenge_fails
    - runtime_steps_equal_zero
    - receipt_digest_or_SHA_binding_missing
    - synthetic_measured_class_ambiguous
    - downstream_authority_collision
  mission_level:
    - crew_collision_with_existing_ACTIVE_strategic_gate_without_Governor_rebalance
    - attempt_to_promote_math_to_engineering_or_compliance_truth
    - attempt_to_activate_H11_before_data_contract_leakage_and_baseline_gates
    - repeated_unbounded_scope_growth_without_named_DoV_unlock
    - loss_of_provenance_or_inability_to_reproduce_required_receipt
  stop_action:
    - retain_first_red_evidence
    - mark_slice_REJECT_or_DEFER_not_PASS
    - return_nonessential_crew
    - message_HOME
    - re_rank_after_blocker_classification

abort_conditions:
  hard_abort:
    - fabricated_measured_data_or_fabricated_secondment_detected
    - authority_transfer_true_without_explicit_domain_contract
    - destructive_or_irreversible_repo_action_outside_authorized_scope
    - confidential_or_restricted_source_exfiltration_to_public_repo
    - mathematical_test_or_visual_is_represented_as_A6_domain_acceptance
  abort_action:
    - stop_all_LM10_execution
    - preserve_receipts_and_logs
    - Governor_HOLD
    - QA_and_REX_independent_review
    - resume_only_with_explicit_reauthorization

hold_and_defer_conditions:
  HOLD:
    - named_external_dependency_blocks_all_attainable_slices
