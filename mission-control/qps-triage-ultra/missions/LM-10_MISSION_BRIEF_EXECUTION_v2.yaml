crew_rules:
  - do_not_fabricate_secondment
  - one_ACTIVE_strategic_WIP_unless_Governor_rebalances
  - BD0_recommended_limit_two
  - reserve_specialists_only_on_named_first_red
  - CONTROL_allocation_minimal
  - RETURN_when_zero_current_marginal_value
  - competence_requires_evidence_not_title
  - public_repo_CI_execution_does_not_imply_human_crew_secondment
  - builder_cannot_self_attest

resource_weighting:
  name: PCA_DIMINISHING_RESIDUAL_PRESSURE
  eligibility: nonblocking_legs_only
  raw_weight_formula: residual_variance_times_BD_severity_times_authority_gap_times_dependency_readiness
  normalized_weight_formula: raw_i_div_sum_raw_eligible
  decay_after_evidence_backed_closure: raw_next_equals_max_control_floor_raw_times_decay
  rules:
    - re_normalize_after_every_material_receipt
    - closed_CONTROL_leg_gets_small_watch_floor_not_equal_share
    - blocked_dependency_gets_zero_execution_share_but_retains_watch_state
    - synthetic_PCA_weights_must_be_labelled_SYNTHETIC
    - measured_PCA_weights_require_exact_population_and_schema_identity
    - first_non_compensating_attainable_red_overrides_weight_rank

mission_stages:
  ST0_REFRESH:
    action: refresh_repo_PR_issue_workflow_crew_and_authority_state
    exit_receipt: MISSION_REFRESH_RECEIPT
  ST1_DEFINE:
    action: name_BG_target_CG_assumptions_scope_DoV_and_first_red
    exit_receipt: DEFINE_RECEIPT
  ST2_IMPLEMENT:
    action: bounded_change_on_first_attainable_red_or_planned_nonblocking_slice
    exit_receipt: IMPLEMENTATION_RECEIPT
  ST3_CHALLENGE:
    action: independent_test_counterexample_assumption_and_numerical_challenge
    exit_receipt: CHALLENGE_RECEIPT
  ST4_RUNTIME:
    action: exact_head_steps_gt_0_and_machine_readable_receipt
    exit_receipt: RUNTIME_RECEIPT
  ST5_CLASSIFY:
    action: classify_REFERENCE_SYNTHETIC_MEASURED_and_assign_A_level_BD_state
    exit_receipt: CLASSIFICATION_RECEIPT
  ST6_CONSUME:
    action: downstream_ACCEPT_REJECT_DEFER_without_authority_leakage
    exit_receipt: CONSUMER_DISPOSITION_RECEIPT
  ST7_REX:
    action: return_lessons_failures_controls_and_reusable_patterns_HOME
    exit_receipt: REX_RECEIPT
  ST8_REALLOCATE_RECURSE:
    action: recompute_PCA_residual_weights_rank_next_first_red_and_repeat
    exit_receipt: REALLOCATION_RECEIPT

waves:
  W0_MISSION_ACTIVATION_AND_BASELINE:
    state: ACTIVE_CONTROL_PREP
    objective: freeze_scope_authority_current_heads_DoV_and_crew_availability
    crew_groups: [G0_COMMAND_AND_AUTHORITY, G5_REX_KEB_CHALLENGE]
    pulses:
      P0_1_REFRESH: {stages: [ST0_REFRESH], output: live_state_snapshot}
      P0_2_FREEZE: {stages: [ST1_DEFINE], output: mission_brief_and_DoV_contract}
      P0_3_AUTHORIZE: {stages: [ST5_CLASSIFY], output: BD0_or_ACTIVE_disposition}
    exit_gate: mission_brief_exact_source_and_no_authority_collision

  W1_CANON_ACADEMIC_AND_NAMESPACE:
    state: PARTIAL_DONE
    objective: close_sources_assumptions_formula_namespaces_and_authority_guards
    crew_groups: [G1_MATH_ANALYSIS, G5_REX_KEB_CHALLENGE]
    parallel_allowed: true
    pulses:
      P1_1_H01_H05_CANON: {stages: [ST1_DEFINE, ST3_CHALLENGE], scope: H01_to_H05}
      P1_2_H06_H10_CANON: {stages: [ST1_DEFINE, ST3_CHALLENGE], scope: H06_to_H10}
      P1_3_H11_GATE: {stages: [ST1_DEFINE, ST5_CLASSIFY], expected: DEFER_DATA_CONTRACT_FIRST}
    exit_gate: every_H_point_has_source_assumption_namespace_and_authority_rule

  W2_REFERENCE_AND_PRODUCTION_KERNELS:
    state: ACTIVE_SOURCE_SIDE_NONBLOCKING
    objective: complete_H01_H10_executable_stack_or_explicit_DEFER
    crew_groups: [G1_MATH_ANALYSIS, G2_BUILD_AND_RUNTIME]
    parallel_allowed: true_for_dependency_independent_legs
    dependency_spine:
      - H01_matrix_core
      - H02_covariance_correlation
      - H03_PCA_PA
      - H04_RMT
      - H05_relational
      - H06_MC_SDE
      - H07_graph
      - H08_calculus
      - H09_regime_maps
      - H10_temporal
    pulses:
      P2_1_CORE: {stages: [ST2_IMPLEMENT, ST3_CHALLENGE, ST4_RUNTIME], scope: [H01, H02, H03, H04]}
      P2_2_RELATIONAL_STOCHASTIC: {stages: [ST2_IMPLEMENT, ST3_CHALLENGE, ST4_RUNTIME], scope: [H05, H06]}
      P2_3_GRAPH_CALCULUS_REGIME: {stages: [ST2_IMPLEMENT, ST3_CHALLENGE, ST4_RUNTIME], scope: [H07, H08, H09]}
      P2_4_TEMPORAL: {stages: [ST2_IMPLEMENT, ST3_CHALLENGE, ST4_RUNTIME], scope: [H10]}
    first_receipt_already_observed:
      repo: GBOGEB/gg_MATH
      sha: 11d8779cbaca17350e52d9de2917dcbc1ba17a75
      run: 34917694096
      result: PASS_REFERENCE_CHALLENGE
      authority_cap: A2
    exit_gate: all_H01_H10_reference_challenges_PASS_or_each_first_red_retained

  W3_SYNTHETIC_CALIBRATION_AND_VISUALS:
    state: PLANNED_AFTER_W2_SLICE_READINESS
    objective: test_finite_sample_stability_cross_leg_behavior_and_visual_contract
    crew_groups: [G1_MATH_ANALYSIS, G3_VERIFICATION_AND_ATTESTATION, G4_OBSERVABILITY_AND_VISUALS]
    pulses:
      P3_1_PCA_RMT_CALIBRATION: {stages: [ST3_CHALLENGE, ST4_RUNTIME, ST5_CLASSIFY], outputs: [PA95, bootstrap_loading_stability, MP_BBP_overlay, shrinkage_baseline]}
      P3_2_MC_SDE_GRAPH_CALIBRATION: {stages: [ST3_CHALLENGE, ST4_RUNTIME, ST5_CLASSIFY], outputs: [convergence, density_paths, graph_spectrum, topology_sensitivity]}
      P3_3_VISUAL_RECEIPTS: {stages: [ST4_RUNTIME, ST5_CLASSIFY], outputs: [scree_MP_PA95, PC1_PC3_loadings, graph_energy, regime_map, temporal_DAG]}
    authority_cap: A3
    exit_gate: calibrated_synthetic_receipts_with_seed_population_and_digest

  W4_PCA_RESOURCE_REALLOCATION:
    state: PLANNED_PARALLEL_AFTER_MINIMUM_FEATURE_MATRIX
    objective: turn_measured_or_explicitly_synthetic_residual_structure_into_diminishing_resource_weights
    crew_groups: [G1_MATH_ANALYSIS, G0_COMMAND_AND_AUTHORITY]
    pulses:
      P4_1_FEATURE_MATRIX: {stages: [ST1_DEFINE, ST4_RUNTIME], output: resource_feature_matrix}
      P4_2_PCA_ALLOCATE: {stages: [ST3_CHALLENGE, ST5_CLASSIFY], output: normalized_leg_weights}
      P4_3_REALLOCATE: {stages: [ST8_REALLOCATE_RECURSE], output: crew_and_compute_recommendation}
    exit_gate: weights_reproducible_and_first_red_override_proven

  W5_MEASURED_QPS_CONSUMER:
    state: PLANNED_CONDITIONAL
    prerequisites:
      - at_least_one_A2_or_A3_provider_receipt
      - exact_measured_population_identity
      - consumer_feature_schema
      - no_synthetic_row_promotion
    repo: GBOGEB/ABACUS
    consumer_anchor: issue_1164
    crew_groups: [G1_MATH_ANALYSIS, G3_VERIFICATION_AND_ATTESTATION, G0_COMMAND_AND_AUTHORITY]
    pulses:
      P5_1_INGEST: {stages: [ST0_REFRESH, ST1_DEFINE], output: typed_provider_consumer_binding}
      P5_2_MEASURE: {stages: [ST4_RUNTIME, ST5_CLASSIFY], output: A4_measured_diagnostic_candidate}
      P5_3_DISPOSITION: {stages: [ST6_CONSUME], output: ACCEPT_REJECT_DEFER}
    exit_gate: explicit_governed_consumer_disposition_with_authority_transfer_false

  W6_REX_FANIN_REPEAT_AND_CONTROL:
    state: PLANNED
    crew_groups: [G5_REX_KEB_CHALLENGE, G3_VERIFICATION_AND_ATTESTATION, G0_COMMAND_AND_AUTHORITY]
    pulses:
      P6_1_REX_FANIN: {stages: [ST7_REX], output: reusable_REX_entries}
      P6_2_DISTINCT_HEAD_REPEAT: {stages: [ST0_REFRESH, ST3_CHALLENGE, ST4_RUNTIME], output: fresh_head_repeat_receipt}
      P6_3_CONTROL_DISPOSITION: {stages: [ST5_CLASSIFY, ST6_CONSUME, ST8_REALLOCATE_RECURSE], output: DONE_CONTROL_DEFER_or_RETURN}
    exit_gate: recurrent_roots_have_control_plus_distinct_source_repeat

  W7_H11_CONDITIONAL_ML:
    state: DEFER_DATA_CONTRACT_FIRST
    activation: all_H11_prerequisites_pass
    objective: baseline_first_then_only_justified_DNN_CNN_or_model_mixing
    crew_groups: [G1_MATH_ANALYSIS, G2_BUILD_AND_RUNTIME, G3_VERIFICATION_AND_ATTESTATION]
    pulses:
      P7_1_DATA_CONTRACT: {stages: [ST1_DEFINE, ST3_CHALLENGE], output: immutable_feature_target_contract}
      P7_2_BASELINES: {stages: [ST2_IMPLEMENT, ST3_CHALLENGE, ST4_RUNTIME], output: baseline_receipts}
      P7_3_NEURAL_GATE: {stages: [ST5_CLASSIFY], output: ACTIVATE_or_DEFER_neural_models}
      P7_4_MODEL_MIXING: {stages: [ST2_IMPLEMENT, ST3_CHALLENGE, ST4_RUNTIME], condition: neural_gate_ACTIVATE}
    authority_cap_before_measured_consumer: A3

