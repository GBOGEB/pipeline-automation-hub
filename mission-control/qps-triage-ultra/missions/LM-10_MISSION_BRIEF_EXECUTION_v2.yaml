      - {id: U07, role: Cartographer_Oculars, current_load: CONTROL, activation: LOW_COST_CONTROL_SUPPORT}
  G5_REX_KEB_CHALLENGE:
    purpose: academic_provenance_assumption_challenge_recurrence_and_doctrine_return
    members:
      - {id: U08, role: REX_KEB_Integrator, current_load: CONTROL, activation: LOW_COST_CONTROL_SUPPORT}
