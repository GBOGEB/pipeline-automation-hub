  G1_MATH_ANALYSIS:
    purpose: PCA_RMT_BT_ANOVA_resource_weighting_and_convergence
    members:
      - {id: U05, role: Analyst_DMAIC_PCA_BT, current_load: BD0_RUNTIME_LANE_SCHEDULER, activation: AFTER_RETURN_OR_EXPLICIT_REBALANCE}
      - {id: S04, role: Scientist_Domain_Validation, current_load: ACTIVE_W3_12, activation: AFTER_RETURN_OR_EXPLICIT_REBALANCE}
