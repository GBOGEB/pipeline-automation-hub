schema: qps.mission_control.mission_brief.v2
mission_id: LM-10
mission_name: GG_MATH_SIGNAL_EXTRACTION
mission_class: LOCAL_SINGLE_FRONTIER_HETEROGENEOUS_MATH
mission_control_node: QPS_TRIAGE_ULTRA
home_repo: GBOGEB/pipeline-automation-hub
frontier_repo: GBOGEB/gg_MATH
consumer_repos:
  - GBOGEB/ABACUS
  - GBOGEB/cryoplant-project
state: BD0_STAGED_WITH_NONBLOCKING_SOURCE_EXECUTION
authority_transfer: false
parent_protocol:
  operational_primitive: MISSION_WAVE_PULSE_RECEIPT_REALLOCATE_RECURSE
  execution_method: THREE_PULSE_MIP_WITH_FIRST_RED_RECURSION
  source_protocols:
    - mission-control/qps-triage-ultra/README.md
    - mission-control/qps-triage-ultra/architecture.yaml
    - mission-control/qps-triage-ultra/crew/CREW_REGISTRY_v1.json
    - mission-control/qps-triage-ultra/HANDOVER_SESSION_2026-09-12_RUNNER_CREW.yaml
    - mission-control/qps-triage-ultra/missions/LM-10_GG_MATH_SIGNAL_EXTRACTION_v1.yaml

mission_brief:
  purpose: >-
    Build, challenge, execute, calibrate and govern an eleven-point mathematical
    signal-extraction stack for QPS TRIAGE using a single heterogeneous frontier.
    The mission must produce reusable mathematical kernels, explicit assumptions,
    exact-SHA runtime receipts, PCA-directed diminishing resource allocation,
    governed measured diagnostics and REX suitable for later multi-frontier missions.
    It must not convert mathematical plausibility into engineering, compliance,
    procurement, negotiation, acceptance or release authority.
  end_state: >-
    H01-H10 have executable reference or production implementations with explicit
    authority class, challenge evidence and receipt lineage; at least one measured
    QPS consumer has ACCEPT/REJECT/DEFER-dispositioned a typed math receipt; REX is
    returned to HOME; a later distinct-source repeat demonstrates no regression.
    H11 remains gated until its data-contract, leakage and baseline prerequisites pass.
  mission_shape:
    frontier_count: 1
    frontier: GBOGEB/gg_MATH
    home: GBOGEB/pipeline-automation-hub
    primary_measured_consumer: GBOGEB/ABACUS
    domain_authority_consumer: GBOGEB/cryoplant-project
    grand_mission_member: false
    analogy: GM-I_SINGLE_FRONTIER_SHAPE_ONLY

strategic_context:
  non_displacement: true
  global_non_compensating_first_red: GBOGEB/cryoplant-project#923
  global_runtime_DoV: WITHHELD_AT_PRIVATE_RUNNER_ADMISSION
  existing_sole_strategic_gate: W3_12_LICENSED_HEPAK_NUMERIC_RECEIPT
  rule: >-
    Public gg_MATH, Mission Control or ABACUS success does not compensate private
    cryoplant runner admission, licensed HEPAK evidence, or any domain acceptance gate.

primary_objectives:
  P1:
    name: COMPLETE_H01_H10_STACK
    definition: >-
      Implement or explicitly DEFER every H01-H10 mathematical family with canonical
      source, assumptions, formula namespace, executable kernel, independent challenge,
      exact-SHA receipt and authority class.
  P2:
    name: PCA_DIRECTED_RESOURCE_ALLOCATION
    definition: >-
      Use PCA and measured residual work structure to weight eligible nonblocking legs,
      with diminishing allocation after evidence-backed closure and a small CONTROL floor.
  P3:
    name: GOVERNED_MEASURED_QPS_CONSUMPTION
    definition: >-
      Feed typed mathematical receipts into the existing ABACUS/QPS measured consumer
      path and obtain explicit ACCEPT/REJECT/DEFER without authority leakage.
  P4:
    name: REX_AND_REPEAT_CONTROL
    definition: >-
      Convert first-reds, repairs, assumption failures and successful controls into REX,
      then prove a later distinct-source repeat before recurrent CONTROL.

secondary_objectives:
  S1: produce Plotly visual receipts for scree/MP/PA95, PC1-PC3 loadings, graph spectrum, SDE/MC paths, regime maps and temporal DAG.
  S2: maintain a post-2000 academic register with primary-source provenance and explicit model-domain caveats.
  S3: establish typed bridges among PCA, RMT, BT/Pearson, ANOVA, Monte Carlo/SDE, graph and temporal analyses without conflating evidence classes.
  S4: create reusable resource-allocation and authority patterns for GM-IV later frontiers and possible future GM-V activation.
  S5: preserve visual/source screenshots or page images as explanatory audit evidence where useful, without treating them as mathematical proof.

out_of_scope:
  - engineering_design_acceptance
  - compliance_acceptance
  - procurement_or_bidder_decision
  - negotiation_authority
  - QPS_release_authority
  - Grand_Mission_registry_mutation
  - fabrication_of_measured_data
  - DNN_or_CNN_maturity_before_H11_gate
  - repairing_cryoplant_application_code_while_issue_923_is_zero_step

authority:
  ladder:
    A0_REFERENCE: literature_or_formula_only
    A1_IMPLEMENTED: code_exists_not_independently_challenged
    A2_VERIFIED_KERNEL: independent_challenge_passed
    A3_SYNTHETIC_CALIBRATED: bounded_synthetic_fixture_only
    A4_MEASURED_DIAGNOSTIC: real_QPS_data_no_decision_authority
    A5_GOVERNED_CONSUMER: QPS_consumed_with_source_gate_and_disposition
    A6_DOMAIN_AUTHORITY: external_TM_QA_Governor_domain_contract_only
  promotion_owner:
    A0_to_A1: bounded_builder_plus_source_provenance
    A1_to_A2: independent_verification_receipt
    A2_to_A3: synthetic_calibration_receipt
    A3_to_A4: measured_consumer_with_real_data_identity
    A4_to_A5: governed_QPS_disposition
    A5_to_A6: Technical_Manager_QA_Governor_only
  hard_rule: >-
    paper_exists_to_python_runs_to_graph_plausible_to_QPS_ACCEPT is forbidden.
  mandatory_lineage:
    - source
    - assumptions
    - formula
    - implementation
    - independent_challenge
    - runtime_receipt
    - synthetic_or_measured_class
    - QPS_disposition
    - authority_class
    - REX

bd_lifecycle:
  states: [TODO, ACTIVE, DONE, CONTROL]
  rules:
    TODO: named_work_not_started_or_not_ready
    ACTIVE: currently_executed_named_first_red_or_slice
    DONE: implemented_and_exact_source_proven_once
    CONTROL: prevention_or_detection_control_plus_later_distinct_source_repeat
  orthogonal_to_authority: true

mathematical_canon:
  H01: MATRIX_CORE_SVD_PSEUDOINVERSE_CONDITION_PROJECTION
  H02: COVARIANCE_CORRELATION_ANOVA_EFFECT_SIZE_MULTIPLICITY
  H03: PCA_PARALLEL_ANALYSIS_LOADING_STABILITY_ORTHOGONAL_TRANSFORMS
  H04: RMT_MP_BBP_FINITE_SAMPLE_SHRINKAGE
  H05: BRADLEY_TERRY_PEARSON_TYPED_RELATIONAL_BRIDGE
  H06: MONTE_CARLO_SDE_LANGEVIN_FOKKER_PLANCK_REFERENCE
  H07: SPECTRAL_GRAPH_LAPLACIAN_GFT_FILTERS_TOPOLOGY_VALIDATION
  H08: CALCULUS_INTEGRATION_DIFFERENTIATION_SECOND_DERIVATIVE_SMOOTHING
  H09: ASYMPTOTICS_REGIME_MAPS_DIMENSIONLESS_RATIOS
  H10: TEMPORAL_DAG_LINEAGE_CONGRUENCE_DRIFT
  H11: ML_BASELINES_MODEL_MIXING_DNN_CNN_CONDITIONAL
  H11_gate:
    state: DEFER_DATA_CONTRACT_FIRST
    prerequisites:
      - immutable_feature_target_contract
      - explicit_units_and_schema
      - leakage_tests
      - temporal_or_group_split_policy
      - simple_baseline_models
      - sample_size_and_geometry_justification
      - ablation_plan
      - OOD_or_drift_plan
    forbidden_credit: neural_network_instantiation_is_not_maturity
  lambda_namespace:
    unqualified_lambda_forbidden: true
    allowed_examples:
      - lambda_eig_i
      - lambda_MP_plus
      - lambda_failure
      - lambda_Laplacian_i
      - lambda_regularization
  rmt_guard:
    mp_white_null: lambda_MP_plus_equals_sigma2_times_1_plus_sqrt_p_over_n_squared
    bbp_population_threshold_is_separate: true
    above_mp_classification: OUTLIER_CANDIDATE
    automatic_true_signal: false
    required_context: [null_model, p, n, sigma2, preprocessing, finite_sample_check, stability, provenance]

crew_groups:
  G0_COMMAND_AND_AUTHORITY:
    purpose: mission_state_gate_scope_and_authority_boundary
    members:
      - {id: U01, role: Mission_Commander_Governor, current_load: CONTROL_AND_GATE, activation: ALWAYS_GATE_ONLY}
      - {id: U02, role: Chief_Architect_Architecture_Hat, current_load: CONTROL, activation: ARCHITECTURE_REVIEW}
      - {id: U03, role: Project_Manager_DOW, current_load: BD0_RUNTIME_LANE_SCHEDULER, activation: AFTER_RETURN_OR_EXPLICIT_REBALANCE}
