      - {id: U04, role: Fleet_Orchestrator, current_load: ACTIVE_CONTROL_MIX, activation: DISPATCH_ONLY}
    interim_execution: PUBLIC_GG_MATH_ACTIONS
  G3_VERIFICATION_AND_ATTESTATION:
    purpose: exact_SHA_independent_challenge_receipt_and_message_HOME
    members:
      - {id: U06, role: QA_Signalman_Verifier, current_load: ACTIVE_W3_12, activation: AFTER_RETURN_OR_EXPLICIT_REBALANCE}
